let currentArticleId = null;
let currentBilingual = false;

function hideBilingual() {
  currentBilingual = false;
  var btn = document.getElementById('translateBtn');
  if (btn) {
    btn.textContent = 'Full Translation';
    btn.classList.remove('on');
  }
  var bc = document.getElementById('bilingualContainer');
  if (bc) bc.innerHTML = '';
  var et = document.getElementById('englishText');
  if (et) et.style.display = '';
}

function makeClickable(text) {
  return (text || '').split(/(\s+)/g).map(function(token) {
    if (/^\s+$/.test(token)) return token;
    var wordOnly = token.replace(/[^a-zA-Z'-]/g, '');
    if (wordOnly.length <= 1) return token;
    return '<span class="word" data-word="' + wordOnly.toLowerCase() + '" onclick="lookupWord(event,this.getAttribute(\'data-word\'))">' + token + '</span>';
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatSource(source) {
  if (!source) return '';
  const urlMatch = source.match(/(https?:\/\/[^\s,]+)/);
  var formatted = escapeHtml(source);
  if (urlMatch) {
    formatted = formatted.replace(urlMatch[0],
      '<a href="' + urlMatch[0] + '" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">[Read original]</a>');
  }
  return formatted;
}

// ==================== WORD LOOKUP ====================
let lookupCache = {};

function stemWord(word) {
  // Basic stemming for better dictionary hits
  var w = word.toLowerCase();
  if (w.endsWith('ies') && w.length > 4) return w.slice(0, -3) + 'y';
  if (w.endsWith('ves') && w.length > 4) return w.slice(0, -3) + 'f';
  if (w.endsWith('es') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('s') && !w.endsWith('ss') && w.length > 3) return w.slice(0, -1);
  if (w.endsWith('ing') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ed') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('er') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('est') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ly') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('tion') && w.length > 6) return w.slice(0, -4) + 'e';
  if (w.endsWith('ment') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('ness') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('able') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('ful') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('less') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('ous') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ive') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('al') && w.length > 4) return w.slice(0, -2);
  return word;
}

async function lookupWord(event, word) {
  event.stopPropagation();
  document.querySelectorAll('.word.active').forEach(function(w) { w.classList.remove('active'); });
  event.target.classList.add('active');

  var panel = document.getElementById('wordPanel');
  var content = document.getElementById('wpContent');
  panel.classList.add('show');
  content.innerHTML = '<div class="wp-loading"><div class="spinner"></div> Looking up... </div>';

  if (lookupCache[word]) {
    content.innerHTML = lookupCache[word];
    return;
  }

  // Fetch Chinese translation + dictionary entry in parallel
  var zhPromise = getChineseTranslation(word);
  var dictPromise = getDictionaryEntry(word);

  var zh = await zhPromise;
  var dict = await dictPromise;

  renderWordPanel(word, zh, dict);
}

function closeWordPanel() {
  document.getElementById('wordPanel').classList.remove('show');
  document.querySelectorAll('.word.active').forEach(function(w) { w.classList.remove('active'); });
}

async function getChineseTranslation(word) {
  // Immersive Translate extension
  try {
    if (window.immersiveTranslate && typeof window.immersiveTranslate.translateText === 'function') {
      var imText = await window.immersiveTranslate.translateText(word);
      if (imText && imText !== word) return imText;
    }
  } catch (e) {}
  // MyMemory API
  try {
    var res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en|zh-CN');
    if (res.ok) {
      var data = await res.json();
      var t = data.responseData && data.responseData.translatedText;
      if (t && t.toLowerCase() !== word.toLowerCase()) return t;
    }
  } catch (e) {}
  return '';
}

async function getDictionaryEntry(word) {
  var wordsToTry = [word];
  var stemmed = stemWord(word);
  if (stemmed !== word) wordsToTry.push(stemmed);

  for (var i = 0; i < wordsToTry.length; i++) {
    try {
      var res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(wordsToTry[i]));
      if (!res.ok) continue;
      var data = await res.json();
      if (data && data.length > 0) {
        return { entry: data[0], usedWord: wordsToTry[i], stemmed: stemmed !== word && wordsToTry[i] === stemmed };
      }
    } catch (e) {}
  }
  return null;
}

function renderWordPanel(originalWord, zh, dictResult) {
  var content = document.getElementById('wpContent');
  var html = '';

  var displayWord = dictResult && dictResult.entry ? dictResult.entry.word : originalWord;

  html += '<div class="wp-header">';
  html += '<div>';
  html += '<div class="wp-word">' + escapeHtml(displayWord) + '</div>';
  if (dictResult && dictResult.entry) {
    var ph = '';
    if (dictResult.entry.phonetic) ph = dictResult.entry.phonetic;
    else if (dictResult.entry.phonetics && dictResult.entry.phonetics.length > 0 && dictResult.entry.phonetics[0].text) {
      ph = dictResult.entry.phonetics[0].text;
    }
    if (ph) html += '<div class="wp-phonetic">' + escapeHtml(ph) + '</div>';
  }
  html += '</div>';
  html += '<button class="wp-close" onclick="closeWordPanel()">&times;</button>';
  html += '</div>';

  html += '<div class="wp-body">';

  // Chinese translation
  if (zh) {
    html += '<div class="wp-zh">' + escapeHtml(zh) + '</div>';
  }

  // Word forms (鍘熷瀷 / root)
  var stemmedRoot = stemWord(originalWord);
  if (stemmedRoot !== originalWord.toLowerCase() || (dictResult && dictResult.stemmed)) {
    html += '<div class="wp-section-label">Base form</div>';
    html += '<div class="wp-forms"><span class="wp-form-chip">' + escapeHtml(stemmedRoot) + '</span></div>';
  }

  // Dictionary definitions
  if (dictResult && dictResult.entry) {
    var entry = dictResult.entry;
    var totalDefs = 0;
    for (var mi = 0; mi < entry.meanings.length; mi++) {
      var m = entry.meanings[mi];
      if (totalDefs >= 8) break;
      html += '<div class="wp-meaning">';
      html += '<div class="wp-pos">' + escapeHtml(m.partOfSpeech) + '</div>';
      var shownInPos = 0;
      for (var di = 0; di < m.definitions.length && totalDefs < 8; di++) {
        var def = m.definitions[di];
        html += '<div class="wp-def"><span class="def-num">' + (shownInPos + 1) + '.</span>' + escapeHtml(def.definition) + '</div>';
        if (def.example) {
          html += '<div class="wp-example">"' + escapeHtml(def.example) + '"</div>';
        }
        if (def.synonyms && def.synonyms.length > 0 && shownInPos === 0) {
          html += '<div class="wp-syn"><b>syn</b> ' + def.synonyms.slice(0, 5).map(function(s) { return escapeHtml(s); }).join(', ') + '</div>';
        }
        shownInPos++;
        totalDefs++;
      }
      html += '</div>';
    }
  } else {
    html += '<div class="wp-not-found">No definition found for "' + escapeHtml(originalWord) + '".</div>';
  }

  html += '</div>';

  lookupCache[originalWord] = html;
  content.innerHTML = html;
}

// ==================== FULL TEXT TRANSLATION ====================
function splitSentences(text) {
  var cleaned = text.replace(/\s+/g, ' ').trim();
  var sentences = cleaned.match(/[^.!?]+[.!?]+["']?|\S+$/g) || [];
  var result = [];
  var buffer = '';
  for (var i = 0; i < sentences.length; i++) {
    var s = sentences[i].trim();
    if (buffer.length + s.length < 480) {
      buffer += (buffer ? ' ' : '') + s;
    } else {
      if (buffer) result.push(buffer);
      buffer = s;
    }
  }
  if (buffer) result.push(buffer);
  return result;
}

async function toggleFullTranslation(passageId) {
  currentArticleId = passageId;
  var btn = document.getElementById('translateBtn');
  var bc = document.getElementById('bilingualContainer');
  var et = document.getElementById('englishText');

  // If currently showing bilingual, hide it
  if (currentBilingual) {
    hideBilingual();
    return;
  }

  // Show loading state
  btn.textContent = 'Translating...';
  btn.classList.add('on');
  bc.classList.add('show');
  bc.innerHTML = '<div class="loading-indicator"><div class="spinner"></div><div style="margin-top:10px;font-size:0.85rem;">Translating...</div></div>';

  var passage = findPassageById(passageId);
  if (!passage) {
    btn.textContent = 'Full Translation';
    return;
  }

  var cacheKey = 'translation-' + passageId;
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch(e) {}

  if (cached && cached.sentences && cached.sentences.length > 0) {
    renderBilingual(passage, cached.sentences);
    btn.textContent = 'Hide Translation';
    currentBilingual = true;
    return;
  }

  var sentences = splitSentences(passage.en || '');
  var translated = [];
  var failed = 0;

  for (var i = 0; i < sentences.length; i++) {
    try {
      var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentences[i]) + '&langpair=en|zh-CN';
      var res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var zh = data.responseData && data.responseData.translatedText;
      if (zh && zh !== sentences[i]) {
        translated.push(zh);
      } else {
        translated.push('');
        failed++;
      }
    } catch (e) {
      translated.push('');
      failed++;
    }
  }

  // Cache result
  try {
    localStorage.setItem(cacheKey, JSON.stringify({ sentences: translated, en: sentences }));
  } catch(e) {}

  if (failed === sentences.length) {
    bc.innerHTML = '<div class="no-results" style="font-size:0.85rem;">Translation unavailable. Please try again later.</div>';
    btn.textContent = 'Full Translation';
    btn.classList.remove('on');
    currentBilingual = false;
    return;
  }

  renderBilingual(passage, translated, sentences);
  btn.textContent = 'Hide Translation';
  currentBilingual = true;
}

function renderBilingual(passage, zhLines, enLines) {
  var bc = document.getElementById('bilingualContainer');
  var et = document.getElementById('englishText');
  if (et) et.style.display = 'none';

  var html = '<div class="bilingual-text show">';
  var enSentences = enLines || splitSentences(passage.en || '');
  for (var i = 0; i < enSentences.length; i++) {
    var enClickable = makeClickable(enSentences[i]);
    var zh = zhLines[i] || '';
    html += '<p class="en-line">' + enClickable + '</p>';
    if (zh) html += '<p class="zh-line">' + zh + '</p>';
  }
  html += '</div>';
  bc.innerHTML = html;
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('word') && !e.target.closest('.word-panel')) {
    closeWordPanel();
  }
});

// ==================== ARCHIVE ====================
function renderArchive() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const list = document.getElementById('archiveList');
  let filtered = [...DB_PASSAGES];

  if (searchTerm) {
    filtered = filtered.filter(p =>
      (p.title && p.title.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.en && p.en.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.source && p.source.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.tags && p.tags.some(t => t.toLowerCase().indexOf(searchTerm) !== -1))
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">No matching articles found.</div>';
    return;
  }

  list.innerHTML = filtered.map(p => {
    const d = p.created_at ? new Date(p.created_at) : new Date();
    const dateStr = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    const preview = (p.en || '').replace(/\s+/g,' ').substring(0, 140) + '...';
    const tags = p.tags && Array.isArray(p.tags) ? p.tags : [];
    const srcPreview = (p.source || '').substring(0, 80);

    return '<div class="archive-item" onclick="openPassage(' + p.id + ')">' +
      '<div class="archive-date">' + dateStr + '</div>' +
      '<div class="archive-title">' + escapeHtml(p.title) + '</div>' +
      '<div class="archive-preview">' + escapeHtml(preview) + '</div>' +
      '<div class="archive-tags">' + tags.map(t => '<span class="archive-tag">' + escapeHtml(t) + '</span>').join('') + '</div>' +
      '<div class="archive-source">' + escapeHtml(srcPreview) + '</div>' +
      '</div>';
  }).join('');
}

// ==================== MODAL ====================
function openPassage(id) {
  const passage = findPassageById(id);
  if (!passage) return;

  var titleHtml = makeClickable(passage.title);
  var bodyHtml = makeClickable(passage.en || '');

  document.getElementById('modalInner').innerHTML =
    '<h2 style="color:var(--accent);font-weight:400;margin-bottom:20px;">' + titleHtml + '</h2>' +
    '<div class="english-text">' + bodyHtml + '</div>' +
    '<div class="source-citation" style="margin-bottom:20px;">' + formatSource(passage.source) + '</div>';

  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
  closeWordPanel();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModalDirect();
    closeWordPanel();
  }
});

// ==================== TIMELINE ====================
let tooltipShowDelay = null;
let tooltipHideDelay = null;

function buildDateMap() {
  // Sort articles by created_at, map each to a consecutive day ending today
  var sorted = [...DB_PASSAGES].sort(function(a, b) {
    return new Date(a.created_at) - new Date(b.created_at);
  });
  var map = [];
  var today = new Date();
  for (var i = 0; i < sorted.length; i++) {
    var d = new Date(today);
    d.setDate(d.getDate() - (sorted.length - 1 - i));
    map.push({ date: d, article: sorted[i] });
  }
  return map;
}

function renderTimeline() {
  var container = document.getElementById('timeline');
  if (!container) return;
  var dateMap = buildDateMap();
  var todayStr = new Date().toDateString();

  var year = new Date().getFullYear();
  var html = '<div class="timeline-year">' + year + '</div>';
  html += '<div class="timeline-scroll">';
  for (var i = 0; i < dateMap.length; i++) {
    var entry = dateMap[i];
    var dateStr = entry.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var isToday = entry.date.toDateString() === todayStr;
    var activeClass = entry.article.id === selectedPassageId ? ' active' : '';
    html += '<div class="timeline-row" data-id="' + entry.article.id + '" onmouseenter="showTimelineTooltip(this,' + entry.article.id + ')" onmouseleave="hideTimelineTooltip()" onclick="openPassage(' + entry.article.id + ')">' +
      '<span class="timeline-date-label">' + dateStr + '</span>' +
      '<span class="timeline-item has-article' + activeClass + '"></span>' +
      '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function showTimelineTooltip(rowEl, articleId) {
  clearTimeout(tooltipHideDelay);
  var article = findPassageById(articleId);
  if (!article) return;
  var card = document.getElementById('timelineCard');
  var dot = rowEl.querySelector('.timeline-item');
  var rect = dot.getBoundingClientRect();
  var d = new Date(article.created_at);

  document.getElementById('cardTitle').textContent = article.title;
  document.getElementById('cardMeta').innerHTML =
    d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) +
    ' | ' + (article.word_count || '') + ' words';
  var tagsHtml = '';
  var tags = article.tags || [];
  for (var i = 0; i < Math.min(tags.length, 3); i++) {
    tagsHtml += '<span class="card-tag">' + escapeHtml(tags[i]) + '</span>';
  }
  document.getElementById('cardTags').innerHTML = tagsHtml;

  var cardWidth = Math.min(280, window.innerWidth * 0.25);
  var cardLeft = rect.right + 24;
  var cardTop = rect.top + rect.height / 2 - 70;
  if (cardLeft + cardWidth > window.innerWidth - 20) cardLeft = rect.right - cardWidth - 30;
  card.style.left = cardLeft + 'px';
  card.style.top = Math.max(10, Math.min(cardTop, window.innerHeight - 190)) + 'px';

  // Apple-style: slight delay before flip reveal
  clearTimeout(tooltipShowDelay);
  tooltipShowDelay = setTimeout(function() {
    card.classList.add('show');
  }, 100);
}

function hideTimelineTooltip() {
  clearTimeout(tooltipShowDelay);
  clearTimeout(tooltipHideDelay);
  // Grace period so the flip animation can finish before hiding
  tooltipHideDelay = setTimeout(function() {
    document.getElementById('timelineCard').classList.remove('show');
  }, 350);
}

// ==================== START ====================
init();
renderTimeline();
</script>
