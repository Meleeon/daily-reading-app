<html lang="en">
<head>
<meta charset="UTF-8">

<title>Daily Reading</title>
<style>
:root {
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --accent: #8b5e3c;
  --accent-light: #f0e4d8;
  --border: #e0d5c1;
  --shadow: 0 2px 16px rgba(0,0,0,0.06);
  --highlight: #fff3cd;
  --tooltip-bg: #1e1b18;
  --tooltip-text: #f5efe4;
  --tag-bg: #f5efe4;
  --tag-text: #6b5e4a;
  --input-bg: #faf8f5;
}
[data-theme="dark"] {
  --bg: #1a1815;
  --card-bg: #252220;
  --text: #e8dcc8;
  --text-secondary: #a69880;
  --accent: #c9975a;
  --accent-light: #3d3022;
  --border: #3d3424;
  --shadow: 0 2px 16px rgba(0,0,0,0.3);
  --highlight: #4a3f1a;
  --tooltip-bg: #f0e6d3;
  --tooltip-text: #1e1b18;
  --tag-bg: #2d2820;
  --tag-text: #a69880;
  --input-bg: #252220;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Georgia', 'Times New Roman', 'Noto Serif', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
  transition:background 0.3s,color 0.3s;
}
.container { max-width:860px; margin:0 auto; padding:20px 24px 60px; }
.header {
  display:flex; justify-content:space-between; align-items:center;
  padding:20px 0; border-bottom:1px solid var(--border); margin-bottom:28px;
}
.header h1 { font-size:1.4rem; font-weight:400; letter-spacing:0.04em; color:var(--accent); }
.header-actions { display:flex; gap:10px; align-items:center; }
.header-btn {
  background:none; border:1px solid var(--border); color:var(--text-secondary);
  padding:6px 14px; border-radius:20px; cursor:pointer; font-size:0.82rem;
  font-family:inherit; transition:all 0.2s;
}
.header-btn:hover { border-color:var(--accent); color:var(--accent); }
.status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }
.status-dot.online { background:#4a7c59; }
.status-dot.offline { background:#c44; }
.tabs { display:flex; gap:0; margin-bottom:24px; border-bottom:1px solid var(--border); }
.tab {
  padding:8px 20px; cursor:pointer; font-size:0.9rem; color:var(--text-secondary);
  border-bottom:2px solid transparent; transition:all 0.2s; background:none; border-top:none;
  border-left:none; border-right:none; font-family:inherit;
}
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.daily-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;
}
.date-badge {
  font-size:0.82rem; color:var(--text-secondary); background:var(--accent-light);
  padding:4px 14px; border-radius:20px;
}
.passage-card {
  background:var(--card-bg); border-radius:10px; padding:32px 28px;
  box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:24px;
}
.passage-card h2 {
  font-size:1.2rem; font-weight:400; margin-bottom:20px;
  color:var(--accent); letter-spacing:0.02em;
}
.english-text {
  font-size:1.08rem; line-height:1.5; margin-bottom:24px; text-align:justify;
  -webkit-font-smoothing: antialiased;
}
.english-text .word {
  cursor:pointer; transition:background 0.15s; border-radius:3px; padding:1px 2px; margin:0 -1px;
}
.english-text .word:hover { background:var(--highlight); }
.english-text .word.active { background:var(--highlight); }
.source-citation {
  font-size:0.82rem; color:var(--text-secondary); font-style:italic;
  padding-top:14px; border-top:1px solid var(--border);
}
.translate-toggle { display:flex; gap:10px; align-items:center; margin-top:16px; }
.toggle-btn {
  background:none; border:1px solid var(--border); color:var(--text-secondary);
  padding:7px 18px; border-radius:20px; cursor:pointer; font-size:0.82rem;
  font-family:inherit; transition:all 0.2s;
}
.toggle-btn:hover { border-color:var(--accent); color:var(--accent); }
.toggle-btn.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.bilingual-text { margin-top:18px; display:none; }
.bilingual-text.show { display:block; }
.en-line {
  font-family:'Georgia','Times New Roman',serif;
  font-size:1.05rem; line-height:1.5; color:var(--text);
  margin-bottom:4px; text-align:justify;
}
.zh-line {
  font-size:0.95rem; line-height:1.5; color:var(--text-secondary);
  margin-bottom:12px; padding-left:14px; border-left:2px solid var(--accent-light);
}
.timeline {
  position:fixed; left:max(20px, calc(50% - 640px));
  top:50%; transform:translateY(-50%);
  z-index:900; display:flex; flex-direction:column; align-items:flex-end;
  max-height:78vh;
  opacity:0; animation:timelineIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
}
@keyframes timelineIn {
  from { opacity:0; transform:translateY(-50%) translateX(-18px); }
  to { opacity:1; transform:translateY(-50%) translateX(0); }
}
.timeline-year {
  font-size:0.78rem; color:var(--accent); letter-spacing:0.12em;
  font-weight:600; margin-bottom:10px;
  background:var(--bg); padding:2px 6px; border-radius:4px; z-index:2;
  opacity:0; animation:yearIn 0.6s cubic-bezier(0.22,1,0.36,1) 0.5s forwards;
}
@keyframes yearIn {
  from { opacity:0; transform:translateY(-10px); }
  to { opacity:1; transform:translateY(0); }
}
.timeline-scroll {
  position:relative;
  overflow-y:auto; max-height:calc(78vh - 40px);
  scrollbar-width:none; -ms-overflow-style:none;
  scroll-behavior:smooth;
  padding:4px 0;
}
.timeline-scroll::-webkit-scrollbar { display:none; }
.timeline-scroll::before {
  content:''; position:absolute; right:5px; top:8px; bottom:8px;
  width:1.5px; background:var(--border); border-radius:1px;
  transform:translateX(50%);
}
.timeline-row {
  position:relative; display:flex; align-items:center; justify-content:flex-end;
  gap:14px; cursor:pointer; padding:7px 4px;
}
.timeline-date-label {
  font-size:0.72rem; color:var(--text-secondary); white-space:nowrap;
  font-weight:600; pointer-events:none;
  transition:color 0.25s ease;
}
.timeline-row:hover .timeline-date-label { color:var(--accent); }
.timeline-item {
  position:relative; width:12px; height:12px; border-radius:50%;
  flex-shrink:0;
  background:var(--card-bg); border:2px solid var(--border); cursor:pointer;
  z-index:1;
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
             background 0.25s ease,
             border-color 0.25s ease,
             box-shadow 0.35s cubic-bezier(0.22,1,0.36,1);
}
.timeline-item.has-article { border-color:var(--accent); background:var(--accent); }
.timeline-row:hover .timeline-item {
  transform:scale(1.7);
  background:var(--accent);
  box-shadow:0 0 0 5px var(--accent-light);
}
.timeline-item.active { box-shadow:0 0 0 5px var(--accent-light); }
.timeline-row:active .timeline-item { transform:scale(1.3); }
.timeline-article-card {
  position:fixed; z-index:3000; pointer-events:none;
  opacity:0; visibility:hidden;
  transition:opacity 0.18s ease, visibility 0.18s ease;
}
.timeline-article-card.show { opacity:1; visibility:visible; }
.timeline-article-card .card-inner {
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 18px;
  max-width:300px;
  box-shadow:0 14px 44px rgba(0,0,0,0.2);
  transform-origin:left center;
  transform:perspective(900px) rotateY(72deg) translateX(-14px);
  backface-visibility:hidden;
  will-change:transform;
  transition:transform 0.55s cubic-bezier(0.22,1,0.36,1);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.timeline-article-card.show .card-inner {
  transform:perspective(900px) rotateY(0deg) translateX(0);
}
.card-title {
  font-size:0.85rem; font-weight:600; line-height:1.35;
  color:var(--text);
  margin-bottom:6px;
}
.card-meta {
  font-size:0.72rem; color:var(--text-secondary); line-height:1.4;
}
.card-tags { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
.card-tag {
  font-size:0.68rem; background:var(--accent-light); color:var(--accent);
  padding:1px 8px; border-radius:9px;
}
@media (max-width:1120px) { .timeline { display:none; } }
.word-panel {
  position:fixed; right:0; top:72px;
  width:330px; max-height:calc(100vh - 100px);
  overflow-y:auto;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-right:none;
  border-radius:14px 0 0 14px;
  box-shadow:-8px 4px 40px rgba(0,0,0,0.18);
  z-index:2600;
  transform:translateX(105%);
  transition:transform 0.45s cubic-bezier(0.22,1,0.36,1);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding:0;
}
.word-panel.show { transform:translateX(0); }
.wp-header {
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:20px 22px 14px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--card-bg); z-index:2;
}
.wp-word {
  font-family:'Georgia','Times New Roman',serif;
  font-size:1.5rem; font-weight:700; color:var(--text);
}
.wp-phonetic {
  font-size:0.85rem; color:var(--accent); margin-top:2px;
}
.wp-close {
  background:none; border:none; font-size:1.3rem; cursor:pointer;
  color:var(--text-secondary); line-height:1; padding:4px;
}
.wp-close:hover { color:var(--text); }
.wp-body { padding:16px 22px 24px; }
.wp-zh {
  font-size:1.05rem; color:var(--accent); margin-bottom:14px; line-height:1.5;
}
.wp-section-label {
  font-size:0.68rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--text-secondary); margin:14px 0 6px;
}
.wp-forms {
  display:flex; flex-wrap:wrap; gap:6px;
}
.wp-form-chip {
  font-size:0.78rem; background:var(--accent-light); color:var(--accent);
  padding:2px 10px; border-radius:10px;
}
.wp-meaning { margin-bottom:12px; }
.wp-pos {
  font-size:0.8rem; font-style:italic; color:var(--accent);
  margin:10px 0 4px; font-weight:600;
}
.wp-def {
  font-size:0.86rem; line-height:1.5; color:var(--text);
  margin-bottom:6px; padding-left:4px;
}
.wp-def .def-num { color:var(--accent); font-weight:600; margin-right:6px; }
.wp-example {
  font-size:0.78rem; color:var(--text-secondary); font-style:italic;
  margin:2px 0 6px 16px; line-height:1.45;
}
.wp-syn {
  font-size:0.75rem; color:var(--text-secondary); margin-left:16px;
}
.wp-syn b { color:var(--accent); font-weight:600; }
.wp-loading {
  padding:30px 22px; color:var(--text-secondary); font-size:0.85rem;
  display:flex; align-items:center; gap:8px;
}
.spinner {
  display:inline-block; width:14px; height:14px; border:2px solid var(--border);
  border-top-color:var(--accent); border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.wp-not-found { padding:30px 22px; color:var(--text-secondary); font-size:0.85rem; }
@media (max-width:640px) { .word-panel { width:88vw; } }
.passages-list { display:none; }
.passages-list.show { display:block; }
.search-bar {
  display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;
}
.search-input {
  flex:1; min-width:200px; padding:10px 16px; border:1px solid var(--border);
  border-radius:20px; font-size:0.88rem; background:var(--input-bg); color:var(--text);
  font-family:inherit;
}
.search-input:focus { outline:none; border-color:var(--accent); }
.archive-list { display:flex; flex-direction:column; gap:10px; }
.archive-item {
  background:var(--card-bg); border:1px solid var(--border); border-radius:8px;
  padding:18px 22px; cursor:pointer; transition:all 0.2s; box-shadow:var(--shadow);
}
.archive-item:hover { border-color:var(--accent); transform:translateY(-1px); }
.archive-item .archive-date { font-size:0.78rem; color:var(--text-secondary); margin-bottom:4px; }
.archive-item .archive-title { font-size:1rem; color:var(--text); margin-bottom:6px; }
.archive-item .archive-preview {
  font-size:0.85rem; color:var(--text-secondary); overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.archive-item .archive-tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.archive-tag {
  font-size:0.72rem; background:var(--tag-bg); color:var(--tag-text);
  padding:2px 10px; border-radius:10px;
}
.archive-item .archive-source { font-size:0.78rem; color:var(--accent); margin-top:6px; font-style:italic; }
.modal-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);
  z-index:999; display:none; justify-content:center; align-items:center; padding:20px;
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--card-bg); border-radius:14px; max-width:800px; width:100%;
  max-height:85vh; overflow-y:auto; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.3);
  position:relative;
}
.modal-close {
  position:absolute; top:14px; right:18px; background:none; border:none;
  font-size:1.4rem; cursor:pointer; color:var(--text-secondary); line-height:1;
}
.modal-close:hover { color:var(--text); }
.no-results { text-align:center; padding:40px; color:var(--text-secondary); font-size:0.9rem; }
.reading-stats { font-size:0.78rem; color:var(--text-secondary); }
.loading-indicator { text-align:center; padding:60px; color:var(--text-secondary); }
.spinner {
  display:inline-block; width:24px; height:24px; border:3px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
.loading-dot { animation:pulse 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2) { animation-delay:0.2s; }
.loading-dot:nth-child(3) { animation-delay:0.4s; }
@media (max-width:640px) {
  .container { padding:10px 14px 40px; }
  .passage-card { padding:22px 16px; }
  .english-text { font-size:1rem; }
  .header h1 { font-size:1.1rem; }
  .tab { padding:8px 14px; font-size:0.82rem; }
}
</style>
</head>

<div class="timeline" id="timeline"></div>
<div class="timeline-article-card" id="timelineCard">
  <div class="card-inner">
    <div class="card-title" id="cardTitle"></div>
    <div class="card-meta" id="cardMeta"></div>
    <div class="card-tags" id="cardTags"></div>
  </div>
</div>

<div class="container">

  <header class="header">
    <h1>Daily Reading</h1>
    <div class="header-actions">
      <span style="font-size:0.72rem;color:var(--text-secondary);display:flex;align-items:center;" id="dbStatus">
        <span class="status-dot offline"></span>Loading
      </span>
      <button class="header-btn" onclick="toggleTheme()" id="themeBtn">Dark</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="today" onclick="switchTab('today')">Today</button>
    <button class="tab" data-tab="archive" onclick="switchTab('archive')">Archive</button>
  </nav>

  <section id="todaySection">
    <div class="daily-header">
      <span class="date-badge" id="dateBadge"></span>
      <span class="reading-stats" id="readingStats"></span>
    </div>
    <div id="todayPassage"></div>
  </section>

  <section id="archiveSection" class="passages-list">
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search by title, keyword, author, date..." oninput="debounceSearch()">
      <button class="header-btn" onclick="document.getElementById('searchInput').value=''; renderArchive();">Clear</button>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </section>

</div>

<aside class="word-panel" id="wordPanel">
  <div id="wpContent"></div>
</aside>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModalDirect()">&times;</button>
    <div id="modalInner"></div>
  </div>
</div>

    en: "Long before AI, teaching machines promised to make education more efficient.  Their forgotten history reveals why that dream keeps falling short.  Children use counting frames in a classroom, 1930.  Source: Nationaal Archief / Spaarnestad Photo When entrepreneurs talk about innovation in education, their ideas tend to orbit around two seductive promises: automation and personalization.  They claim that new technologies --- such as tablets, adaptive learning, and classroom management software --- will relieve teachers of administrative drudgery while allowing students to learn independently.  But as Audrey Watters argues, this vision of the automated, individualized classroom is not new at all; in fact, it is an age-old fantasy, repackaged again and again for successive generations.  Audrey Watter s is the author of \" Teaching Machines.  \" In her book \" Teaching Machines ,\" Watters chronicles the little-known history of the 20th-century classroom devices that gave the book its title : machines designed to automate instruction, deliver instant feedback, and let students move through lessons on their own.  The earliest version was developed in 1924 by psychologist Sidney L.  Pressey, whose \"Automatic Teacher\" presented students with multiple-choice questions and recorded their answers.  The promise of Pressey's device, however, was derailed by the Great Depression.  Three decades later, the famed psychologist B.  F.  Skinner developed a teaching machine of his own, shaped by his controversial theories of behaviorism --- the idea that human learning can be molded through external repetition and reinforcement.  But in the end, Skinner's invention failed to survive the machinery of corporate bureaucracy and a broader culture wary of mechanizing the classroom.  For Watters, the rise and fall of the teaching machine was not just a curious chapter of educational history; it was an early expression of a dream that still shapes the classroom today.  In the interview below, edited for length and clarity, the author unpacks how Skinnerian logic still lingers in today's classrooms and what it means to resist an AI-dominated future that tech companies insist is inevitable.  \"Educators want students to understand what it means to have agency over their own learning.  We want them to develop curiosity,\" she says.  \"To say that the future is already written is antithetical to that. \" I want to start with the beginning of the book, where you critique Sal Khan's video on the history of education , in which he claims that the American school system has been technologically static since the late 1800s.  In your book, you call his version of history \"woefully inadequate --- offensively so.",

    en: "In trying to understand how we make better choices, I found an unlikely guide in the Renaissance architect's experiments with linear perspective.  Source image: Galleria Academia Firenze This article is part of our Footnotes series , in which authors reflect on a person, study, or curiosity --- whether obscure, well-known, recent, or historical --- that sparked or challenged their thinking, or never quite made it into their work.  I don't remember exactly when I first learned about Filippo Brunelleschi, but I know I wrote his name in dry-erase marker on the plastic wet wall panel that inexplicably covered the backside of my kitchen.  Brunelleschi was a true Renaissance man, remembered above all as a master architect.  But it was his pig-headed, ingenious endeavor to solve one of art's great mysteries that fascinated me.  His objective was so simple that it is almost baffling no one had managed it before the 1400s: Create the illusion of three-dimensional depth on a two-dimensional page.  Elspeth Kirkman is the author of \" Decisionscape . \" Maddeningly, the geometry required to crack the code of linear perspective had been understood for centuries before Brunelleschi came along.  So when I learned about him hitting the streets of Florence with a mirror, a canvas with a peephole in it, and his paintbrushes, I had to know: Why was something a seven-year-old can copy the basics of so hard to get right the first time?  The answer was surprisingly simple: Until the Renaissance, artists weren't trying to faithfully render the world exactly as we see it.  Their work concerned itself with other matters like religion and monarchs, and intuitive methods of suggesting depth were usually enough.  But the 1400s ushered in a new age in which rationalism was king, and with it came a desire to represent the world with a greater degree of fidelity in art.  Artists (and their patrons) now wanted to depict the visible world with greater accuracy --- suddenly, being able to accurately capture cityscapes, social interactions, and commercial scenes was considered important.  Navigating the societal shocks of the Renaissance required a kind of agility of perspective, and the appeal of being able to create and control our representation of space, distance, and depth must have been powerful.  With hindsight, my fascination with Brunelleschi came from a place of empathy.  While I can hardly compare myself to the great architect, I was also struggling with my own intellectual project: writing a book about decision-making.",

    id: 14, title: "How Shipping Container Disasters Became a Scientific Goldmine", created_at: "2026-08-14T07:06:22.849005+00:00",
    en: "Oceanographers have quietly used lost cargo to build the most precise maps of ocean currents ever created.  Shipping containers drift in heavy seas after being swept overboard from a container ship in the winter North Atlantic, 1980.  Credit: Wikimedia Commons .  To the casual observer, the look and feel of shipping containers suggests a world of smooth, lossless transportation, almost immaterial in its implementation of a logistical ideal.  However, the system is far from lossless.  In fact, during storms and shipwrecks, shipping containers regularly go overboard.  Alexander Klose is the author of \" The Container Principle ,\" from which this article is adapted.  Nobody knows exactly how many of these vast, 20- or 40-foot-long steel capsules --- stacked in the thousands in the cargo holds of each ship, carrying the stuff of the global economy --- are lost each year.  Shipping lines and insurance companies keep these figures under wraps.  But estimates suggest that of the hundreds of millions in circulation annually, several thousand containers vanish --- sometimes forever.  And what becomes of the containers that disappear?  If they reappear, then the matter is relatively simple.  Each standard container carries, on each of its four sides, a code clearly identifying it.  The codes for all containers worldwide are distributed by the Bureau International des Containers (BIC).  In cargo shippers' databases, the histories and current cargo of containers are recorded and accessible via their respective codes.  Thus, it can be determined what was in each container and for whom it was intended.  As long as the contents of a container have not been plundered outright, they can even be delivered to the recipient after an accident, albeit with some delay.  But it is, of course, more difficult when a container breaks open --- particularly on the high seas, leaving its freight to the whims of the wind and the waves.  In these cases, the contents are highly unlikely to ever reach their intended recipient.  Yet these mishaps are not all for naught.  In fact, while these lost shipping containers likely represent hundreds of millions of dollars in losses for the shipping industry, they have inadvertently been a boon to another community: oceanographers.  In May 1990, the Hansa Carrier , a German cargo ship traveling from Korea to the U. S. , lost 21 containers in a Pacific storm north of Japan, and four of the containers broke open.  The payload, more than 60,000 pairs of Nike sneakers, poured out into the sea.",
    source: "Alexander Klose, \"How Shipping Container Disasters Became a Scientific Goldmine,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/how-shipping-container-disasters-became-a-scientific-goldmine/",
    tags: ["academic","the-mit-press-reader","essay","themitpressreader"], difficulty: "advanced", word_count: 411

    id: 13, title: "Why Human Giants Defy the Laws of Physics", created_at: "2026-08-14T00:08:56.26857+00:00",
    en: "Without different anatomical proportions, a scaled-up body would collapse under its own weight.  Source: Adobe According to legend, giants once roamed the Earth.  In Homer's \"Odyssey,\" Odysseus encounters the Cyclops, the one-eyed son of Poseidon, living in a huge cavern, hungry and angry.  He grasps men and sheep in one hand, devouring them whole.  In the days of King Arthur, a clever young boy earned the title of \"Jack the Giant Killer,\" using his sharp wit to outsmart and slay the various \"giants\" plaguing the land.  Another Jack --- or perhaps it is the same Jack --- famously plants some magic beans and climbs the resulting beanstalk to a castle in the clouds, cleverly outwitting the giant residing there.  Joel David Hamkins is the author of \" The Book of Infinity ,\" from which this article is adapted.  All these giants of legend have a humanoid form, and they undertake generally human activities --- walking, stomping, dancing, carrying heavy loads, running, and so forth.  They act and move about in a human manner, only at a larger scale.  But if human giants did exist, could they actually survive in this form ?  In his foundational 1638 text \"Dialogues Concerning Two New Sciences,\" Galileo Galilei argues that this folklore understanding of the nature of giants is fundamentally flawed.  He contends that this idea of a massive humanlike creature is, quite simply, physically impossible.  To begin his argument, Galileo asks us to imagine a structural beam of sturdy oak.  The beam might be used to support a heavy load --- perhaps a load of bricks or a great stone.  He then asks us to imagine a much larger oak beam, scaled up in size but with the same proportions and material.  A thicker, solid oak beam, of course, will naturally support more than a slender beam of the same wood.  But how much more can it support?  Will the larger beam be able to support the same load, but also scaled up in size?  Should we expect the larger beam to support a scaled-up load of bricks or a scaled-up stone?  Galileo ingeniously argues no --- the larger beam will not support a similarly scaled-up load.  Indeed, he claims that at a certain sufficient scale, the beam will no longer support even its own weight!  His argument relies on a certain subtle observation concerning how scaling works in different dimensions.",
    source: "Joel David Hamkins, \"Why Human Giants Defy the Laws of Physics,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/why-human-giants-defy-the-laws-of-physics/",
    tags: ["academic","the-mit-press-reader","art","themitpressreader"], difficulty: "advanced", word_count: 398

    id: 12, title: "A Brief History of the Internet's Favorite Scam", created_at: "2026-08-13T00:08:00.895076+00:00",
    en: "Fraudsters have long told stories of imprisoned nobles and hidden fortunes, with desperate pleas for help.  Email simply gave their messages a perfect medium.  MIT Press Reader / Source image: Adobe Stock A message arrives: a panicked plea referencing a desperate situation in an exotic location.  It might be a wealthy refugee family trying to make it out of Zimbabwe, or the widow of an aide to Saddam Hussein in a hospital in Chiang Rai, or a Russian oligarch's daughter hiding in the Czech Republic and communicating through her London solicitor.  Finn Brunton is the author of \" Spam ,\" from which this article is adapted.  They are looking for a compassionate soul --- \"whom God will use to assist me and my family\" --- who can help them get themselves and their assets --- \"US$45,000,000. 00\" --- out of this difficult moment in geography and history.  The phone and fax numbers work, and the web addresses point to real news sites --- \"You can go to google in internet and check my clients name and information\" --- and many of the government bureaus and banks check out online.  This is what's known simply as the advance-fee fraud, or the 419 scam.  It is so unmistakable that it embodies its own parodic genre, casually appearing as a gag in television comedies like \"30 Rock\" and \"The Office. \" It always starts with the same canonical line, trotted out in conversation over the phone, or perhaps over email: \"Hello!  I am a Nigerian prince. \" It is easy to see 419 merely as a tired cliché --- and to mistake that familiarity for understanding.  But doing so often leads to facile assumptions about the risks, motives, and imagined rewards on both sides of the exchange.  To see the scam clearly, we need to treat it not simply as spam, but as a cultural myth, or even a motif.  These scams are not ads for products --- for porn or mortgages or relief for masculine anxiety.  They are part of an enormous web of narratives, running back centuries, about corruption, politics, and the failures of globalization, from which you, the reader, can allegedly profit.  Advance-fee fraud dates back to at least the 19th century, with the emergence of the Spanish Prisoner confidence trick.  It goes like this: There is a beautiful, rich woman incarcerated by the cruel King of Spain for complex political reasons.  You have been contacted because you could help her escape.",
    source: "Finn Brunton, \"A Brief History of the Internet's Favorite Scam,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/a-brief-history-of-the-internets-favorite-scam/",

    id: 11, title: "The False Promise of the First 'Smart' Homes", created_at: "2026-08-12T02:55:13.037684+00:00",
    en: "Computerized rooms, telework stations, and child-soothing technologies sold a seductive illusion that automation could solve the problems of maternal care.  The Xanadu home in Kissimmee, Florida, built in 1979 and demolished in 2005.  Courtesy of Wikipedia .  \"Imagine a house with a brain --- a house you can talk to, a house where every room adjusts automatically to match your changing moods.  Imagine a house that is not just a backdrop but an active partner in your work, your family life, and your leisure activities.  In short, imagine a house that is also your friend. \" This is Xanadu, the Computerized Home of Tomorrow, which opened its doors in 1983 in Florida, strategically located just a few miles from Disney World's Epcot Center.  Xanadu's Yale-trained architect, Roy Mason, wanted to create a walk-through instruction manual for building a smart home.  Mason saw this blurring of architecture and sociality as the answer to the many problems of the American family: loneliness, boredom, frustration, parent-child conflict, and general depression.  The result proposed automation as remedy and liberation.  Hannah Zeavin is the author of \" Mother Media ,\" from which this article is adapted.  Much like the techno-pessimistic nightmare imagined by Ray Bradbury's short story \"The Veldt,\" in which housekeeping and child-rearing are ceded to automated homes, Xanadu's \"electric hearth\" was run by a \"House Brain\" to control life support functions.  (The House Brain is, in a way, another term for mother. ) Staffed by a robot dubbed Robutler that remediated paid servant labor, the house aimed to take over a wide variety of tasks --- but only as the owners wished.  The Brain, meanwhile, was a personal assistant, presaging the integration of Alexa and Siri into smart home systems.  It was designed to provide customizability in managing various aspects of middle-class life.  It could call local plumbers and neighbors, offer telemedicine, menu planning, and even outfit selection via an automated clothes-retrieval closet.  Xanadu was not the first of its kind.  In 1957, Disney unveiled the House of the Future in collaboration with MIT and Monsanto, which sought to showcase the engineering and design versatility of plastics.  Visitors of Tomorrowland walked through the attraction and marveled at its features --- microwave ovens, wall-mounted TVs, adjustable sinks, modular bedrooms --- which would, of course, become commonplace in the decades to come.  Likewise, Xanadu invited thousands of guests each day to see a possible home of tomorrow, augmented by technology that could be customized to conform to the changing needs and shapes of American families.",
    source: "Hannah Zeavin, \"The False Promise of the First 'Smart' Homes,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/the-false-promise-of-the-first-smart-homes/",
    tags: ["academic","the-mit-press-reader","technology","art","psychology","economics"], difficulty: "advanced", word_count: 420

    id: 10, title: "How the Amish Let Technology in Without Letting It Take Over", created_at: "2026-08-12T02:15:23.78859+00:00",
    en: "After three years studying the community, I came to see that the real question isn't what technology can do, but what it asks us to give up.  Advertisements for Amish-friendly technologies, such as the Classic Word Processor and the black-box phone.  Source: The Plain Communities Business Exchange.  In 2012, Big Tech was beginning to feel less like a burgeoning industry and more like a fact of daily life.  Facebook had hit one billion monthly users , about half of America was regularly using smartphones , and the country was collectively spending about 120 billion minutes a month on social media.  From directions to dating to deliveries, the most intimate and mundane routines of American life had suddenly become intermediated by apps that increasingly blurred the lines between convenience and dependence.  Lindsay Ems is the author of \" Virtually Amish . \" An open-access version of the book can be found here .  Yet, it was at this inflection point --- when everyone seemed to be emphatically saying yes to technology --- that I began to seriously investigate why a certain community preferred to say no .  I first began studying the Amish in 2012 as a doctoral researcher of media studies at Indiana University, located within a few hours of settlements in Elkhart, LaGrange, and Daviess counties.  Going into the project, I knew what most everyone else did: that the Amish prized simple living, communal values, and religious discipline, while resisting certain technologies such as cars, TV, and electricity.  In my initial conversations with Amish leaders, they told me that they were worried that new technology might diminish the sense of purpose people in their communities feel.  They worried that new communication tools, such as smartphones and social media, would disrupt rituals, traditions, and their established communication patterns.  Above all, they wanted to preserve their shared culture in which each person felt spiritually connected to their neighbors and the natural world.  But the more time I spent in these communities --- three years total --- the more I realized that my original frame on their world was too myopic: It wasn't the metaphorical fish I was interested in; it was the water.  Which is to say that I became less intrigued by Amish restrictions on technology than by the social world they sought to preserve and protect with those restrictions.  In the end, I came to realize that the Amish are, in fact, technology- agnostic .",
    source: "Lindsay Ems, \"How the Amish Let Technology in Without Letting It Take Over,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/how-the-amish-let-technology-in-without-letting-it-take-over/",

    id: 8, title: "The Lost Civic Life of Movie Rental Stores", created_at: "2026-08-12T02:13:18.729807+00:00",
    en: "Decades before recommendation algorithms, video stores served as social hubs where conversation and camaraderie became a form of taste-making.  Hollywood Video was a VHS, DVD, and video game rental shop company started in 1988.  It ceased operations, after declaring bankruptcy, in 2010.  Credit: Flickr / The MIT Press Reader If a DVD owner from the year 2005 found herself transported back to a video store circa 1982, she would likely find the space remarkably familiar: videocassette cases lining the walls, a movie playing on a television set, maybe some marquee lights framing an announcement board over the checkout counter --- all in all, not terribly unlike the video store of two and a half decades later.  Joshua M.  Greenberg is the author of \" From Betamax to Blockbuster ,\" from which this article is adapted.  However, understanding the video store simply as a transactional space in which money is exchanged for goods and services misses the forest for the trees.  That same time-traveling video renter might find herself startled by the employee offering to recommend a movie, or by the knot of customers hanging out by the counter, shooting the breeze and discussing film.  The early video store was often a place to talk as well as to shop, and the persona and expertise of retailers and clerks structured the consumer experience of home video as much as the shelves on the wall.  The people behind the counter, and in many cases those in front of it, were not merely moving through the consumption junction but were, in fact, integral parts of it.  Consider the English pub, the French café, the German beer garden, or the American tavern: These are places where patrons can buy food or drink.  But an analysis that focuses only on the producer/consumer exchange would overlook the vital role these and other spaces play in establishing and maintaining broader social relationships.  Sociologist Ray Oldenburg describes such spaces as \" third places ,\" a category that he uses to refer to \"a great variety of public places that host the regular, voluntary, informal, and happily anticipated gatherings of individuals beyond the realms of home and work. \" Such places serve to unite the neighborhood through simple, day-to-day interaction.  For example, Oldenburg writes, \"In many [American] communities, the post office served this function well when everyone had a mailbox there; when everybody had to walk or drive to it; and it was kept open, by law, twenty-four hours a day.",
    source: "Joshua M. Greenberg, \"The Lost Civic Life of Movie Rental Stores,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/the-lost-civic-life-of-movie-rental-stores/",

    id: 7, title: "Jules Verne's Empty Dream of Spaceflight", created_at: "2026-08-12T02:03:08.437399+00:00",
    en: "In \"From the Earth to the Moon,\" scientific advancement is treated as destiny --- but no one quite asks why.  Source : An original illustration by Henri de Montaut from the 1868 edition of Jules Verne's \"From the Earth to the Moon,\" rotated 90 degrees clockwise.  About halfway through \"From the Earth to the Moon\"--- which is to say, still firmly on Earth--- Jules Verne tells us that in a time when a 30-mile-per-hour train is considered speedy, the public finds it \"natural\" to launch a projectile to the moon.  Granted, this is in contrast to the newer idea of putting a person inside that projectile, but even that, a few pages later, is described as something that would happen \"sooner or later. \" Malka Older ' s essay appeared in an annotated version of Jules Verne's \" From Earth to the Moon . \" Natural is an interesting word to describe an endeavor that requires digging an enormous hole on a hill in uncultivated land in Florida, mining and melting a bunch of aluminum, and pouring it in --- not to mention then setting a formal table to eat a multicourse meal at the bottom of it.  But leaving that implication of human depredations aside for the moment, the suggestion of inevitability --- the \"because it's there\" school of lunar landings --- also serves as a reminder that no one has really given any reason for launching this incredible enterprise.  Over the course of 200 pages, describing extreme efforts of engineering, mining, astronomy, and fundraising, no clear rationale is given for traveling to the moon.  In the book, Impey Barbicane, the redoubtable ballistics expert who comes up with the idea, asks, \"What for? \" about decorating the capsule's exterior, demonstrating how rational and unartistic he is.  That is, in contrast to the more emotional, romantic Michel Ardan.  But he never asks the same question about the voyage itself.  In his inspiring oration, which ignites national and eventually global enthusiasm for the endeavor, he says only that no one has done it before, that despite all the accumulated knowledge about the moon, \"no one has ever established direct communication with her,\" a statement that provokes \"involuntary expressions of surprise. \" The embodiment of rationalism is seemingly conducting a major endeavor without a reason.  In fact, however, the reason is already implied in his statement, so obvious to everyone that he doesn't need to say anything more.",
    source: "Malka Older, \"Jules Verne's Empty Dream of Spaceflight,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/jules-vernes-empty-dream-of-spaceflight/",
    tags: ["academic","the-mit-press-reader","science","art","society","space"], difficulty: "advanced", word_count: 406

    id: 6, title: "Everyday Technology Is Becoming a Black Box. Is There a Cost?", created_at: "2026-08-12T01:52:21.308121+00:00",
    en: "Children once learned by taking things apart.  Today's devices do not provide that rewarding activity --- and the cognitive consequences may be considerable.  Source: Adobe It is difficult to overstate how profoundly humanity has been influenced by the transmission and accumulation of knowledge.  But we can begin to appreciate this when we consider cases of individuals attempting to create everyday artifacts \"from scratch. \" If divisions of cognitive labor are powerful engines of technological growth, what happens to humans when those divisions no longer exist?  Frank C.  Keil is the author of \" The Disappearance of Insight ,\" from which this article is adapted.  This scenario has been repeatedly depicted in novels where a person travels back in time to an earlier era.  In Mark Twain's \"A Connecticut Yankee in King Arthur's Court , \" for example, a mechanic named Hank, who works in a 19th-century arms factory in Connecticut (Twain's present day), is transported into the Arthurian era --- specifically, 528 AD.  He goes on to easily create devices from his era, such as modern guns and bicycles.  In the end, Hank's technological improvements are rejected by the powerful church hierarchy, which sets out to destroy him.  Hank escapes by returning to his own era.  Likewise, in Leo Frankowski's \"Conrad Stargard\" novels, published in the '80s, a Polish army engineer is transported back to 1231 AD in Poland and soon helps accelerate his country's technology to safeguard it from a Mongol invasion.  He knows from his history studies that the invasion will come in about 10 years.  He succeeds and goes on to create a glorious future for Poland.  Inspiring and enjoyable as Twain's and Frankowski's tales may be, they both present highly unrealistic visions of what solo experts could actually achieve in earlier eras.  Indeed, both authors, intentionally or not, greatly underestimate the challenges their protagonists would face.  If you want a more accurate picture, one might find it in Thomas Thwaites's 2011 book \" The Toaster Project: Or a Heroic Attempt to Build a Simple Electric Appliance from Scratch . \" In it, Thwaites, a British designer, recounts his attempt to build a working toaster from raw materials found in the wild.  This is no easy feat.  For example, many parts of the toaster are made of metal.  To procure those metals, Thwaites returns to the original natural deposits in the Earth's crust.  This initial step alone soon overwhelms him as a solo agent.",
    source: "Frank C. Keil, \"Everyday Technology Is Becoming a Black Box. Is There a Cost?,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/everyday-technology-is-becoming-a-black-box-is-there-a-cost/",
    tags: ["academic","the-mit-press-reader","politics","history","art","psychology"], difficulty: "advanced", word_count: 407

    id: 4, title: "America's Care Economy Is Broken", created_at: "2026-08-12T01:50:36.457254+00:00",
    en: "From childcare to elder care to teaching, the labor that sustains society goes undercompensated.  A nationalized care economy would change that.  The MIT Press Reader In America, tens of millions of people provide essential care for others, day in and day out, often without anything near adequate recognition or compensation.  They are the parents caring for kids and the children caring for their elderly parents and relatives with disabilities \"for free. \" They are the underpaid legions of teachers, cleaners, nannies, home aides, social workers, midwives, doulas, and hospice volunteers.  Without them, life as we know it would grind to a halt.  Elizabeth Gregory is the author of \" The Real Domestic Product ,\" from which this article is adapted.  Together, these groups comprise a vast network of support systems, staffed almost exclusively by women, known as the \"care economy. \" This economy supplies and maintains the workforce that employers desperately depend on.  But due to a long history of disparities, their wages (and, as a result, the country's GDP) fail to reflect the true value of the care they provide.  One might even say that their labor has been effectively donated to the broader American economy --- often at great cost to the caregivers themselves.  In recent years, caregivers, unions, activists, scholars, and politicians on the left have advocated that this labor force be recognized and more appropriately compensated for their work.  The likelihood of that happening in the U. S.  has been minuscule for most of the country's history, largely because women had few other options.  But several ongoing demographic and economic shifts make it more necessary now: declining birth rates and more paid work options for women (reducing the supply of unpaid caretakers) and expanded longevity (increasing the demand for caretaking, as well as other services).  These shifts in basic life patterns are fueling a bottleneck that alters the clout that all workers now wield.  These shifts require commensurate changes in our social and economic systems.  Their occurrence together has created an unprecedented opportunity to discard decrepit systems and embrace innovation.  Disgust with the recent evidence of corruption among those in power and their failure to support basic services for Americans may hasten that embrace.  Developing a nationalized care infrastructure to supply key elements of the care work now provided at home or not at all would have many positive effects for individuals and the economy.",
    source: "Elizabeth Gregory, \"America's Care Economy Is Broken,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/americas-care-economy-is-broken/",
    tags: ["academic","the-mit-press-reader","society","economics","themitpressreader"], difficulty: "advanced", word_count: 399

// ==================== APP STATE ====================
const START_DATE = new Date('2026-01-01');
let currentTab = 'today';
let selectedPassageId = null;
let searchTimeout = null;

function debounceSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(renderArchive, 300);
}

// ==================== INIT ====================
function init() {
  const savedTheme = localStorage.getItem('dailyReadingTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';

  // Use embedded data directly - no external dependencies
  document.getElementById('dbStatus').innerHTML = '<span class="status-dot online"></span>' + DB_PASSAGES.length + ' articles';

  // Today's article = the most recent one in the collection
  var latest = DB_PASSAGES[0];
  for (var i = 1; i < DB_PASSAGES.length; i++) {
    if (new Date(DB_PASSAGES[i].created_at) > new Date(latest.created_at)) latest = DB_PASSAGES[i];
  }
  selectedPassageId = latest.id;

  renderToday();
  renderArchive();
  updateDateBadge();
}

function updateDateBadge() {
  const today = new Date();
  const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('dateBadge').textContent = today.toLocaleDateString('en-US', options);
  document.getElementById('readingStats').textContent = DB_PASSAGES.length + ' articles in collection';
}

// ==================== HELPERS ====================
function findPassageById(id) {
  return DB_PASSAGES.find(p => p.id === id);
}

// ==================== THEME ====================
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('dailyReadingTheme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? 'Light' : 'Dark';
}

// ==================== TABS ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + tab + '"]').classList.add('active');
  document.getElementById('todaySection').style.display = tab === 'today' ? 'block' : 'none';
  document.getElementById('archiveSection').classList.toggle('show', tab === 'archive');
  if (tab === 'archive') renderArchive();
}

// ==================== TODAY'S PASSAGE ====================
function findPassageById(id) {
  return DB_PASSAGES.find(p => p.id === id);
}

function renderToday() {
  const passage = findPassageById(selectedPassageId) || DB_PASSAGES[0];
  if (!passage) {
    document.getElementById('todayPassage').innerHTML = '<div class="no-results">No articles available.</div>';
    return;
  }
  updateDateBadge();

  const titleWords = makeClickable(passage.title);
  const bodyWords = makeClickable(passage.en || '');

  const html = '<div class="passage-card">' +
    '<h2>' + titleWords + '</h2>' +
    '<div class="english-text" id="englishText">' + bodyWords + '</div>' +
    '<div id="bilingualContainer"></div>' +
    '<div class="translate-toggle">' +
      '<button class="toggle-btn" id="translateBtn" onclick="toggleFullTranslation(' + passage.id + ')">Full Translation</button>' +
    '</div>' +
    '<div class="source-citation">' + formatSource(passage.source) + '</div>' +
    '</div>';

  document.getElementById('todayPassage').innerHTML = html;
  hideBilingual();
}

let currentArticleId = null;
let currentBilingual = false;

function hideBilingual() {
  currentBilingual = false;
  var btn = document.getElementById('translateBtn');
  if (btn) {
    btn.textContent = 'Full Translation';
    btn.classList.remove('on');
  }
  var bc = document.getElementById('bilingualContainer');
  if (bc) bc.innerHTML = '';
  var et = document.getElementById('englishText');
  if (et) et.style.display = '';
}

function makeClickable(text) {
  return (text || '').split(/(\s+)/g).map(function(token) {
    if (/^\s+$/.test(token)) return token;
    var wordOnly = token.replace(/[^a-zA-Z'-]/g, '');
    if (wordOnly.length <= 1) return token;
    return '<span class="word" data-word="' + wordOnly.toLowerCase() + '" onclick="lookupWord(event,this.getAttribute(\'data-word\'))">' + token + '</span>';
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatSource(source) {
  if (!source) return '';
  const urlMatch = source.match(/(https?:\/\/[^\s,]+)/);
  var formatted = escapeHtml(source);
  if (urlMatch) {
    formatted = formatted.replace(urlMatch[0],
      '<a href="' + urlMatch[0] + '" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">[Read original]</a>');
  }
  return formatted;
}

// ==================== WORD LOOKUP ====================
let lookupCache = {};

function stemWord(word) {
  // Basic stemming for better dictionary hits
  var w = word.toLowerCase();
  if (w.endsWith('ies') && w.length > 4) return w.slice(0, -3) + 'y';
  if (w.endsWith('ves') && w.length > 4) return w.slice(0, -3) + 'f';
  if (w.endsWith('es') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('s') && !w.endsWith('ss') && w.length > 3) return w.slice(0, -1);
  if (w.endsWith('ing') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ed') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('er') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('est') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ly') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('tion') && w.length > 6) return w.slice(0, -4) + 'e';
  if (w.endsWith('ment') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('ness') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('able') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('ful') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('less') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('ous') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ive') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('al') && w.length > 4) return w.slice(0, -2);
  return word;
}

async function lookupWord(event, word) {
  event.stopPropagation();
  document.querySelectorAll('.word.active').forEach(function(w) { w.classList.remove('active'); });
  event.target.classList.add('active');

  var panel = document.getElementById('wordPanel');
  var content = document.getElementById('wpContent');
  panel.classList.add('show');
  content.innerHTML = '<div class="wp-loading"><div class="spinner"></div> Looking up... </div>';

  if (lookupCache[word]) {
    content.innerHTML = lookupCache[word];
    return;
  }

  // Fetch Chinese translation + dictionary entry in parallel
  var zhPromise = getChineseTranslation(word);
  var dictPromise = getDictionaryEntry(word);

  var zh = await zhPromise;
  var dict = await dictPromise;

  renderWordPanel(word, zh, dict);
}

function closeWordPanel() {
  document.getElementById('wordPanel').classList.remove('show');
  document.querySelectorAll('.word.active').forEach(function(w) { w.classList.remove('active'); });
}

async function getChineseTranslation(word) {
  // Immersive Translate extension
  try {
    if (window.immersiveTranslate && typeof window.immersiveTranslate.translateText === 'function') {
      var imText = await window.immersiveTranslate.translateText(word);
      if (imText && imText !== word) return imText;
    }
  } catch (e) {}
  // MyMemory API
  try {
    var res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en|zh-CN');
    if (res.ok) {
      var data = await res.json();
      var t = data.responseData && data.responseData.translatedText;
      if (t && t.toLowerCase() !== word.toLowerCase()) return t;
    }
  } catch (e) {}
  return '';
}

async function getDictionaryEntry(word) {
  var wordsToTry = [word];
  var stemmed = stemWord(word);
  if (stemmed !== word) wordsToTry.push(stemmed);

  for (var i = 0; i < wordsToTry.length; i++) {
    try {
      var res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(wordsToTry[i]));
      if (!res.ok) continue;
      var data = await res.json();
      if (data && data.length > 0) {
        return { entry: data[0], usedWord: wordsToTry[i], stemmed: stemmed !== word && wordsToTry[i] === stemmed };
      }
    } catch (e) {}
  }
  return null;
}

function renderWordPanel(originalWord, zh, dictResult) {
  var content = document.getElementById('wpContent');
  var html = '';

  var displayWord = dictResult && dictResult.entry ? dictResult.entry.word : originalWord;

  html += '<div class="wp-header">';
  html += '<div>';
  html += '<div class="wp-word">' + escapeHtml(displayWord) + '</div>';
  if (dictResult && dictResult.entry) {
    var ph = '';
    if (dictResult.entry.phonetic) ph = dictResult.entry.phonetic;
    else if (dictResult.entry.phonetics && dictResult.entry.phonetics.length > 0 && dictResult.entry.phonetics[0].text) {
      ph = dictResult.entry.phonetics[0].text;
    }
    if (ph) html += '<div class="wp-phonetic">' + escapeHtml(ph) + '</div>';
  }
  html += '</div>';
  html += '<button class="wp-close" onclick="closeWordPanel()">&times;</button>';
  html += '</div>';

  html += '<div class="wp-body">';

  // Chinese translation
  if (zh) {
    html += '<div class="wp-zh">' + escapeHtml(zh) + '</div>';
  }

  // Word forms (鍘熷瀷 / root)
  var stemmedRoot = stemWord(originalWord);
  if (stemmedRoot !== originalWord.toLowerCase() || (dictResult && dictResult.stemmed)) {
    html += '<div class="wp-section-label">Base form</div>';
    html += '<div class="wp-forms"><span class="wp-form-chip">' + escapeHtml(stemmedRoot) + '</span></div>';
  }

  // Dictionary definitions
  if (dictResult && dictResult.entry) {
    var entry = dictResult.entry;
    var totalDefs = 0;
    for (var mi = 0; mi < entry.meanings.length; mi++) {
      var m = entry.meanings[mi];
      if (totalDefs >= 8) break;
      html += '<div class="wp-meaning">';
      html += '<div class="wp-pos">' + escapeHtml(m.partOfSpeech) + '</div>';
      var shownInPos = 0;
      for (var di = 0; di < m.definitions.length && totalDefs < 8; di++) {
        var def = m.definitions[di];
        html += '<div class="wp-def"><span class="def-num">' + (shownInPos + 1) + '.</span>' + escapeHtml(def.definition) + '</div>';
        if (def.example) {
          html += '<div class="wp-example">"' + escapeHtml(def.example) + '"</div>';
        }
        if (def.synonyms && def.synonyms.length > 0 && shownInPos === 0) {
          html += '<div class="wp-syn"><b>syn</b> ' + def.synonyms.slice(0, 5).map(function(s) { return escapeHtml(s); }).join(', ') + '</div>';
        }
        shownInPos++;
        totalDefs++;
      }
      html += '</div>';
    }
  } else {
    html += '<div class="wp-not-found">No definition found for "' + escapeHtml(originalWord) + '".</div>';
  }

  html += '</div>';

  lookupCache[originalWord] = html;
  content.innerHTML = html;
}

// ==================== FULL TEXT TRANSLATION ====================
function splitSentences(text) {
  var cleaned = text.replace(/\s+/g, ' ').trim();
  var sentences = cleaned.match(/[^.!?]+[.!?]+["']?|\S+$/g) || [];
  var result = [];
  var buffer = '';
  for (var i = 0; i < sentences.length; i++) {
    var s = sentences[i].trim();
    if (buffer.length + s.length < 480) {
      buffer += (buffer ? ' ' : '') + s;
    } else {
      if (buffer) result.push(buffer);
      buffer = s;
    }
  }
  if (buffer) result.push(buffer);
  return result;
}

async function toggleFullTranslation(passageId) {
  currentArticleId = passageId;
  var btn = document.getElementById('translateBtn');
  var bc = document.getElementById('bilingualContainer');
  var et = document.getElementById('englishText');

  // If currently showing bilingual, hide it
  if (currentBilingual) {
    hideBilingual();
    return;
  }

  // Show loading state
  btn.textContent = 'Translating...';
  btn.classList.add('on');
  bc.classList.add('show');
  bc.innerHTML = '<div class="loading-indicator"><div class="spinner"></div><div style="margin-top:10px;font-size:0.85rem;">Translating...</div></div>';

  var passage = findPassageById(passageId);
  if (!passage) {
    btn.textContent = 'Full Translation';
    return;
  }

  var cacheKey = 'translation-' + passageId;
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch(e) {}

  if (cached && cached.sentences && cached.sentences.length > 0) {
    renderBilingual(passage, cached.sentences);
    btn.textContent = 'Hide Translation';
    currentBilingual = true;
    return;
  }

  var sentences = splitSentences(passage.en || '');
  var translated = [];
  var failed = 0;

  for (var i = 0; i < sentences.length; i++) {
    try {
      var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentences[i]) + '&langpair=en|zh-CN';
      var res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var zh = data.responseData && data.responseData.translatedText;
      if (zh && zh !== sentences[i]) {
        translated.push(zh);
      } else {
        translated.push('');
        failed++;
      }
    } catch (e) {
      translated.push('');
      failed++;
    }
  }

  // Cache result
  try {
    localStorage.setItem(cacheKey, JSON.stringify({ sentences: translated, en: sentences }));
  } catch(e) {}

  if (failed === sentences.length) {
    bc.innerHTML = '<div class="no-results" style="font-size:0.85rem;">Translation unavailable. Please try again later.</div>';
    btn.textContent = 'Full Translation';
    btn.classList.remove('on');
    currentBilingual = false;
    return;
  }

  renderBilingual(passage, translated, sentences);
  btn.textContent = 'Hide Translation';
  currentBilingual = true;
}

function renderBilingual(passage, zhLines, enLines) {
  var bc = document.getElementById('bilingualContainer');
  var et = document.getElementById('englishText');
  if (et) et.style.display = 'none';

  var html = '<div class="bilingual-text show">';
  var enSentences = enLines || splitSentences(passage.en || '');
  for (var i = 0; i < enSentences.length; i++) {
    var enClickable = makeClickable(enSentences[i]);
    var zh = zhLines[i] || '';
    html += '<p class="en-line">' + enClickable + '</p>';
    if (zh) html += '<p class="zh-line">' + zh + '</p>';
  }
  html += '</div>';
  bc.innerHTML = html;
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('word') && !e.target.closest('.word-panel')) {
    closeWordPanel();
  }
});

// ==================== ARCHIVE ====================
function renderArchive() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const list = document.getElementById('archiveList');
  let filtered = [...DB_PASSAGES];

  if (searchTerm) {
    filtered = filtered.filter(p =>
      (p.title && p.title.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.en && p.en.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.source && p.source.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.tags && p.tags.some(t => t.toLowerCase().indexOf(searchTerm) !== -1))
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">No matching articles found.</div>';
    return;
  }

  list.innerHTML = filtered.map(p => {
    const d = p.created_at ? new Date(p.created_at) : new Date();
    const dateStr = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    const preview = (p.en || '').replace(/\s+/g,' ').substring(0, 140) + '...';
    const tags = p.tags && Array.isArray(p.tags) ? p.tags : [];
    const srcPreview = (p.source || '').substring(0, 80);

    return '<div class="archive-item" onclick="openPassage(' + p.id + ')">' +
      '<div class="archive-date">' + dateStr + '</div>' +
      '<div class="archive-title">' + escapeHtml(p.title) + '</div>' +
      '<div class="archive-preview">' + escapeHtml(preview) + '</div>' +
      '<div class="archive-tags">' + tags.map(t => '<span class="archive-tag">' + escapeHtml(t) + '</span>').join('') + '</div>' +
      '<div class="archive-source">' + escapeHtml(srcPreview) + '</div>' +
      '</div>';
  }).join('');
}

// ==================== MODAL ====================
function openPassage(id) {
  const passage = findPassageById(id);
  if (!passage) return;

  var titleHtml = makeClickable(passage.title);
  var bodyHtml = makeClickable(passage.en || '');

  document.getElementById('modalInner').innerHTML =
    '<h2 style="color:var(--accent);font-weight:400;margin-bottom:20px;">' + titleHtml + '</h2>' +
    '<div class="english-text">' + bodyHtml + '</div>' +
    '<div class="source-citation" style="margin-bottom:20px;">' + formatSource(passage.source) + '</div>';

  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
  closeWordPanel();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModalDirect();
    closeWordPanel();
  }
});

// ==================== TIMELINE ====================
let tooltipShowDelay = null;
let tooltipHideDelay = null;

function buildDateMap() {
  // Sort articles by created_at, map each to a consecutive day ending today
  var sorted = [...DB_PASSAGES].sort(function(a, b) {
    return new Date(a.created_at) - new Date(b.created_at);
  });
  var map = [];
  var today = new Date();
  for (var i = 0; i < sorted.length; i++) {
    var d = new Date(today);
    d.setDate(d.getDate() - (sorted.length - 1 - i));
    map.push({ date: d, article: sorted[i] });
  }
  return map;
}

function renderTimeline() {
  var container = document.getElementById('timeline');
  if (!container) return;
  var dateMap = buildDateMap();
  var todayStr = new Date().toDateString();

  var year = new Date().getFullYear();
  var html = '<div class="timeline-year">' + year + '</div>';
  html += '<div class="timeline-scroll">';
  for (var i = 0; i < dateMap.length; i++) {
    var entry = dateMap[i];
    var dateStr = entry.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var isToday = entry.date.toDateString() === todayStr;
    var activeClass = entry.article.id === selectedPassageId ? ' active' : '';
    html += '<div class="timeline-row" data-id="' + entry.article.id + '" onmouseenter="showTimelineTooltip(this,' + entry.article.id + ')" onmouseleave="hideTimelineTooltip()" onclick="openPassage(' + entry.article.id + ')">' +
      '<span class="timeline-date-label">' + dateStr + '</span>' +
      '<span class="timeline-item has-article' + activeClass + '"></span>' +
      '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function showTimelineTooltip(rowEl, articleId) {
  clearTimeout(tooltipHideDelay);
  var article = findPassageById(articleId);
  if (!article) return;
  var card = document.getElementById('timelineCard');
  var dot = rowEl.querySelector('.timeline-item');
  var rect = dot.getBoundingClientRect();
  var d = new Date(article.created_at);

  document.getElementById('cardTitle').textContent = article.title;
  document.getElementById('cardMeta').innerHTML =
    d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) +
    ' | ' + (article.word_count || '') + ' words';
  var tagsHtml = '';
  var tags = article.tags || [];
  for (var i = 0; i < Math.min(tags.length, 3); i++) {
    tagsHtml += '<span class="card-tag">' + escapeHtml(tags[i]) + '</span>';
  }
  document.getElementById('cardTags').innerHTML = tagsHtml;

  var cardWidth = Math.min(280, window.innerWidth * 0.25);
  var cardLeft = rect.right + 24;
  var cardTop = rect.top + rect.height / 2 - 70;
  if (cardLeft + cardWidth > window.innerWidth - 20) cardLeft = rect.right - cardWidth - 30;
  card.style.left = cardLeft + 'px';
  card.style.top = Math.max(10, Math.min(cardTop, window.innerHeight - 190)) + 'px';

  // Apple-style: slight delay before flip reveal
  clearTimeout(tooltipShowDelay);
  tooltipShowDelay = setTimeout(function() {
    card.classList.add('show');
  }, 100);
}

function hideTimelineTooltip() {
  clearTimeout(tooltipShowDelay);
  clearTimeout(tooltipHideDelay);
  // Grace period so the flip animation can finish before hiding
  tooltipHideDelay = setTimeout(function() {
    document.getElementById('timelineCard').classList.remove('show');
  }, 350);
}

// ==================== START ====================
init();
renderTimeline();
</script>
