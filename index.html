<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reading</title>
<style>
:root {
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --accent: #8b5e3c;
  --accent-light: #f0e4d8;
  --border: #e0d5c1;
  --shadow: 0 2px 16px rgba(0,0,0,0.06);
  --highlight: #fff3cd;
  --tooltip-bg: #1e1b18;
  --tooltip-text: #f5efe4;
  --tag-bg: #f5efe4;
  --tag-text: #6b5e4a;
  --input-bg: #faf8f5;
}
[data-theme="dark"] {
  --bg: #1a1815;
  --card-bg: #252220;
  --text: #e8dcc8;
  --text-secondary: #a69880;
  --accent: #c9975a;
  --accent-light: #3d3022;
  --border: #3d3424;
  --shadow: 0 2px 16px rgba(0,0,0,0.3);
  --highlight: #4a3f1a;
  --tooltip-bg: #f0e6d3;
  --tooltip-text: #1e1b18;
  --tag-bg: #2d2820;
  --tag-text: #a69880;
  --input-bg: #252220;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Georgia', 'Times New Roman', 'Noto Serif', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
  transition:background 0.3s,color 0.3s;
}
.container { max-width:860px; margin:0 auto; padding:20px 24px 60px; }
.header {
  display:flex; justify-content:space-between; align-items:center;
  padding:20px 0; border-bottom:1px solid var(--border); margin-bottom:28px;
}
.header h1 { font-size:1.4rem; font-weight:400; letter-spacing:0.04em; color:var(--accent); }
.header-actions { display:flex; gap:10px; align-items:center; }
.header-btn {
  background:none; border:1px solid var(--border); color:var(--text-secondary);
  padding:6px 14px; border-radius:20px; cursor:pointer; font-size:0.82rem;
  font-family:inherit; transition:all 0.2s;
}
.header-btn:hover { border-color:var(--accent); color:var(--accent); }
.status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }
.status-dot.online { background:#4a7c59; }
.status-dot.offline { background:#c44; }
.tabs { display:flex; gap:0; margin-bottom:24px; border-bottom:1px solid var(--border); }
.tab {
  padding:8px 20px; cursor:pointer; font-size:0.9rem; color:var(--text-secondary);
  border-bottom:2px solid transparent; transition:all 0.2s; background:none; border-top:none;
  border-left:none; border-right:none; font-family:inherit;
}
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.daily-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;
}
.date-badge {
  font-size:0.82rem; color:var(--text-secondary); background:var(--accent-light);
  padding:4px 14px; border-radius:20px;
}
.passage-card {
  background:var(--card-bg); border-radius:10px; padding:32px 28px;
  box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:24px;
}
.passage-card h2 {
  font-size:1.2rem; font-weight:400; margin-bottom:20px;
  color:var(--accent); letter-spacing:0.02em;
}
.english-text {
  font-size:1.08rem; line-height:1.5; margin-bottom:24px; text-align:justify;
  -webkit-font-smoothing: antialiased;
}
.english-text .word {
  cursor:pointer; transition:background 0.15s; border-radius:3px; padding:1px 2px; margin:0 -1px;
}
.english-text .word:hover { background:var(--highlight); }
.english-text .word.active { background:var(--highlight); }
.source-citation {
  font-size:0.82rem; color:var(--text-secondary); font-style:italic;
  padding-top:14px; border-top:1px solid var(--border);
}
.translate-toggle { display:flex; gap:10px; align-items:center; margin-top:16px; }
.toggle-btn {
  background:none; border:1px solid var(--border); color:var(--text-secondary);
  padding:7px 18px; border-radius:20px; cursor:pointer; font-size:0.82rem;
  font-family:inherit; transition:all 0.2s;
}
.toggle-btn:hover { border-color:var(--accent); color:var(--accent); }
.toggle-btn.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.bilingual-text { margin-top:18px; display:none; }
.bilingual-text.show { display:block; }
.en-line {
  font-family:'Georgia','Times New Roman',serif;
  font-size:1.05rem; line-height:1.5; color:var(--text);
  margin-bottom:4px; text-align:justify;
}
.zh-line {
  font-size:0.95rem; line-height:1.5; color:var(--text-secondary);
  margin-bottom:12px; padding-left:14px; border-left:2px solid var(--accent-light);
}
.timeline {
  position:fixed; left:max(20px, calc(50% - 640px));
  top:50%; transform:translateY(-50%);
  z-index:900; display:flex; flex-direction:column; align-items:flex-end;
  max-height:78vh;
  opacity:0; animation:timelineIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
}
@keyframes timelineIn {
  from { opacity:0; transform:translateY(-50%) translateX(-18px); }
  to { opacity:1; transform:translateY(-50%) translateX(0); }
}
.timeline-year {
  font-size:0.78rem; color:var(--accent); letter-spacing:0.12em;
  font-weight:600; margin-bottom:10px;
  background:var(--bg); padding:2px 6px; border-radius:4px; z-index:2;
  opacity:0; animation:yearIn 0.6s cubic-bezier(0.22,1,0.36,1) 0.5s forwards;
}
@keyframes yearIn {
  from { opacity:0; transform:translateY(-10px); }
  to { opacity:1; transform:translateY(0); }
}
.timeline-scroll {
  position:relative;
  overflow-y:auto; max-height:calc(78vh - 40px);
  scrollbar-width:none; -ms-overflow-style:none;
  scroll-behavior:smooth;
  padding:4px 0;
}
.timeline-scroll::-webkit-scrollbar { display:none; }
.timeline-scroll::before {
  content:''; position:absolute; right:5px; top:8px; bottom:8px;
  width:1.5px; background:var(--border); border-radius:1px;
  transform:translateX(50%);
}
.timeline-row {
  position:relative; display:flex; align-items:center; justify-content:flex-end;
  gap:14px; cursor:pointer; padding:7px 4px;
}
.timeline-date-label {
  font-size:0.72rem; color:var(--text-secondary); white-space:nowrap;
  font-weight:600; pointer-events:none;
  transition:color 0.25s ease;
}
.timeline-row:hover .timeline-date-label { color:var(--accent); }
.timeline-item {
  position:relative; width:12px; height:12px; border-radius:50%;
  flex-shrink:0;
  background:var(--card-bg); border:2px solid var(--border); cursor:pointer;
  z-index:1;
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
             background 0.25s ease,
             border-color 0.25s ease,
             box-shadow 0.35s cubic-bezier(0.22,1,0.36,1);
}
.timeline-item.has-article { border-color:var(--accent); background:var(--accent); }
.timeline-row:hover .timeline-item {
  transform:scale(1.7);
  background:var(--accent);
  box-shadow:0 0 0 5px var(--accent-light);
}
.timeline-item.active { box-shadow:0 0 0 5px var(--accent-light); }
.timeline-row:active .timeline-item { transform:scale(1.3); }
.timeline-article-card {
  position:fixed; z-index:3000; pointer-events:none;
  opacity:0; visibility:hidden;
  transition:opacity 0.18s ease, visibility 0.18s ease;
}
.timeline-article-card.show { opacity:1; visibility:visible; }
.timeline-article-card .card-inner {
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 18px;
  max-width:300px;
  box-shadow:0 14px 44px rgba(0,0,0,0.2);
  transform-origin:left center;
  transform:perspective(900px) rotateY(72deg) translateX(-14px);
  backface-visibility:hidden;
  will-change:transform;
  transition:transform 0.55s cubic-bezier(0.22,1,0.36,1);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.timeline-article-card.show .card-inner {
  transform:perspective(900px) rotateY(0deg) translateX(0);
}
.card-title {
  font-size:0.85rem; font-weight:600; line-height:1.35;
  color:var(--text);
  margin-bottom:6px;
}
.card-meta {
  font-size:0.72rem; color:var(--text-secondary); line-height:1.4;
}
.card-tags { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
.card-tag {
  font-size:0.68rem; background:var(--accent-light); color:var(--accent);
  padding:1px 8px; border-radius:9px;
}
@media (max-width:1120px) { .timeline { display:none; } }
.word-panel {
  position:fixed; right:0; top:72px;
  width:330px; max-height:calc(100vh - 100px);
  overflow-y:auto;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-right:none;
  border-radius:14px 0 0 14px;
  box-shadow:-8px 4px 40px rgba(0,0,0,0.18);
  z-index:2600;
  transform:translateX(105%);
  transition:transform 0.45s cubic-bezier(0.22,1,0.36,1);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding:0;
}
.word-panel.show { transform:translateX(0); }
.wp-header {
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:20px 22px 14px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--card-bg); z-index:2;
}
.wp-word {
  font-family:'Georgia','Times New Roman',serif;
  font-size:1.5rem; font-weight:700; color:var(--text);
}
.wp-phonetic {
  font-size:0.85rem; color:var(--accent); margin-top:2px;
}
.wp-close {
  background:none; border:none; font-size:1.3rem; cursor:pointer;
  color:var(--text-secondary); line-height:1; padding:4px;
}
.wp-close:hover { color:var(--text); }
.wp-body { padding:16px 22px 24px; }
.wp-zh {
  font-size:1.05rem; color:var(--accent); margin-bottom:14px; line-height:1.5;
}
.wp-section-label {
  font-size:0.68rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--text-secondary); margin:14px 0 6px;
}
.wp-forms {
  display:flex; flex-wrap:wrap; gap:6px;
}
.wp-form-chip {
  font-size:0.78rem; background:var(--accent-light); color:var(--accent);
  padding:2px 10px; border-radius:10px;
}
.wp-meaning { margin-bottom:12px; }
.wp-pos {
  font-size:0.8rem; font-style:italic; color:var(--accent);
  margin:10px 0 4px; font-weight:600;
}
.wp-def {
  font-size:0.86rem; line-height:1.5; color:var(--text);
  margin-bottom:6px; padding-left:4px;
}
.wp-def .def-num { color:var(--accent); font-weight:600; margin-right:6px; }
.wp-example {
  font-size:0.78rem; color:var(--text-secondary); font-style:italic;
  margin:2px 0 6px 16px; line-height:1.45;
}
.wp-syn {
  font-size:0.75rem; color:var(--text-secondary); margin-left:16px;
}
.wp-syn b { color:var(--accent); font-weight:600; }
.wp-loading {
  padding:30px 22px; color:var(--text-secondary); font-size:0.85rem;
  display:flex; align-items:center; gap:8px;
}
.spinner {
  display:inline-block; width:14px; height:14px; border:2px solid var(--border);
  border-top-color:var(--accent); border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.wp-not-found { padding:30px 22px; color:var(--text-secondary); font-size:0.85rem; }
@media (max-width:640px) { .word-panel { width:88vw; } }
.passages-list { display:none; }
.passages-list.show { display:block; }
.search-bar {
  display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;
}
.search-input {
  flex:1; min-width:200px; padding:10px 16px; border:1px solid var(--border);
  border-radius:20px; font-size:0.88rem; background:var(--input-bg); color:var(--text);
  font-family:inherit;
}
.search-input:focus { outline:none; border-color:var(--accent); }
.archive-list { display:flex; flex-direction:column; gap:10px; }
.archive-item {
  background:var(--card-bg); border:1px solid var(--border); border-radius:8px;
  padding:18px 22px; cursor:pointer; transition:all 0.2s; box-shadow:var(--shadow);
}
.archive-item:hover { border-color:var(--accent); transform:translateY(-1px); }
.archive-item .archive-date { font-size:0.78rem; color:var(--text-secondary); margin-bottom:4px; }
.archive-item .archive-title { font-size:1rem; color:var(--text); margin-bottom:6px; }
.archive-item .archive-preview {
  font-size:0.85rem; color:var(--text-secondary); overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.archive-item .archive-tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.archive-tag {
  font-size:0.72rem; background:var(--tag-bg); color:var(--tag-text);
  padding:2px 10px; border-radius:10px;
}
.archive-item .archive-source { font-size:0.78rem; color:var(--accent); margin-top:6px; font-style:italic; }
.modal-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);
  z-index:999; display:none; justify-content:center; align-items:center; padding:20px;
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--card-bg); border-radius:14px; max-width:800px; width:100%;
  max-height:85vh; overflow-y:auto; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.3);
  position:relative;
}
.modal-close {
  position:absolute; top:14px; right:18px; background:none; border:none;
  font-size:1.4rem; cursor:pointer; color:var(--text-secondary); line-height:1;
}
.modal-close:hover { color:var(--text); }
.no-results { text-align:center; padding:40px; color:var(--text-secondary); font-size:0.9rem; }
.reading-stats { font-size:0.78rem; color:var(--text-secondary); }
.loading-indicator { text-align:center; padding:60px; color:var(--text-secondary); }
.spinner {
  display:inline-block; width:24px; height:24px; border:3px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
.loading-dot { animation:pulse 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2) { animation-delay:0.2s; }
.loading-dot:nth-child(3) { animation-delay:0.4s; }
@media (max-width:640px) {
  .container { padding:10px 14px 40px; }
  .passage-card { padding:22px 16px; }
  .english-text { font-size:1rem; }
  .header h1 { font-size:1.1rem; }
  .tab { padding:8px 14px; font-size:0.82rem; }
}
</style>
</head>
<body>

<div class="timeline" id="timeline"></div>
<div class="timeline-article-card" id="timelineCard">
  <div class="card-inner">
    <div class="card-title" id="cardTitle"></div>
    <div class="card-meta" id="cardMeta"></div>
    <div class="card-tags" id="cardTags"></div>
  </div>
</div>

<div class="container">

  <header class="header">
    <h1>Daily Reading</h1>
    <div class="header-actions">
      <span style="font-size:0.72rem;color:var(--text-secondary);display:flex;align-items:center;" id="dbStatus">
        <span class="status-dot offline"></span>Loading
      </span>
      <button class="header-btn" onclick="toggleTheme()" id="themeBtn">Dark</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="today" onclick="switchTab('today')">Today</button>
    <button class="tab" data-tab="archive" onclick="switchTab('archive')">Archive</button>
  </nav>

  <section id="todaySection">
    <div class="daily-header">
      <span class="date-badge" id="dateBadge"></span>
      <span class="reading-stats" id="readingStats"></span>
    </div>
    <div id="todayPassage"></div>
  </section>

  <section id="archiveSection" class="passages-list">
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search by title, keyword, author, date..." oninput="debounceSearch()">
      <button class="header-btn" onclick="document.getElementById('searchInput').value=''; renderArchive();">Clear</button>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </section>

</div>

<aside class="word-panel" id="wordPanel">
  <div id="wpContent"></div>
</aside>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModalDirect()">&times;</button>
    <div id="modalInner"></div>
  </div>
</div>

nted opportunity to discard decrepit systems and embrace innovation. Disgust with the recent evidence of corruption among those in power and their failure to support basic services for Americans may hasten that embrace. Developing a nationalized care infrastructure to supply key elements of the care work now provided at home or not at all would have many positive effects for individuals and the economy. They include ensuring all Americans get the care they need, freeing up current unpaid caregivers to work for pay if they would like, raising the wages of current paid care workers, and documenting the heretofore unbooked value of care work on the ledger of human production.",

cant traces of the required copper, iron, and nickel. Thwaites eventually builds a furnace that produces a product resembling usable iron after many trial-and-error attempts. But the product isn't of sufficient quality, and Thwaites resorts to a microwave-powered furnace. Just to get to the point of having workable iron, Thwaites resorts to many shortcuts, with the help of experts and modern-day devices.",

    id: 3, title: "Jules Verne's Empty Dream of Spaceflight", created_at: "2026-08-12T02:03:00Z",
    en: "About halfway through \"From the Earth to the Moon\" -- which is to say, still firmly on Earth -- Jules Verne tells us that in a time when a 30-mile-per-hour train is considered speedy, the public finds it \"natural\" to launch a projectile to the moon. Granted, this is in contrast to the newer idea of putting a person inside that projectile, but even that, a few pages later, is described as something that would happen \"sooner or later.\" Natural is an interesting word to describe an endeavor that requires digging an enormous hole on a hill in uncultivated land in Florida, mining and melting a bunch of aluminum, and pouring it in -- not to mention then setting a formal table to eat a multicourse meal at the bottom of it. But leaving that implication of human depredations aside for the moment, the suggestion of inevitability -- the \"because it's there\" school of lunar landings -- also serves as a reminder that no one has really given any reason for launching this incredible enterprise. Over the course of 200 pages, describing extreme efforts of engineering, mining, astronomy, and fundraising, no clear rationale is given for traveling to the moon. In the book, Impey Barbicane, the redoubtable ballistics expert who comes up with the idea, asks, \"What for?\" about decorating the capsule's exterior, demonstrating how rational and unartistic he is. But he never asks the same question about the voyage itself. In his inspiring oration, which ignites national and eventually global enthusiasm for the endeavor, he says only that no one has done it before, that despite all the accumulated knowledge about the moon, \"no one has ever established direct communication with her,\" a statement that provokes \"involuntary expressions of surprise.\" The embodiment of rationalism is seemingly conducting a major endeavor without a reason. In fact, however, the reason is already implied in his statement, so obvious to everyone that he doesn't need to say anything more. For him and for his listeners, the possibility of doing it and doing it first is enough. Verne gives his story an international varnish, with funding and scientific contributions from across Europe, Latin America, and parts of Asia. But he also repeatedly emphasizes the supposed national character of the Americans that allows them to conceive, execute, and lead the effort: \"the inventive genius of the Americans\"; \"the practical genius of the American\"; \"the daring American genius.\" It is the same belief in inherent superiority that was used to justify colonialism, given a pretense of rationality rather than religion.",
    source: "Malka Older, in annotated edition of Jules Verne's \"From Earth to the Moon\" (MIT Press, 2026). The MIT Press Reader. https://thereader.mitpress.mit.edu/jules-vernes-empty-dream-of-spaceflight/",
    tags: ["literature","science","space","history"], difficulty: "advanced", word_count: 406

  {
    id: 4, title: "The Lost Civic Life of Movie Rental Stores", created_at: "2026-08-12T02:13:00Z",
    en: "If a DVD owner from the year 2005 found herself transported back to a video store circa 1982, she would likely find the space remarkably familiar: videocassette cases lining the walls, a movie playing on a television set, maybe some marquee lights framing an announcement board over the checkout counter -- all in all, not terribly unlike the video store of two and a half decades later. However, understanding the video store simply as a transactional space in which money is exchanged for goods and services misses the forest for the trees. That same time-traveling video renter might find herself startled by the employee offering to recommend a movie, or by the knot of customers hanging out by the counter, shooting the breeze and discussing film. The early video store was often a place to talk as well as to shop, and the persona and expertise of retailers and clerks structured the consumer experience of home video as much as the shelves on the wall. The people behind the counter, and in many cases those in front of it, were not merely moving through the consumption junction but were, in fact, integral parts of it. Consider the English pub, the French cafe, the German beer garden, or the American tavern: These are places where patrons can buy food or drink. But an analysis that focuses only on the producer/consumer exchange would overlook the vital role these and other spaces play in establishing and maintaining broader social relationships. Sociologist Ray Oldenburg describes such spaces as \"third places,\" a category that he uses to refer to \"a great variety of public places that host the regular, voluntary, informal, and happily anticipated gatherings of individuals beyond the realms of home and work.\" Such places serve to unite the neighborhood through simple, day-to-day interaction. For example, Oldenburg writes, \"In many American communities, the post office served this function well when everyone had a mailbox there; when everybody had to walk or drive to it; and it was kept open, by law, twenty-four hours a day.\" The video store, in its heyday, functioned in much the same way. It was a place where movie recommendations were personal, where taste was collectively negotiated through conversation rather than algorithm, and where the serendipity of browsing physical shelves created a kind of cultural literacy that scrolling through thumbnails on a screen simply cannot replicate. The clerks, often film students or cinephiles, served as informal curators, guiding customers toward discoveries they would never have made on their own.",
    source: "Joshua M. Greenberg, \"From Betamax to Blockbuster\" (MIT Press, 2008). The MIT Press Reader. https://thereader.mitpress.mit.edu/the-lost-civic-life-of-movie-rental-stores/",
    tags: ["technology","society","culture","film"], difficulty: "advanced", word_count: 412

  {
    id: 5, title: "How the Amish Let Technology in Without Letting It Take Over", created_at: "2026-08-12T02:15:00Z",
    en: "In 2012, Big Tech was beginning to feel less like a burgeoning industry and more like a fact of daily life. Facebook had hit one billion monthly users, about half of America was regularly using smartphones, and the country was collectively spending about 120 billion minutes a month on social media. From directions to dating to deliveries, the most intimate and mundane routines of American life had suddenly become intermediated by apps that increasingly blurred the lines between convenience and dependence. Yet, it was at this inflection point -- when everyone seemed to be emphatically saying yes to technology -- that I began to seriously investigate why a certain community preferred to say no. I first began studying the Amish in 2012 as a doctoral researcher of media studies at Indiana University, located within a few hours of settlements in Elkhart, LaGrange, and Daviess counties. Going into the project, I knew what most everyone else did: that the Amish prized simple living, communal values, and religious discipline, while resisting certain technologies such as cars, TV, and electricity. In my initial conversations with Amish leaders, they told me that they were worried that new technology might diminish the sense of purpose people in their communities feel. They worried that new communication tools, such as smartphones and social media, would disrupt rituals, traditions, and their established communication patterns. Above all, they wanted to preserve their shared culture in which each person felt spiritually connected to their neighbors and the natural world. But the more time I spent in these communities -- three years total -- the more I realized that my original frame on their world was too myopic: It wasn't the metaphorical fish I was interested in; it was the water. Which is to say that I became less intrigued by Amish restrictions on technology than by the social world they sought to preserve and protect with those restrictions. In the end, I came to realize that the Amish are, in fact, technology-agnostic. They don't reject technology wholesale; they carefully evaluate each new tool through the lens of their core values. Does this device strengthen family and community bonds, or does it weaken them? Does it encourage face-to-face interaction, or does it replace it with something more isolating? Will it serve the community, or will the community end up serving it? These are questions that the rest of us, in our rush to adopt every new gadget and platform, rarely pause to ask -- and we are arguably worse off for it.",
    source: "Lindsay Ems, \"Virtually Amish\" (MIT Press, 2022). The MIT Press Reader. https://thereader.mitpress.mit.edu/how-the-amish-let-technology-in-without-letting-it-take-over/",
    tags: ["technology","society","culture","media"], difficulty: "advanced", word_count: 406
  },

    id: 6, title: "The False Promise of the First 'Smart' Homes", created_at: "2026-08-12T02:55:00Z",
    en: "\"Imagine a house with a brain -- a house you can talk to, a house where every room adjusts automatically to match your changing moods. Imagine a house that is not just a backdrop but an active partner in your work, your family life, and your leisure activities. In short, imagine a house that is also your friend.\" This is Xanadu, the Computerized Home of Tomorrow, which opened its doors in 1983 in Florida, strategically located just a few miles from Disney World's Epcot Center. Xanadu's Yale-trained architect, Roy Mason, wanted to create a walk-through instruction manual for building a smart home. Mason saw this blurring of architecture and sociality as the answer to the many problems of the American family: loneliness, boredom, frustration, parent-child conflict, and general depression. The result proposed automation as remedy and liberation. Much like the techno-pessimistic nightmare imagined by Ray Bradbury's short story \"The Veldt,\" in which housekeeping and child-rearing are ceded to automated homes, Xanadu's \"electric hearth\" was run by a \"House Brain\" to control life support functions. (The House Brain is, in a way, another term for mother.) Staffed by a robot dubbed Robutler that remediated paid servant labor, the house aimed to take over a wide variety of tasks -- but only as the owners wished. The Brain, meanwhile, was a personal assistant, presaging the integration of Alexa and Siri into smart home systems. It was designed to provide customizability in managing various aspects of middle-class life. It could call local plumbers and neighbors, offer telemedicine, menu planning, and even outfit selection via an automated clothes-retrieval closet. Xanadu was not the first of its kind. In 1957, Disney unveiled the House of the Future in collaboration with MIT and Monsanto, which sought to showcase the engineering and design versatility of plastics. Visitors of Tomorrowland walked through the attraction and marveled at its features -- microwave ovens, wall-mounted TVs, adjustable sinks, modular bedrooms -- which would, of course, become commonplace in the decades to come. Likewise, Xanadu invited thousands of guests each day to see a possible home of tomorrow, augmented by technology that could be customized to conform to the changing needs and shapes of American families. But the smart home vision, then as now, was not without its shadows. The very technologies promised as liberatory also inscribed within them a vision of domesticity that was profoundly gendered, assuming that housework, childcare, and the emotional labor of family life were problems to be solved by machines rather than through a more equitable distribution of labor among family members.",
    source: "Hannah Zeavin, \"Mother Media\" (MIT Press, 2026). The MIT Press Reader. https://thereader.mitpress.mit.edu/the-false-promise-of-the-first-smart-homes/",

    id: 7, title: "The Vertical City and Its Discontents", created_at: "2026-01-01T00:00:00Z",
    en: "The skyscraper, that quintessential emblem of twentieth-century ambition, has undergone a profound ontological shift in the first decades of the twenty-first. No longer merely an extrapolation of capitalist exuberance -- a phallic extrusion of steel and glass thrust skyward in defiance of gravity -- the contemporary tower aspires to a more nuanced synthesis of ecological stewardship, social porosity, and formal experimentation. Yet this aspiration is frequently thwarted by the intractable realities of speculative development: the exigencies of the pro forma, the tyranny of the floor plate, and the relentless optimization of net-to-gross ratios conspire to produce a generic verticality that belies its architects' loftier pretensions. Consider the recent proliferation of mixed-use supertalls across Southeast Asian metropolises. These towers, ostensibly conceived as self-contained urban ecosystems, often devolve into stratified enclaves where the public realm is reduced to a simulacrum of urbanity -- a manicured podium garden accessible only to residents, a sky lobby whose breathtaking panorama is contingent upon a keycard. The promise of social heterogeneity, of the serendipitous encounters that Jane Jacobs so eloquently championed, evaporates at the threshold of the elevator bank. The architectural avant-garde has responded with a repertoire of formal strategies intended to subvert this hermetic verticality. Rotated floor plates, interlocking volumes, and skybridges that weave between adjacent towers gesture toward a porosity that the programmatic logic of the building ultimately resists. The result is a proliferation of sculptural objects that are visually compelling but spatially impoverished -- trophies of formal virtuosity that fail to reconstitute the urban ground they so spectacularly abandon. Across cities from Singapore to Bangkok to Ho Chi Minh City, the supertall has become the default typology for urban development, yet its relationship to the street, to the neighborhood, and to the civic realm remains stubbornly ambiguous. The challenge for the next generation of architects and urbanists is not merely to design taller or more energy-efficient towers, but to fundamentally rethink the relationship between vertical density and horizontal urbanism -- to imagine a skyscraper that does not merely rise above the city but is genuinely of it.",
    source: "Keller Easterling, \"Extrastatecraft: The Power of Infrastructure Space\" (Verso, 2014); adapted from \"Medium Design\" (Strelka Press, 2018)",

// ==================== APP STATE ====================
const START_DATE = new Date('2026-01-01');
let currentTab = 'today';
let selectedPassageId = null;
let searchTimeout = null;

function debounceSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(renderArchive, 300);
}

// ==================== INIT ====================
function init() {
  const savedTheme = localStorage.getItem('dailyReadingTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';

  // Use embedded data directly - no external dependencies
  document.getElementById('dbStatus').innerHTML = '<span class="status-dot online"></span>' + DB_PASSAGES.length + ' articles';

  // Today's article = the most recent one in the collection
  var latest = DB_PASSAGES[0];
  for (var i = 1; i < DB_PASSAGES.length; i++) {
    if (new Date(DB_PASSAGES[i].created_at) > new Date(latest.created_at)) latest = DB_PASSAGES[i];
  }
  selectedPassageId = latest.id;

  renderToday();
  renderArchive();
  updateDateBadge();
}

function updateDateBadge() {
  const today = new Date();
  const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('dateBadge').textContent = today.toLocaleDateString('en-US', options);
  document.getElementById('readingStats').textContent = DB_PASSAGES.length + ' articles in collection';
}

// ==================== HELPERS ====================
function findPassageById(id) {
  return DB_PASSAGES.find(p => p.id === id);
}

// ==================== THEME ====================
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('dailyReadingTheme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? 'Light' : 'Dark';
}

// ==================== TABS ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + tab + '"]').classList.add('active');

  document.getElementById('archiveSection').classList.toggle('show', tab === 'archive');

}

// ==================== TODAY'S PASSAGE ====================
function findPassageById(id) {
  return DB_PASSAGES.find(p => p.id === id);
}

function renderToday() {
  const passage = findPassageById(selectedPassageId) || DB_PASSAGES[0];
  if (!passage) {
    document.getElementById('todayPassage').innerHTML = '<div class="no-results">No articles available.</div>';
    return;
  }
  updateDateBadge();

  const titleWords = makeClickable(passage.title);
  const bodyWords = makeClickable(passage.en || '');

  const html = '<div class="passage-card">' +
    '<h2>' + titleWords + '</h2>' +
    '<div class="english-text" id="englishText">' + bodyWords + '</div>' +
    '<div id="bilingualContainer"></div>' +
    '<div class="translate-toggle">' +
      '<button class="toggle-btn" id="translateBtn" onclick="toggleFullTranslation(' + passage.id + ')">Full Translation</button>' +
    '</div>' +
    '<div class="source-citation">' + formatSource(passage.source) + '</div>' +
    '</div>';

  document.getElementById('todayPassage').innerHTML = html;
  hideBilingual();
}

let currentArticleId = null;
let currentBilingual = false;

function hideBilingual() {
  currentBilingual = false;
  var btn = document.getElementById('translateBtn');
  if (btn) {
    btn.textContent = 'Full Translation';
    btn.classList.remove('on');
  }
  var bc = document.getElementById('bilingualContainer');
  if (bc) bc.innerHTML = '';
  var et = document.getElementById('englishText');
  if (et) et.style.display = '';
}

function makeClickable(text) {
  return (text || '').split(/(\s+)/g).map(function(token) {
    if (/^\s+$/.test(token)) return token;
    var wordOnly = token.replace(/[^a-zA-Z'-]/g, '');
    if (wordOnly.length <= 1) return token;
    return '<span class="word" data-word="' + wordOnly.toLowerCase() + '" onclick="lookupWord(event,this.getAttribute(\'data-word\'))">' + token + '</span>';
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatSource(source) {
  if (!source) return '';
  const urlMatch = source.match(/(https?:\/\/[^\s,]+)/);
  var formatted = escapeHtml(source);
  if (urlMatch) {
    formatted = formatted.replace(urlMatch[0],
      '<a href="' + urlMatch[0] + '" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">[Read original]</a>');
  }
  return formatted;
}

// ==================== WORD LOOKUP ====================
let lookupCache = {};

function stemWord(word) {
  // Basic stemming for better dictionary hits
  var w = word.toLowerCase();
  if (w.endsWith('ies') && w.length > 4) return w.slice(0, -3) + 'y';
  if (w.endsWith('ves') && w.length > 4) return w.slice(0, -3) + 'f';
  if (w.endsWith('es') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('s') && !w.endsWith('ss') && w.length > 3) return w.slice(0, -1);
  if (w.endsWith('ing') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ed') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('er') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('est') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ly') && w.length > 4) return w.slice(0, -2);
  if (w.endsWith('tion') && w.length > 6) return w.slice(0, -4) + 'e';
  if (w.endsWith('ment') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('ness') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('able') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('ful') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('less') && w.length > 6) return w.slice(0, -4);
  if (w.endsWith('ous') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('ive') && w.length > 5) return w.slice(0, -3);
  if (w.endsWith('al') && w.length > 4) return w.slice(0, -2);
  return word;
}

async function lookupWord(event, word) {
  event.stopPropagation();
  document.querySelectorAll('.word.active').forEach(function(w) { w.classList.remove('active'); });
  event.target.classList.add('active');

  var panel = document.getElementById('wordPanel');
  var content = document.getElementById('wpContent');
  panel.classList.add('show');
  content.innerHTML = '<div class="wp-loading"><div class="spinner"></div> Looking up... </div>';

  if (lookupCache[word]) {
    content.innerHTML = lookupCache[word];
    return;
  }

  // Fetch Chinese translation + dictionary entry in parallel
  var zhPromise = getChineseTranslation(word);
  var dictPromise = getDictionaryEntry(word);

  var zh = await zhPromise;
  var dict = await dictPromise;

  renderWordPanel(word, zh, dict);
}

function closeWordPanel() {
  document.getElementById('wordPanel').classList.remove('show');
  document.querySelectorAll('.word.active').forEach(function(w) { w.classList.remove('active'); });
}

async function getChineseTranslation(word) {
  // Immersive Translate extension
  try {
    if (window.immersiveTranslate && typeof window.immersiveTranslate.translateText === 'function') {
      var imText = await window.immersiveTranslate.translateText(word);
      if (imText && imText !== word) return imText;
    }
  } catch (e) {}
  // MyMemory API
  try {
    var res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en|zh-CN');
    if (res.ok) {
      var data = await res.json();
      var t = data.responseData && data.responseData.translatedText;
      if (t && t.toLowerCase() !== word.toLowerCase()) return t;
    }
  } catch (e) {}
  return '';
}

async function getDictionaryEntry(word) {
  var wordsToTry = [word];
  var stemmed = stemWord(word);
  if (stemmed !== word) wordsToTry.push(stemmed);

  for (var i = 0; i < wordsToTry.length; i++) {
    try {
      var res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(wordsToTry[i]));
      if (!res.ok) continue;
      var data = await res.json();
      if (data && data.length > 0) {
        return { entry: data[0], usedWord: wordsToTry[i], stemmed: stemmed !== word && wordsToTry[i] === stemmed };
      }
    } catch (e) {}
  }
  return null;
}

function renderWordPanel(originalWord, zh, dictResult) {
  var content = document.getElementById('wpContent');
  var html = '';

  var displayWord = dictResult && dictResult.entry ? dictResult.entry.word : originalWord;

  html += '<div class="wp-header">';
  html += '<div>';
  html += '<div class="wp-word">' + escapeHtml(displayWord) + '</div>';
  if (dictResult && dictResult.entry) {
    var ph = '';
    if (dictResult.entry.phonetic) ph = dictResult.entry.phonetic;
    else if (dictResult.entry.phonetics && dictResult.entry.phonetics.length > 0 && dictResult.entry.phonetics[0].text) {
      ph = dictResult.entry.phonetics[0].text;
    }
    if (ph) html += '<div class="wp-phonetic">' + escapeHtml(ph) + '</div>';
  }
  html += '</div>';
  html += '<button class="wp-close" onclick="closeWordPanel()">&times;</button>';
  html += '</div>';

  html += '<div class="wp-body">';

  // Chinese translation
  if (zh) {
    html += '<div class="wp-zh">' + escapeHtml(zh) + '</div>';
  }

  // Word forms (鍘熷瀷 / root)
  var stemmedRoot = stemWord(originalWord);
  if (stemmedRoot !== originalWord.toLowerCase() || (dictResult && dictResult.stemmed)) {
    html += '<div class="wp-section-label">Base form</div>';
    html += '<div class="wp-forms"><span class="wp-form-chip">' + escapeHtml(stemmedRoot) + '</span></div>';
  }

  // Dictionary definitions
  if (dictResult && dictResult.entry) {
    var entry = dictResult.entry;
    var totalDefs = 0;
    for (var mi = 0; mi < entry.meanings.length; mi++) {
      var m = entry.meanings[mi];
      if (totalDefs >= 8) break;
      html += '<div class="wp-meaning">';
      html += '<div class="wp-pos">' + escapeHtml(m.partOfSpeech) + '</div>';
      var shownInPos = 0;
      for (var di = 0; di < m.definitions.length && totalDefs < 8; di++) {
        var def = m.definitions[di];
        html += '<div class="wp-def"><span class="def-num">' + (shownInPos + 1) + '.</span>' + escapeHtml(def.definition) + '</div>';
        if (def.example) {
          html += '<div class="wp-example">"' + escapeHtml(def.example) + '"</div>';
        }
        if (def.synonyms && def.synonyms.length > 0 && shownInPos === 0) {
          html += '<div class="wp-syn"><b>syn</b> ' + def.synonyms.slice(0, 5).map(function(s) { return escapeHtml(s); }).join(', ') + '</div>';
        }
        shownInPos++;
        totalDefs++;
      }
      html += '</div>';
    }
  } else {
    html += '<div class="wp-not-found">No definition found for "' + escapeHtml(originalWord) + '".</div>';
  }

  html += '</div>';

  lookupCache[originalWord] = html;
  content.innerHTML = html;
}

// ==================== FULL TEXT TRANSLATION ====================
function splitSentences(text) {
  var cleaned = text.replace(/\s+/g, ' ').trim();
  var sentences = cleaned.match(/[^.!?]+[.!?]+["']?|\S+$/g) || [];
  var result = [];
  var buffer = '';
  for (var i = 0; i < sentences.length; i++) {
    var s = sentences[i].trim();
    if (buffer.length + s.length < 480) {
      buffer += (buffer ? ' ' : '') + s;
    } else {
      if (buffer) result.push(buffer);
      buffer = s;
    }
  }
  if (buffer) result.push(buffer);
  return result;
}

async function toggleFullTranslation(passageId) {
  currentArticleId = passageId;
  var btn = document.getElementById('translateBtn');
  var bc = document.getElementById('bilingualContainer');
  var et = document.getElementById('englishText');

  // If currently showing bilingual, hide it
  if (currentBilingual) {
    hideBilingual();
    return;
  }

  // Show loading state
  btn.textContent = 'Translating...';
  btn.classList.add('on');
  bc.classList.add('show');
  bc.innerHTML = '<div class="loading-indicator"><div class="spinner"></div><div style="margin-top:10px;font-size:0.85rem;">Translating...</div></div>';

  var passage = findPassageById(passageId);
  if (!passage) {
    btn.textContent = 'Full Translation';
    return;
  }

  var cacheKey = 'translation-' + passageId;
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch(e) {}

  if (cached && cached.sentences && cached.sentences.length > 0) {
    renderBilingual(passage, cached.sentences);
    btn.textContent = 'Hide Translation';
    currentBilingual = true;
    return;
  }

  var sentences = splitSentences(passage.en || '');
  var translated = [];
  var failed = 0;

  for (var i = 0; i < sentences.length; i++) {
    try {
      var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(sentences[i]) + '&langpair=en|zh-CN';
      var res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var zh = data.responseData && data.responseData.translatedText;
      if (zh && zh !== sentences[i]) {
        translated.push(zh);
      } else {
        translated.push('');
        failed++;
      }
    } catch (e) {
      translated.push('');
      failed++;
    }
  }

  // Cache result
  try {
    localStorage.setItem(cacheKey, JSON.stringify({ sentences: translated, en: sentences }));
  } catch(e) {}

  if (failed === sentences.length) {
    bc.innerHTML = '<div class="no-results" style="font-size:0.85rem;">Translation unavailable. Please try again later.</div>';
    btn.textContent = 'Full Translation';
    btn.classList.remove('on');
    currentBilingual = false;
    return;
  }

  renderBilingual(passage, translated, sentences);
  btn.textContent = 'Hide Translation';
  currentBilingual = true;
}

function renderBilingual(passage, zhLines, enLines) {
  var bc = document.getElementById('bilingualContainer');
  var et = document.getElementById('englishText');
  if (et) et.style.display = 'none';

  var html = '<div class="bilingual-text show">';
  var enSentences = enLines || splitSentences(passage.en || '');
  for (var i = 0; i < enSentences.length; i++) {
    var enClickable = makeClickable(enSentences[i]);
    var zh = zhLines[i] || '';
    html += '<p class="en-line">' + enClickable + '</p>';
    if (zh) html += '<p class="zh-line">' + zh + '</p>';
  }
  html += '</div>';
  bc.innerHTML = html;
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('word') && !e.target.closest('.word-panel')) {
    closeWordPanel();
  }
});

// ==================== ARCHIVE ====================
function renderArchive() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const list = document.getElementById('archiveList');
  let filtered = [...DB_PASSAGES];

  if (searchTerm) {
    filtered = filtered.filter(p =>
      (p.title && p.title.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.en && p.en.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.source && p.source.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.tags && p.tags.some(t => t.toLowerCase().indexOf(searchTerm) !== -1))
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">No matching articles found.</div>';
    return;
  }

  list.innerHTML = filtered.map(p => {
    const d = p.created_at ? new Date(p.created_at) : new Date();
    const dateStr = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    const preview = (p.en || '').replace(/\s+/g,' ').substring(0, 140) + '...';
    const tags = p.tags && Array.isArray(p.tags) ? p.tags : [];
    const srcPreview = (p.source || '').substring(0, 80);

    return '<div class="archive-item" onclick="openPassage(' + p.id + ')">' +
      '<div class="archive-date">' + dateStr + '</div>' +
      '<div class="archive-title">' + escapeHtml(p.title) + '</div>' +
      '<div class="archive-preview">' + escapeHtml(preview) + '</div>' +
      '<div class="archive-tags">' + tags.map(t => '<span class="archive-tag">' + escapeHtml(t) + '</span>').join('') + '</div>' +
      '<div class="archive-source">' + escapeHtml(srcPreview) + '</div>' +
      '</div>';
  }).join('');
}

// ==================== MODAL ====================
function openPassage(id) {
  const passage = findPassageById(id);
  if (!passage) return;

  var titleHtml = makeClickable(passage.title);
  var bodyHtml = makeClickable(passage.en || '');

  document.getElementById('modalInner').innerHTML =
    '<h2 style="color:var(--accent);font-weight:400;margin-bottom:20px;">' + titleHtml + '</h2>' +
    '<div class="english-text">' + bodyHtml + '</div>' +
    '<div class="source-citation" style="margin-bottom:20px;">' + formatSource(passage.source) + '</div>';

  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
  closeWordPanel();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModalDirect();
    closeWordPanel();
  }
});

// ==================== TIMELINE ====================
let tooltipShowDelay = null;
let tooltipHideDelay = null;

function buildDateMap() {
  // Sort articles by created_at, map each to a consecutive day ending today
  var sorted = [...DB_PASSAGES].sort(function(a, b) {
    return new Date(a.created_at) - new Date(b.created_at);
  });
  var map = [];
  var today = new Date();
  for (var i = 0; i < sorted.length; i++) {
    var d = new Date(today);
    d.setDate(d.getDate() - (sorted.length - 1 - i));
    map.push({ date: d, article: sorted[i] });
  }
  return map;
}

function renderTimeline() {
  var container = document.getElementById('timeline');
  if (!container) return;
  var dateMap = buildDateMap();
  var todayStr = new Date().toDateString();

  var year = new Date().getFullYear();
  var html = '<div class="timeline-year">' + year + '</div>';
  html += '<div class="timeline-scroll">';
  for (var i = 0; i < dateMap.length; i++) {
    var entry = dateMap[i];
    var dateStr = entry.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var isToday = entry.date.toDateString() === todayStr;
    var activeClass = entry.article.id === selectedPassageId ? ' active' : '';
    html += '<div class="timeline-row" data-id="' + entry.article.id + '" onmouseenter="showTimelineTooltip(this,' + entry.article.id + ')" onmouseleave="hideTimelineTooltip()" onclick="openPassage(' + entry.article.id + ')">' +
      '<span class="timeline-date-label">' + dateStr + '</span>' +
      '<span class="timeline-item has-article' + activeClass + '"></span>' +
      '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function showTimelineTooltip(rowEl, articleId) {
  clearTimeout(tooltipHideDelay);
  var article = findPassageById(articleId);
  if (!article) return;
  var card = document.getElementById('timelineCard');
  var dot = rowEl.querySelector('.timeline-item');
  var rect = dot.getBoundingClientRect();
  var d = new Date(article.created_at);

  document.getElementById('cardTitle').textContent = article.title;
  document.getElementById('cardMeta').innerHTML =
    d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) +
    ' | ' + (article.word_count || '') + ' words';
  var tagsHtml = '';
  var tags = article.tags || [];
  for (var i = 0; i < Math.min(tags.length, 3); i++) {
    tagsHtml += '<span class="card-tag">' + escapeHtml(tags[i]) + '</span>';
  }
  document.getElementById('cardTags').innerHTML = tagsHtml;

  var cardWidth = Math.min(280, window.innerWidth * 0.25);
  var cardLeft = rect.right + 24;
  var cardTop = rect.top + rect.height / 2 - 70;
  if (cardLeft + cardWidth > window.innerWidth - 20) cardLeft = rect.right - cardWidth - 30;
  card.style.left = cardLeft + 'px';
  card.style.top = Math.max(10, Math.min(cardTop, window.innerHeight - 190)) + 'px';

  // Apple-style: slight delay before flip reveal
  clearTimeout(tooltipShowDelay);
  tooltipShowDelay = setTimeout(function() {
    card.classList.add('show');
  }, 100);
}

function hideTimelineTooltip() {
  clearTimeout(tooltipShowDelay);
  clearTimeout(tooltipHideDelay);
  // Grace period so the flip animation can finish before hiding
  tooltipHideDelay = setTimeout(function() {
    document.getElementById('timelineCard').classList.remove('show');
  }, 350);
}

// ==================== START ====================
init();
renderTimeline();
</script>
