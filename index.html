[data-theme="dark"] {

* { margin:0; padding:0; box-sizing:border-box; }
body {

  background:var(--bg); color:var(--text); min-height:100vh; line-height:1.8;

}
.container { max-width:860px; margin:0 auto; padding:20px 24px 60px; }
.header {
  display:flex; justify-content:space-between; align-items:center;
  padding:24px 0; border-bottom:1px solid var(--border); margin-bottom:32px;
}
.header h1 { font-size:1.5rem; font-weight:400; letter-spacing:0.04em; color:var(--accent); }
.header-actions { display:flex; gap:12px; align-items:center; }
.header-btn {
  background:none; border:1px solid var(--border); color:var(--text-secondary);
  padding:6px 14px; border-radius:20px; cursor:pointer; font-size:0.85rem;

.header-btn:hover { border-color:var(--accent); color:var(--accent); }
.status-dot {
  width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;

.status-dot.online { background:var(--success); }
.status-dot.offline { background:#c44; }
.tabs { display:flex; gap:0; margin-bottom:28px; border-bottom:1px solid var(--border); }
.tab {
  padding:10px 24px; cursor:pointer; font-size:0.95rem; color:var(--text-secondary);
  border-bottom:2px solid transparent; transition:all 0.2s; background:none; border-top:none;
  border-left:none; border-right:none; font-family:inherit;
}
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.daily-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;
}
.date-badge {
  font-size:0.85rem; color:var(--text-secondary); background:var(--accent-light);
  padding:4px 14px; border-radius:20px;
}
.passage-card {
  background:var(--card-bg); border-radius:12px; padding:36px 32px;
  box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:28px;

.passage-card h2 {
  font-size:1.25rem; font-weight:400; margin-bottom:24px;
  color:var(--accent); letter-spacing:0.02em;
}
.english-text {
  font-size:1.1rem; line-height:2; margin-bottom:32px; text-align:justify;
}
.english-text .word {
  cursor:pointer; transition:background 0.15s; border-radius:3px; padding:1px 2px; margin:0 -1px;
}
.english-text .word:hover { background:var(--highlight); }
.english-text .word.active { background:var(--highlight); }
.source-citation {
  font-size:0.85rem; color:var(--text-secondary); font-style:italic;
  padding-top:16px; border-top:1px solid var(--border);

.translation-toggle {
  display:flex; gap:10px; align-items:center; margin-top:24px;

.toggle-btn {
  background:none; border:1px solid var(--border); color:var(--text-secondary);

  font-family:inherit; transition:all 0.2s;

.toggle-btn:hover { border-color:var(--accent); color:var(--accent); }
.toggle-btn.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.translation-section { margin-top:20px; display:none; }
.translation-section.show { display:block; }
.chinese-text {
  font-family:'Noto Serif SC','Source Han Serif SC','SimSun',serif;
  font-size:1.05rem; line-height:2; color:var(--text-secondary);
  text-align:justify; padding:20px 24px; background:var(--accent-light);
  border-radius:8px; border-left:3px solid var(--accent);
}
.word-tooltip {
  position:fixed; z-index:1000; background:var(--tooltip-bg); color:var(--tooltip-text);

.word-tooltip .phonetic { color:var(--accent); font-size:0.8rem; margin-bottom:6px; }
.word-tooltip .def { margin-bottom:4px; }

.passages-list { display:none; }

.search-bar {

.search-input {

.search-input:focus { outline:none; border-color:var(--accent); }
.archive-list { display:flex; flex-direction:column; gap:12px; }
.archive-item {
  background:var(--card-bg); border:1px solid var(--border); border-radius:10px;

.archive-item:hover { border-color:var(--accent); transform:translateY(-1px); }
.archive-item .archive-date { font-size:0.8rem; color:var(--text-secondary); margin-bottom:6px; }
.archive-item .archive-title { font-size:1.05rem; color:var(--text); margin-bottom:8px; }
.archive-item .archive-preview {

.archive-item .archive-tags { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.archive-tag {

.archive-item .archive-source { font-size:0.8rem; color:var(--accent); margin-top:8px; font-style:italic; }
.modal-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);

.modal-overlay.show { display:flex; }
.modal {
  background:var(--card-bg); border-radius:16px; max-width:800px; width:100%;
  max-height:85vh; overflow-y:auto; padding:36px 32px; box-shadow:0 20px 60px rgba(0,0,0,0.3);

.modal-close {
  position:absolute; top:16px; right:20px; background:none; border:none;

.modal-close:hover { color:var(--text); }

@keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
.loading-dot { animation:pulse 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2) { animation-delay:0.2s; }
.loading-dot:nth-child(3) { animation-delay:0.4s; }
.loading-indicator { text-align:center; padding:40px; color:var(--text-secondary); }
.spinner {
  display:inline-block; width:24px; height:24px; border:3px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;

@keyframes spin { to { transform:rotate(360deg); } }
@media (max-width:640px) {
  .container { padding:12px 16px 40px; }
  .passage-card { padding:24px 18px; }
  .english-text { font-size:1rem; }
  .header h1 { font-size:1.2rem; }
  .tab { padding:8px 16px; font-size:0.85rem; }
}
</style>

    zh: `鎽╁ぉ澶фゼ鈥斺€斾簩鍗佷笘绾泟蹇冪殑鍏稿瀷璞″緛鈥斺€斿湪浜屽崄涓€涓栫邯鏈€鍒濆嚑鍗佸勾缁忓巻浜嗕竴鍦烘繁鍒荤殑鏈綋璁鸿浆鍙樸€傚綋浠ｅ妤间笉鍐嶄粎浠呮槸璧勬湰涓讳箟绻佽崳鐨勫鎺ㄢ€斺€斾竴绉嶆寫鎴橀噸鍔涚殑閽㈤搧涓庣幓鐠冪殑闃冲叿寮忕獊璧封€斺€旇€屾槸娓存湜瀹炵幇鐢熸€佺鐞嗐€佺ぞ浼氭笚閫忔€т笌褰㈠紡瀹為獙涔嬮棿鏇村井濡欑殑缁煎悎銆傜劧鑰岋紝杩欑娓存湜甯稿父琚姇鏈烘€у紑鍙戦毦浠ラ┚椹殑鐜板疄鎵€鎸触锛氳储鍔℃ā鍨嬬殑绱ц揩瑕佹眰銆佹ゼ鏉垮钩闈㈢殑涓撳埗銆佷互鍙婂噣闈㈢Н涓庢瘺闈㈢Н姣旂巼鐨勪笉鎳堜紭鍖栵紝鍏卞悓鐐埗鍑轰竴绉嶅崈绡囦竴寰嬬殑鍨傜洿鎬э紝鎺╃洊浜嗗缓绛戝笀浠洿楂樿繙鐨勬姳璐熴€備互涓滃崡浜氬ぇ閮藉競杩戝勾鏉ユ縺澧炵殑娣峰悎鐢ㄩ€旇秴楂樺眰涓轰緥銆傝繖浜涘妤艰〃闈笂琚瀯鎯充负鑷粰鑷冻鐨勫煄甯傜敓鎬佺郴缁燂紝鍗村父甯搁€€鍖栦负鍒嗗眰鐨勯鍦帮紝鍏叡棰嗗煙鍦ㄦ娌︿负閮藉競鎬х殑鎷熷儚銆傚缓绛戝墠鍗淳浠ヤ竴绯诲垪褰㈠紡绛栫暐鍥炲簲锛屾剰鍥鹃瑕嗚繖绉嶅皝闂殑鍨傜洿鎬р€斺€旀棆杞殑妤兼澘銆佷氦閿欑殑浣撻噺鍜岀┖涓繛寤娾€斺€旀殫绀虹潃涓€绉嶅缓绛戞渶缁堢殑鍔熻兘閫昏緫鎵€鎶楁嫆鐨勬笚閫忔€с€俙,
    source: "Keller Easterling, \"Extrastatecraft: The Power of Infrastructure Space\" (Verso, 2014)",
    tags: ["architecture","urbanism","skyscraper"], difficulty: "advanced", word_count: 385
  }
];

// ==================== SUPABASE CLIENT ====================
let supabase = null;
let isOnline = false;
let dbPassages = [];

function initSupabase() {
  if (!SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    updateDbStatus(false);
    return;
  }
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    updateDbStatus(true);
    return supabase;
  } catch (e) {
    console.warn('Supabase init failed:', e);
    updateDbStatus(false);
    return null;
  }
}

function updateDbStatus(online) {
  isOnline = online;
  const el = document.getElementById('dbStatus');
  if (online) {
    el.innerHTML = '<span class="status-dot online"></span>鍦ㄧ嚎妯″紡';
    el.title = '宸茶繛鎺?Supabase 鏁版嵁搴?;
  } else {
    el.innerHTML = '<span class="status-dot offline"></span>绂荤嚎妯″紡';
    el.title = '鏈繛鎺ユ暟鎹簱锛屼娇鐢ㄦ湰鍦扮ず渚嬫枃绔?;
  }
}

// ==================== FETCH FROM SUPABASE ====================
async function fetchPassages() {
  if (!supabase) {
    dbPassages = [];
    return;
  }
  try {
    const { data, error } = await supabase
      .from('passages')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(200);
    if (error) throw error;
    dbPassages = data || [];
    updateDbStatus(true);
  } catch (e) {
    console.warn('Fetch passages failed:', e.message);
    dbPassages = [];
    updateDbStatus(false);
  }
}

function allPassages() {
  return isOnline && dbPassages.length > 0 ? dbPassages : FALLBACK_PASSAGES;
}

// ==================== APP STATE ====================
const START_DATE = new Date('2026-01-01');
let currentTab = 'today';
let showTranslation = false;
let selectedPassageId = null;
let searchTimeout = null;

function debounceSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(renderArchive, 300);
}

// ==================== INIT ====================
async function init() {
  const savedTheme = localStorage.getItem('dailyReadingTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';

  initSupabase();
  await fetchPassages();

  const passages = allPassages();
  const today = new Date();
  const dayIndex = Math.floor((today - START_DATE) / (1000 * 60 * 60 * 24));
  selectedPassageId = (Math.abs(dayIndex) % Math.max(passages.length, 1)) + 1;

  renderToday();
  renderArchive();
  updateDateBadge();
}

function updateDateBadge() {
  const today = new Date();
  const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('dateBadge').textContent = today.toLocaleDateString('zh-CN', options);
  const count = allPassages().length;
  document.getElementById('readingStats').textContent = `鍏?${count} 绡?路 浠婃棩绗?${selectedPassageId} 绡嘸;
}

// ==================== THEME ====================
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('dailyReadingTheme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? 'Light' : 'Dark';
}

// ==================== TABS ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById('todaySection').style.display = tab === 'today' ? 'block' : 'none';
  document.getElementById('archiveSection').classList.toggle('show', tab === 'archive');
  if (tab === 'archive') renderArchive();
}

// ==================== TODAY'S PASSAGE ====================
function findPassageById(id) {
  return allPassages().find(p => p.id === id);
}

function renderToday() {
  const passage = findPassageById(selectedPassageId) || allPassages()[0];
  if (!passage) {
    document.getElementById('todayPassage').innerHTML = '<div class="no-results">鏆傛棤鏂囩珷</div>';
    return;
  }
  updateDateBadge();

  const words = passage.en.split(/(\s+)/g);
  const wordElements = words.map(token => {
    if (/^\s+$/.test(token)) return token;
    const cleaned = token.replace(/[^a-zA-Z'-]/g, '').toLowerCase();
    if (cleaned.length <= 1) return token;
    const wordOnly = token.replace(/[^a-zA-Z'-]/g, '');
    return `<span class="word" data-word="${wordOnly.toLowerCase()}" onclick="lookupWord(event,'${wordOnly.toLowerCase().replace(/'/g,"\\'")}')">${token}</span>`;
  }).join('');

  const html = `
    <div class="passage-card">
      <h2>${escapeHtml(passage.title)}</h2>
      <div class="english-text" id="englishText">${wordElements}</div>
      <div class="source-citation">&#8212; ${formatSource(passage.source)}</div>
      <div class="translation-toggle">
        <button class="toggle-btn ${showTranslation?'on':''}" onclick="toggleTranslation()">
          ${showTranslation?'闅愯棌':'鏄剧ず'}涓枃缈昏瘧
        </button>
      </div>
      <div class="translation-section ${showTranslation?'show':''}" id="translationSection">
        <div class="chinese-text">${escapeHtml(passage.zh)}</div>
      </div>
    </div>
  `;

  document.getElementById('todayPassage').innerHTML = html;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatSource(source) {
  if (!source) return '';
  // Extract URLs and make them clickable
  const urlMatch = source.match(/(https?:\/\/[^\s,]+)/);
  let formatted = escapeHtml(source);
  if (urlMatch) {
    const url = urlMatch[0];
    formatted = formatted.replace(
      url,
      `<a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">[鏌ョ湅鍘熸枃]</a>`
    );
  }
  return formatted;
}

function toggleTranslation() {
  showTranslation = !showTranslation;
  const section = document.getElementById('translationSection');
  if (section) section.classList.toggle('show', showTranslation);
  const btn = document.querySelector('.toggle-btn');
  if (btn) {
    btn.textContent = showTranslation ? '闅愯棌涓枃缈昏瘧' : '鏄剧ず涓枃缈昏瘧';
    btn.classList.toggle('on', showTranslation);
  }
}

// ==================== WORD LOOKUP ====================
let tooltipTimeout = null;
let lookupCache = {};

async function lookupWord(event, word) {
  event.stopPropagation();
  const tooltip = document.getElementById('wordTooltip');
  document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
  event.target.classList.add('active');

  const rect = event.target.getBoundingClientRect();
  let left = rect.left + rect.width / 2;
  let top = rect.bottom + 8;
  if (left + 160 > window.innerWidth) left = window.innerWidth - 170;
  if (left < 10) left = 10;
  if (top + 200 > window.innerHeight) top = rect.top - 200;

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
  tooltip.style.display = 'block';
  tooltip.innerHTML = `<div class="word-head">${word}</div><div class="loading"><span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span> 鏌ヨ涓?/div>`;

  if (lookupCache[word]) {
    tooltip.innerHTML = lookupCache[word];
    resetTooltipTimer();
    return;
  }

  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!res.ok) throw new Error('Not found');
    const data = await res.json();
    const entry = data[0];
    let html = `<div class="word-head">${entry.word}</div>`;
    const phonetic = entry.phonetics && entry.phonetics[0];
    if (phonetic && phonetic.text) html += `<div class="phonetic">${phonetic.text}</div>`;
    else if (entry.phonetic) html += `<div class="phonetic">/${entry.phonetic.replace(/^\//,'').replace(/\/$/,'')}/</div>`;

    let count = 0;
    for (const m of entry.meanings) {
      if (count >= 3) break;
      html += `<div style="color:var(--accent);font-size:0.75rem;margin-top:4px;">${m.partOfSpeech}</div>`;
      for (const d of m.definitions) {
        if (count >= 3) break;
        html += `<div class="def"><strong>${count+1}.</strong> ${d.definition}</div>`;
        count++;
      }
    }
    lookupCache[word] = html;
    tooltip.innerHTML = html;
  } catch (err) {
    lookupCache[word] = `<div class="word-head">${word}</div><div style="color:var(--text-secondary);font-size:0.8rem;">鏈壘鍒伴噴涔?/div>`;
    tooltip.innerHTML = lookupCache[word];
  }

  resetTooltipTimer();
}

function resetTooltipTimer() {
  clearTimeout(tooltipTimeout);
  tooltipTimeout = setTimeout(() => {
    document.getElementById('wordTooltip').style.display = 'none';
    document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
  }, 8000);
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('word')) {
    document.getElementById('wordTooltip').style.display = 'none';
    document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
    clearTimeout(tooltipTimeout);
  }
});

// ==================== ARCHIVE ====================
function renderArchive() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const dateFilter = document.getElementById('dateFilter').value;
  const list = document.getElementById('archiveList');
  let filtered = [...allPassages()];

  if (searchTerm) {
    filtered = filtered.filter(p =>
      (p.title && p.title.toLowerCase().includes(searchTerm)) ||
      (p.en && p.en.toLowerCase().includes(searchTerm)) ||
      (p.zh && p.zh.includes(searchTerm)) ||
      (p.source && p.source.toLowerCase().includes(searchTerm)) ||
      (p.tags && p.tags.some(t => t.toLowerCase().includes(searchTerm)))
    );
  }

  if (dateFilter) {
    filtered = filtered.filter(p => {
      if (!p.created_at) return false;
      const d = new Date(p.created_at).toISOString().split('T')[0];
      return d === dateFilter;
    });
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">娌℃湁鎵惧埌鍖归厤鐨勬枃绔?/div>';
    return;
  }

  list.innerHTML = filtered.map(p => {
    const d = p.created_at ? new Date(p.created_at) : new Date();
    const dateStr = d.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });
    const preview = (p.en || '').replace(/\s+/g,' ').substring(0, 120) + '...';
    const tags = p.tags && Array.isArray(p.tags) ? p.tags : [];
    const srcPreview = (p.source || '').substring(0, 80) + '...';

    return `
      <div class="archive-item" onclick="openPassage(${p.id})">
        <div class="archive-date">${dateStr}</div>
        <div class="archive-title">${escapeHtml(p.title)}</div>
        <div class="archive-preview">${escapeHtml(preview)}</div>
        <div class="archive-tags">
          ${tags.map(t => `<span class="archive-tag">${escapeHtml(t)}</span>`).join('')}
        </div>
        <div class="archive-source">${escapeHtml(srcPreview)}</div>
      </div>
    `;
  }).join('');
}

// ==================== MODAL ====================
function openPassage(id) {
  const passage = findPassageById(id);
  if (!passage) return;

  const words = (passage.en || '').split(/(\s+)/g);
  const wordElements = words.map(token => {
    if (/^\s+$/.test(token)) return token;
    const cleaned = token.replace(/[^a-zA-Z'-]/g, '').toLowerCase();
    if (cleaned.length <= 1) return token;
    const wordOnly = token.replace(/[^a-zA-Z'-]/g, '');
    return `<span class="word" data-word="${wordOnly.toLowerCase()}" onclick="lookupWord(event,'${wordOnly.toLowerCase().replace(/'/g,"\\'")}')">${token}</span>`;
  }).join('');

  document.getElementById('modalInner').innerHTML = `
    <h2 style="color:var(--accent);font-weight:400;margin-bottom:20px;">${escapeHtml(passage.title)}</h2>
    <div class="english-text">${wordElements}</div>
    <div class="source-citation" style="margin-bottom:20px;">&#8212; ${formatSource(passage.source)}</div>
    <div class="chinese-text">${escapeHtml(passage.zh)}</div>
  `;

  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
  document.getElementById('wordTooltip').style.display = 'none';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModalDirect();
});

init();
