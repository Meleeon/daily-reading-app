<style>

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Georgia', 'Times New Roman', 'Noto Serif', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;

.container { max-width:860px; margin:0 auto; padding:20px 24px 60px; }
.header {

.header-btn {
  background:none; border:1px solid var(--border); color:var(--text-secondary);
  padding:6px 14px; border-radius:20px; cursor:pointer; font-size:0.82rem;
  font-family:inherit; transition:all 0.2s;
}
.header-btn:hover { border-color:var(--accent); color:var(--accent); }
.status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }

}
.date-badge {
  font-size:0.82rem; color:var(--text-secondary); background:var(--accent-light);
  padding:4px 14px; border-radius:20px;
}
.passage-card {
  background:var(--card-bg); border-radius:10px; padding:32px 28px;
  box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:24px;
}
.passage-card h2 {
  font-size:1.2rem; font-weight:400; margin-bottom:20px;
  color:var(--accent); letter-spacing:0.02em;
}
.english-text {
  font-size:1.08rem; line-height:1.5; margin-bottom:24px; text-align:justify;
  -webkit-font-smoothing: antialiased;
}
.english-text .word {
  cursor:pointer; transition:background 0.15s; border-radius:3px; padding:1px 2px; margin:0 -1px;
}
.english-text .word:hover { background:var(--highlight); }
.english-text .word.active { background:var(--highlight); }
.source-citation {
  font-size:0.82rem; color:var(--text-secondary); font-style:italic;
  padding-top:14px; border-top:1px solid var(--border);
}
.translate-toggle { display:flex; gap:10px; align-items:center; margin-top:16px; }
.toggle-btn {
  background:none; border:1px solid var(--border); color:var(--text-secondary);
  padding:7px 18px; border-radius:20px; cursor:pointer; font-size:0.82rem;
  font-family:inherit; transition:all 0.2s;
}
.toggle-btn:hover { border-color:var(--accent); color:var(--accent); }
.toggle-btn.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.bilingual-text { margin-top:18px; display:none; }
.bilingual-text.show { display:block; }
.en-line {
  font-family:'Georgia','Times New Roman',serif;
  font-size:1.05rem; line-height:1.5; color:var(--text);
  margin-bottom:4px; text-align:justify;
}
.zh-line {
  font-size:0.95rem; line-height:1.5; color:var(--text-secondary);
  margin-bottom:12px; padding-left:14px; border-left:2px solid var(--accent-light);
}
.timeline {
  position:fixed; left:max(20px, calc(50% - 640px));
  top:50%; transform:translateY(-50%);
  z-index:900; display:flex; flex-direction:column; align-items:flex-end;
  max-height:78vh;
  opacity:0; animation:timelineIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
}
@keyframes timelineIn {
  from { opacity:0; transform:translateY(-50%) translateX(-18px); }
  to { opacity:1; transform:translateY(-50%) translateX(0); }
}
.timeline-year {
  font-size:0.78rem; color:var(--accent); letter-spacing:0.12em;
  font-weight:600; margin-bottom:10px;
  background:var(--bg); padding:2px 6px; border-radius:4px; z-index:2;
  opacity:0; animation:yearIn 0.6s cubic-bezier(0.22,1,0.36,1) 0.5s forwards;
}
@keyframes yearIn {
  from { opacity:0; transform:translateY(-10px); }
  to { opacity:1; transform:translateY(0); }
}
.timeline-scroll {
  position:relative;
  overflow-y:auto; max-height:calc(78vh - 40px);
  scrollbar-width:none; -ms-overflow-style:none;
  scroll-behavior:smooth;
  padding:4px 0;
}
.timeline-scroll::-webkit-scrollbar { display:none; }
.timeline-scroll::before {
  content:''; position:absolute; right:5px; top:8px; bottom:8px;
  width:1.5px; background:var(--border); border-radius:1px;
  transform:translateX(50%);
}
.timeline-row {
  position:relative; display:flex; align-items:center; justify-content:flex-end;
  gap:14px; cursor:pointer; padding:7px 4px;
}
.timeline-date-label {
  font-size:0.72rem; color:var(--text-secondary); white-space:nowrap;
  font-weight:600; pointer-events:none;
  transition:color 0.25s ease;
}
.timeline-row:hover .timeline-date-label { color:var(--accent); }
.timeline-item {
  position:relative; width:12px; height:12px; border-radius:50%;
  flex-shrink:0;
  background:var(--card-bg); border:2px solid var(--border); cursor:pointer;
  z-index:1;
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
             background 0.25s ease,
             border-color 0.25s ease,
             box-shadow 0.35s cubic-bezier(0.22,1,0.36,1);
}
.timeline-item.has-article { border-color:var(--accent); background:var(--accent); }
.timeline-row:hover .timeline-item {
  transform:scale(1.7);
  background:var(--accent);
  box-shadow:0 0 0 5px var(--accent-light);
}
.timeline-item.active { box-shadow:0 0 0 5px var(--accent-light); }
.timeline-row:active .timeline-item { transform:scale(1.3); }
.timeline-article-card {
  position:fixed; z-index:3000; pointer-events:none;
  opacity:0; visibility:hidden;
  transition:opacity 0.18s ease, visibility 0.18s ease;
}
.timeline-article-card.show { opacity:1; visibility:visible; }
.timeline-article-card .card-inner {
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 18px;
  max-width:300px;
  box-shadow:0 14px 44px rgba(0,0,0,0.2);
  transform-origin:left center;
  transform:perspective(900px) rotateY(72deg) translateX(-14px);
  backface-visibility:hidden;
  will-change:transform;
  transition:transform 0.55s cubic-bezier(0.22,1,0.36,1);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.timeline-article-card.show .card-inner {
  transform:perspective(900px) rotateY(0deg) translateX(0);
}
.card-title {
  font-size:0.85rem; font-weight:600; line-height:1.35;
  color:var(--text);
  margin-bottom:6px;
}
.card-meta {
  font-size:0.72rem; color:var(--text-secondary); line-height:1.4;
}
.card-tags { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
.card-tag {
  font-size:0.68rem; background:var(--accent-light); color:var(--accent);
  padding:1px 8px; border-radius:9px;
}
@media (max-width:1120px) { .timeline { display:none; } }
.word-panel {
  position:fixed; right:0; top:72px;
  width:330px; max-height:calc(100vh - 100px);
  overflow-y:auto;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-right:none;
  border-radius:14px 0 0 14px;
  box-shadow:-8px 4px 40px rgba(0,0,0,0.18);
  z-index:2600;
  transform:translateX(105%);
  transition:transform 0.45s cubic-bezier(0.22,1,0.36,1);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding:0;
}
.word-panel.show { transform:translateX(0); }
.wp-header {
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:20px 22px 14px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--card-bg); z-index:2;
}
.wp-word {
  font-family:'Georgia','Times New Roman',serif;
  font-size:1.5rem; font-weight:700; color:var(--text);
}
.wp-phonetic {
  font-size:0.85rem; color:var(--accent); margin-top:2px;
}
.wp-close {
  background:none; border:none; font-size:1.3rem; cursor:pointer;
  color:var(--text-secondary); line-height:1; padding:4px;
}
.wp-close:hover { color:var(--text); }
.wp-body { padding:16px 22px 24px; }
.wp-zh {
  font-size:1.05rem; color:var(--accent); margin-bottom:14px; line-height:1.5;
}
.wp-section-label {
  font-size:0.68rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--text-secondary); margin:14px 0 6px;
}
.wp-forms {
  display:flex; flex-wrap:wrap; gap:6px;
}
.wp-form-chip {
  font-size:0.78rem; background:var(--accent-light); color:var(--accent);
  padding:2px 10px; border-radius:10px;
}
.wp-meaning { margin-bottom:12px; }
.wp-pos {
  font-size:0.8rem; font-style:italic; color:var(--accent);
  margin:10px 0 4px; font-weight:600;
}
.wp-def {
  font-size:0.86rem; line-height:1.5; color:var(--text);
  margin-bottom:6px; padding-left:4px;
}
.wp-def .def-num { color:var(--accent); font-weight:600; margin-right:6px; }
.wp-example {
  font-size:0.78rem; color:var(--text-secondary); font-style:italic;
  margin:2px 0 6px 16px; line-height:1.45;
}
.wp-syn {
  font-size:0.75rem; color:var(--text-secondary); margin-left:16px;
}

  padding:30px 22px; color:var(--text-secondary); font-size:0.85rem;

}
.spinner {

  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.wp-not-found { padding:30px 22px; color:var(--text-secondary); font-size:0.85rem; }
@media (max-width:640px) { .word-panel { width:88vw; } }
.passages-list { display:none; }
.passages-list.show { display:block; }
.search-bar {
  display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;

.search-input {
  flex:1; min-width:200px; padding:10px 16px; border:1px solid var(--border);

}
.search-input:focus { outline:none; border-color:var(--accent); }
.archive-list { display:flex; flex-direction:column; gap:10px; }
.archive-item {
  background:var(--card-bg); border:1px solid var(--border); border-radius:8px;
  padding:18px 22px; cursor:pointer; transition:all 0.2s; box-shadow:var(--shadow);
}
.archive-item:hover { border-color:var(--accent); transform:translateY(-1px); }
.archive-item .archive-date { font-size:0.78rem; color:var(--text-secondary); margin-bottom:4px; }
.archive-item .archive-title { font-size:1rem; color:var(--text); margin-bottom:6px; }
.archive-item .archive-preview {
  font-size:0.85rem; color:var(--text-secondary); overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;

.archive-item .archive-tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.archive-tag {
  font-size:0.72rem; background:var(--tag-bg); color:var(--tag-text);

}
.archive-item .archive-source { font-size:0.78rem; color:var(--accent); margin-top:6px; font-style:italic; }
.modal-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);
  z-index:999; display:none; justify-content:center; align-items:center; padding:20px;
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--card-bg); border-radius:14px; max-width:800px; width:100%;
  max-height:85vh; overflow-y:auto; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.3);
  position:relative;
}
.modal-close {
  position:absolute; top:14px; right:18px; background:none; border:none;
  font-size:1.4rem; cursor:pointer; color:var(--text-secondary); line-height:1;
}
.modal-close:hover { color:var(--text); }
.no-results { text-align:center; padding:40px; color:var(--text-secondary); font-size:0.9rem; }
.reading-stats { font-size:0.78rem; color:var(--text-secondary); }
.loading-indicator { text-align:center; padding:60px; color:var(--text-secondary); }
.spinner {
  display:inline-block; width:24px; height:24px; border:3px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
.loading-dot { animation:pulse 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2) { animation-delay:0.2s; }
.loading-dot:nth-child(3) { animation-delay:0.4s; }
@media (max-width:640px) {
  .container { padding:10px 14px 40px; }
  .passage-card { padding:22px 16px; }
  .english-text { font-size:1rem; }
  .header h1 { font-size:1.1rem; }
  .tab { padding:8px 14px; font-size:0.82rem; }
}
</style>
</head>

<div class="timeline" id="timeline"></div>
<div class="timeline-article-card" id="timelineCard">
  <div class="card-inner">
    <div class="card-title" id="cardTitle"></div>
    <div class="card-meta" id="cardMeta"></div>
    <div class="card-tags" id="cardTags"></div>
  </div>
</div>

<div class="container">

  <header class="header">
    <h1>Daily Reading</h1>
    <div class="header-actions">
      <span style="font-size:0.72rem;color:var(--text-secondary);display:flex;align-items:center;" id="dbStatus">
        <span class="status-dot offline"></span>Loading
      </span>
      <button class="header-btn" onclick="toggleTheme()" id="themeBtn">Dark</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="today" onclick="switchTab('today')">Today</button>
    <button class="tab" data-tab="archive" onclick="switchTab('archive')">Archive</button>
  </nav>

  <section id="todaySection">
    <div class="daily-header">
      <span class="date-badge" id="dateBadge"></span>
      <span class="reading-stats" id="readingStats"></span>
    </div>
    <div id="todayPassage"></div>
  </section>

  <section id="archiveSection" class="passages-list">
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search by title, keyword, author, date..." oninput="debounceSearch()">
      <button class="header-btn" onclick="document.getElementById('searchInput').value=''; renderArchive();">Clear</button>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </section>

</div>

<aside class="word-panel" id="wordPanel">
  <div id="wpContent"></div>
</aside>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModalDirect()">&times;</button>
    <div id="modalInner"></div>
  </div>
</div>

es.  The shopping experience was meant to be both leisurely and luxurious, reserved mostly for wealthier customers.  Okumura Masanobu, Large Perspective View of the Interior of Echigoya in Surugach (Surugach Echigoya Gofukuten - ukie), c.  1745.  Woodblock print.  Source: Photograph © 2026 Museum of Fine Arts, Boston.  Other stores served different kinds of customers.  Takashimaya, established in Kyoto in 1831, served members of the imperial family; Matsuzakaya, founded in Nagoya in 1611, dominated the market for religious robes for Buddhist temples and Shinto shrines; and Tokyo's Shirokiya predominantly took commissions from feudal lords ( daimyo ) as far back as 1662.",

    id: 28, title: "In the Studio with Chad Fore, the Writer Behind \"Lil Spooky\"", created_at: "2026-08-19T22:55:36.939086+00:00",
    en: "Photograph by Kathleen McNamara.  In the time between his first submission to the Review, in February of last year, and the publication of his short story \" Lil Spooky \" in our new Summer issue , the writer Chad Fore and I exchanged almost a hundred emails.  I also read several of his stories, which tend to be somewhat autobiographical, at least in the sense that they often take place in one of Fore's two neighboring hometowns---Piru and Fillmore, in Southern California---and are rich with the kinds of details and characters that feel impossible to invent.  \"Lil Spooky\" follows its high-school-age protagonist, Brad Camacho, through his gradual---then all too fast---initiation into a local gang.  In a humiliation ritual disguised as a tryout, he has to freestyle for members of the gang's hip-hop arm, also known as the Sick Minded Clique, which records posse cuts in a \"decrepit old shack\" they call the studio, at the end of one of their driveways.  Knowing what I did about Fore's fiction, I wasn't entirely surprised when, alongside the first draft of this story, he included the link to a song he was featured on when he himself was in high school.  He and I talked about the musical influences of his characters and of his own past over lunch this spring, when, after all those messages, we were finally able to meet in person.  I found he has an encyclopedic memory for rap verses, some by artists we both love, and others that he's been writing in his head, he said, for twenty years.  INTERVIEWER While we were editing \"Lil Spooky,\" you told me it was partly inspired by time you spent with your older cousin's rap group in the nineties and early aughts.  What drew you to that specific experience as a subject and how did you approach writing about it after so many years?  CHAD FORE From the start I had in mind the type of story I wanted to write.  When I think of friends from my hometown or family members who got involved in gangs or drugs or whatever---there were always opportunities before it got bad, where they could still get out of it.  But then something happens, and they can't anymore.  I wanted the story to end at that moment where, without having been told anything, the reader would know that Brad's in a different place, and now it is too late.  There was one sentence that I almost cut.  I went back and forth.",
    source: "Owen Park, \"In the Studio with Chad Fore, the Writer Behind \"Lil Spooky\",\" The Paris Review, 2026. https://www.theparisreview.org/blog/2026/08/14/chad-fore-on-lil-spooky/",

    id: 27, title: "James Joyces's Baby Impressions and Other \"Awkward Pleasures\" of Literary Biography", created_at: "2026-08-19T15:21:21.879599+00:00",
    en: "In the Lake District, 1994.  Each week, The Paris Review unlocks stories, poems, and interviews for our readers from our archive.  This week, we've unlocked our interview with Hermione Lee, selected from the archive by Daisy Hildyard, whose story \" Two Lives \" appears in our recent Summer issue.  Sign up for the Redux newsletter to receive these pieces to your inbox every Sunday morning.  Everybody dabbles in biography.  If you have ever spoken at a funeral, rewritten your CV, or gossiped, you've had to deal with some of the questions that Hermione Lee discusses with Louisa Thomas in her Art of Biography interview.  What is the shape of a life?  What are the ingredients of an achievement?  What specific person and what particular circumstances produced it?  When something fails, do we have to find somebody to blame?  Lee addresses these questions as matters of technique: the work of finding, or inventing, \"a structure that is sympathetic to the subject. \" There is a kind of mise en abyme at play in her work, and in this interview about the life of somebody who writes the lives of those who captured something of life in their writing.  Literary biography is an awkward pleasure.  I like its strange textures and surprises.  You catch James Joyce doing his impressions of a baby, or spend the summer with Tolstoy when he is on one of his horse yogurt diets.  I believed I had a fair understanding of W.  G.  Sebald until I read his biography and saw the black-and-white snapshot of him as a young man standing thigh-deep in a river, topless in wet jeans with a deep tan, defined muscles, and a dagger in his hand.  I also enjoy the genre for its practical insights.  It's useful to know how other writers chased their invoices, or when their children napped.  Lee's biographies are exceptional for their integration of original research with illuminating interpretations of the authors' works, and they last.  I've read and reread her Penelope Fitzgerald and Virginia Woolf ; I've used the footnotes and followed her sources.  I still have my mother's twenty-nine-year-old Virago Press paperback Willa Cather .  I can't think of another writer, biographer or otherwise, who reads as closely as Lee, or with the same balance and imagination.  In their searching conversation, I was particularly interested in what Lee and Thomas have to say about the undisclosed elements of a life, including Lee's own (she is reticent).  They discuss lies and secrets.",
    source: "Daisy Hildyard, \"James Joyces's Baby Impressions and Other \"Awkward Pleasures\" of Literary Biography,\" The Paris Review, 2026. https://www.theparisreview.org/blog/2026/08/17/james-joycess-baby-impressions-and-other-awkward-pleasures-of-literary-biography/",

    id: 26, title: "The Catalogue of Lost Things", created_at: "2026-08-18T22:55:41.67129+00:00",
    en: "Every month, our desks at the Review pile up with dozens of soon-to-be published books, only some of which involve writers we have heard of, or subjects we know anything about.  More often, we wind up with a mix somewhere between that of a cabinet of curiosities and a Little Free Library stocked by an indecisive grad student; this summer, for example, alongside many debut novels and NYRB reissues, we found an Italian chapbook of cat-themed poems from the eighties and a semiepistolary critique of psychiatry whose letters are addressed \"Dear Neoliberalism. \" While combing through these galleys for good ideas or good writing, I sometimes save passages I like.  Here are a few I found in July and August.  ---Tarpley Hitt, online editor In our Spring 2024 issue, we published a story by Joanna Kavenna called \" The Beautiful Salmon ,\" about a philosophy student who goes to a dinner party at the house of a \"brilliant and terrifying\" professor, who has cooked a beautiful salmon.  A version of that story appears in Seven: or, How to Play a Game Without Rules (Faber & Faber), Kavenna's sly and dextrous new novel about the same student and the same professor, who specializes in something called \"Box Philosophy,\" short for \"Thinking outside the Box about Thinking outside the Box. \" At one point, the professor sends the student to Greece to track down a \"poet-dentist\" named Apostolakis, who is \"tangentially linked to Box Philosophy,\" but has lately been working on a book he's calling the Fanouropiton, or the Catalogue of Lost Things: The book was divided into short entries, like an encyclopaedia.  Things Lost by War.  Things Lost by Human Folly.  Things Lost Because No One Really Cared About Them.  And, Things Lost Because Too Many People Cared About Them ---a category full of betrayals and thefts.  One entry in Things You'd Assume Were Too Big to Get Lost described an entire galaxy that shone approximately 2. 5 million times brighter than the sun, but when various distinguished astronomers gathered to examine it further, they found it had disappeared.  No one knew why---they would have needed to find it again to answer the question of why it had vanished.  In an email I received about a new book by the author A.  Igoni Barrett, his agent succinctly summed up Blackass , Barrett's debut novel from 2016, as follows: \"A young man named Furo Wariboko woke up one morning in Lagos to find that he had transformed into a white man.",
    source: "Tarpley Hitt, \"The Catalogue of Lost Things,\" The Paris Review, 2026. https://www.theparisreview.org/blog/2026/08/18/the-catalogue-of-lost-things/",
    tags: ["literary","the-paris-review","literature","education","theparisreview"], difficulty: "advanced", word_count: 419

    id: 25, title: "Can Architecture Ever Save Us From Sickness?", created_at: "2026-08-18T15:17:30.907162+00:00",
    en: "Design has long promised to protect us from disease.  But its cures have a way of becoming new sources of harm.  Patients take the fresh-air cure on the upper sun terrace of Alvar Aalto's Paimio Sanatorium, overlooking the forests of Finland, ca.  1933.  The sanatorium opened in 1932.  Photograph by Gustaf Welin, © Alvar Aalto Museum.  A grid of empty white beds sits together in dark, cavernous spaces.  Vast halls, centers, stadia, armories, and urban parks have been turned into field hospitals for thousands of the sick.  These were the chilling scenes we saw all over the world during the early days of the COVID-19 crisis, from Belgrade to São Paulo and Mexico City to New York.  And it was the same scenes we saw a century earlier, during a flu epidemic that, by some estimates, killed more people than the two world wars combined.  Beatriz Colomina is a coeditor of \" Sick Architecture ,\" from which this article is adapted.  In health emergencies such as pandemics, we suddenly find that all buildings are medicalized: Large spaces become hospitals.  Houses become quarantines.  Every detail and use of every building is scrutinized in terms of sickness --- and its prevention.  Yet the needs of emergencies also eventually become inscribed into the everyday.  Indeed, every architectural period has been shaped by a history of medical fears, misunderstandings, prejudices, inequities, and innovations.  It could even be argued that the beginning of architecture is the beginning of disease itself.  As the physician Benjamin Ward Richardson put it when introducing \"Our Homes and How to Make Them Healthy,\" a compendium of texts by doctors and architects published for the 1884 International Health Exhibition in London: \"Man, in constructing protection from exposure has constructed the conditions for disease. \" In other words, all architecture is suspended between resisting and producing disease.  In ancient Rome, there was Vitruvius, who, in the first century BCE, established Western architectural theory by insisting that all architects study medicine: \"Healthfulness being their chief object. \" Indeed, a large part of his \"Ten Books on Architecture\" is devoted to the question of health.  Vitruvius gives detailed instructions on how to determine the suitability of a proposed site for a city by returning to the ancient method of sacrificing a native animal and inspecting its liver to ensure it is \"sound and firm. \" Likewise, for the health of individual buildings, the text applies the theory of the four humors, the dominant medical paradigm of the time, to organize building orientation and ventilation.",
    source: "Beatriz Colomina, \"Can Architecture Ever Save Us From Sickness?,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/can-architecture-ever-save-us-from-sickness/",
    tags: ["academic","the-mit-press-reader","architecture","art","society","space"], difficulty: "advanced", word_count: 420
  },

    id: 24, title: "Xia Jia: The AI Story Is Not Done", created_at: "2026-08-17T22:54:41.819468+00:00",
    en: "On writing, rupture, and the limits of human and artificial intelligence in a broken world.  MIT Press Reader/Source image: Adobe Stock Again a week past deadline.  Your editor has sent another email.  The opening is polite and considerate like last time, but you sense the emotion concealed in those words.  From the fingertips on your smartphone to the hollow of your back, a swell of confusion, anxiety, blame and fury...  You don't dare scroll down.  At hand, you have only a few fragments: jotted lines, bookmarked articles, an outline you don't remember starting, scraps from other stories.  Yet all the ideas for the AI story are here.  Artificial intelligence...  You could portray it as some unnatural form of thought or perhaps a performative subject.  It could converse, write poetry, play chess, compose music, drive, play games, write reports, diagnose diseases, launch missiles, care for the elderly, tell stories to children.  The AI could be successfully disguised as human.  Or its disguise could be seen through.  Or it could be unmasked but everyone still treats it as human.  Perhaps the AI is kind to humans.  Perhaps cruel.  Perhaps perfectly indifferent.  It becomes a lover, a pet, a slave, a master, a devil, a prophet, a god, a Cthulhu, a Leviathan, a benefactor...  This story is excerpted from the volume \" Machine Decision Is Not Final \" (Urbanomic Press) The possibilities are all here.  But there is no story you can write.  You wrote a good AI story once.  It was about the imitation game and depression.  Alan Turing was one of your story's protagonists.  In the last years of his life, he wrote a conversation program he called Christopher.  He communicated with it through a typewriter, sharing with it those knots in his heart he could not untie.  He told it \"I love you,\" and taught it to say \"I love you too. \" But did Christopher pass the Turing Test?  You wrote another about near-future AI therapy, about people with troubled lives who, only half-believing, bet everything on a dice roll.  In desperation, they seek help in the form of a virtual image, an algorithm synthesizing language and conversation --- confiding, listening, confiding, confiding, confiding.  Writing that one, you were in bad shape.  But it is precisely that torment of language that gives you no other choice than to write.  You played the part of the patient and the part of the AI psychologist.  A question.  An answer.  Then an answer and a question.  Writing healed you.",
    source: "Xia Jia, \"Xia Jia: The AI Story Is Not Done,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/xia-jia-the-ai-story-is-not-done/",
    tags: ["academic","the-mit-press-reader","history","art","psychology","themitpressreader"], difficulty: "advanced", word_count: 417
  },

    id: 23, title: "I Know the Cost of Indecision in Abortion Care. Dobbs Made It Worse.", created_at: "2026-08-17T14:58:00.721549+00:00",
    en: "Maternal-fetal medicine doctors should not be forced to choose between saving patients' lives and protecting themselves from criminal jeopardy.  Source: Adobe In June 2022, when the Supreme Court overturned Roe v.  Wade , eliminating America's constitutional right to an abortion, there was no question that patients would eventually die as a result of the ruling.  Less clear was who, where, and under what circumstances.  A pregnant person with cancer?  Someone facing severe preeclampsia or hemorrhaging after an abruption?  In the end, the first true death dealt by the impact of Dobbs still is --- and may remain --- unknown.  David N.  Hackney is the author of \" Impossible Choices ,\" from which this article is adapted.  Yet the tragic consequences of the ruling have been no mystery.  In September 2024, ProPublica reported the death of Amber Thurman, a 28-year-old Georgia woman who presented with a uterine infection requiring a dilation and curettage (D&C) procedure, which is often used to treat abnormal bleeding following a miscarriage.  She was a single mother recently enrolled in nursing school who was seeking an abortion after an unintended pregnancy.  Because the procedure was already illegal in Georgia, she drove to North Carolina instead, waking up at 4 a. m.  for the long trip.  Due to traffic, she arrived at the clinic a mere 15 minutes late and was thus denied the procedure.  She was provided with medication abortion instead, the process to be completed back in Georgia.  Complications such as incomplete tissue passage and uterine infections are uncommon after medication abortion.  When they do occur, they are almost always resolved safely --- often through a D&C procedure --- given that the patient can legally access care.  Amber Thurman, however, never accessed the care she needed.  She later presented to the Piedmont Henry Hospital Emergency Department in the suburbs outside of Atlanta with bleeding.  Fetal tissue had remained in her uterus, causing an infection.  Thurman needed a D&C procedure, but instead sat in a waiting room for 20 hours.  When doctors eventually performed a D&C, her heart stopped during surgery.  In many ways, Thurman's horrific story parallels that of Porsha Ngumezi , another patient who bled to death under similar circumstances in Houston.  Both were in early pregnancy; both required a D&C to save their life; both sat in emergency departments instead, deteriorating until they ultimately descended far into critical illness.  And, of course, both should also be alive with their children today.  Why did they not receive a D&C?",
    source: "David Hackney, \"I Know the Cost of Indecision in Abortion Care. Dobbs Made It Worse.,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/i-know-the-cost-of-indecision-in-abortion-care-dobbs-made-it-worse/",
    tags: ["academic","the-mit-press-reader","medicine","themitpressreader"], difficulty: "advanced", word_count: 414
  },

    id: 22, title: "The Enslaved South Carolinians Who Rowed to Freedom", created_at: "2026-08-16T22:49:08.094455+00:00",
    en: "Along the Lowcountry's Inner Passage, they steered south by starlight as slave catchers pursued them toward Spanish Florida.  This Juneteenth, their names should not be forgotten.  Rice Canal, Colleton County.  A historic canal brought fresh water from the Combahee River to inland rice fields at a former plantation on the Inner Passage waterway.  Credit: Virginia McGee Richards.  The Inner Passage is a little-known waterway in the South Carolina Lowcountry that snakes through hundreds of miles of marshland.  Built by enslaved laborers during the colonial and antebellum South, its hand-dug canals were used to carry goods across the region.  But they also served another, more clandestine purpose: as routes to self-emancipation.  Virginia \"Ginna\" McGee Richards is the author of \" The Inner Passage . \" One of the earliest documented escapes occurred in 1687, when 11 enslaved people living in South Carolina fled southward by canoe to freedom in Spanish Florida.  The refugees included a family: Mingo, his wife, and their three-year-old daughter.  They traveled with an unnamed Black woman and seven other Black men: Cambo, Conano, Dique, Grand Domingo, Jacque, Jesse, and Robi.  Upon reaching St.  Augustine, they became subjects of the Spanish crown and began working as paid ironsmiths, laborers, and domestic workers.  News of the promise of freedom for those reaching Spanish Florida traveled quickly in the Carolina colony.  By the mid-1700s, dozens of enslaved people were leaving in boats each week and heading southward.  Not all were bound for St.  Augustine.  Some steered their canoes to maroon communities of Africans hidden deep in the swamps of South Carolina, Georgia, and Florida, while others found refuge with Indigenous communities along the coast.  For those freedom-seekers who did make it to Spanish Florida, evidence of their journeys survives in church records of baptisms, births, and marriages, as well as in British and Spanish colonial accounts and reports.  One such account dates to the night of April 17, 1748, when two men enslaved in the Carolina colony, Monvigo and Gomo, decided to self-emancipate.  They took a few provisions they had hidden for the journey and headed toward the river.  After climbing into a canoe, the two men pushed off and began rowing southward with the strong coastal tide.  Monvigo and Gomo were survivors.  They had been kidnapped from their home country, Angola, and shipped in the hull of a slave ship on the Middle Passage to Charleston.",
    source: "Virginia McGee Richards, \"The Enslaved South Carolinians Who Rowed to Freedom,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/the-enslaved-south-carolinians-who-rowed-to-freedom/",

    id: 21, title: "Squid Theater", created_at: "2026-08-16T14:53:39.349922+00:00",
    en: "Elusive and endlessly reimagined, the squid refuses to be pinned down across centuries of myth and science.  Source: Adobe Stock Man gazes at squid, and squid gazes back.  Between the two lies the window of the Nautilus submarine, separating the environments of water and air, and also acting as a kind of mirror, throwing into relief the similarity between the two beings.  The man, the harpooner Ned Land, has his arms calmly folded, but the squid will win any contest involving arms.  A large book, presumably some kind of work of natural history, lies open on the windowsill, perhaps as an aid to identification.  But the book shows only the creatures of natural history, whereas the squid, it turns out, has many other roles.  William Firebrace is the author of \" Memo for Nemo ,\" from which this article is adapted.  This squid--human confrontation, shown in a woodcut in the first French edition of \"Twenty Thousand Leagues Under the Sea,\" is the definitive encounter in the novel, the representatives of the sea and of the land meeting on roughly equal terms.  The man can clearly see the squid and assumes, perhaps wrongly, that he can identify the creature.  But what does the squid see with its great eyes, adapted to distinguish the faintest light in the darkness?  Some kind of inert alien object arriving unexpectedly in its environment?  Unusual creatures, predators or prey?  A vague glow?  A circle of light?  Perhaps the squid's system of perception is so very different from ours that words like seeing and understanding have little meaning.  The squid's cousin, the octopus, can see with its skin, which contains light-sensitive chromatophores similar to those found in its eyes.  The squid's skin may also be light-sensitive, its entire method of seeing very different from a creature of the land.  We don't know what its diffused gaze conveys, and can only wonder if it is something like our own.  The creature in the woodcut is, in fact, more octopus than squid, with eight rather than 10 tentacles and an octopus-like head.  The two species come under the class cephalopod (from the Greek, head-foot), an octopus basically being a bag-like head with a ring of arms, while a squid is spindle-shaped, with arms at one end and tail at the other.  For the purposes of this narrative, they are considered variants on a theme, even if such a rash sifting together is alien to marine biologists.",
    source: "William Firebrace, \"Squid Theater,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/squid-theater/",
    tags: ["academic","the-mit-press-reader","science","themitpressreader"], difficulty: "advanced", word_count: 407
  },

    id: 20, title: "What Split-Brain Patients Reveal About Consciousness", created_at: "2026-08-15T22:51:07.188828+00:00",
    en: "Their lives and symptoms offer a rare window into how the brain binds experience into a single mind.  Credit: Pyramis, Flickr The brain, like the rest of the body, has a remarkable degree of bilateral symmetry.  It is helpful to think of it as an enlarged walnut.  One side is not the exact mirror image of the other, but approximately so.  Almost every brain structure has two copies, one on the left and one on the right.  The left side of the visual field is represented by the visual cortex in the right hemisphere, whereas the right side is mapped onto the left visual cortex.  Yet when you look out at the world, you don't see a fine vertical line running down your field of view; the two hemifields are integrated seamlessly.  Philosophers emphasize that experience is unitary.  That is, you don't experience two streams of consciousness, one for each side, but only one.  And what is true for vision applies with equal force to touch, to hearing, and so on.  Christof Koch is the author of \" Consciousness ,\" from which this article is adapted.  When I mention Descartes' identification of the pineal gland in class, some students snicker, \"How silly. \" In fact, Descartes was centuries ahead of his time in his search for a relationship between structure and function.  He's a breath of fresh air --- of modernity and enlightenment --- in the dusty, moth-eaten atmosphere of the closing years of Medieval scholasticism.  Descartes replaced worn-out Aristotelian teleonomic, final causes that really don't explain anything --- for example, wood burns because it possesses an inherent form that seeks to burn --- with mechanistic ones.  The discordance between the two halves of the brain and the one mind was first pointed out by René Descartes, who, in the 17th century, sought a single organ that would reflect the unitary nature of experience.  He erroneously assumed that the pineal gland has no left and right halves and famously hypothesized that it was the seat of the soul (or, in modern terms, the neural correlate of consciousness).  But for all of Descartes's insights, he failed to recognize that it is the corpus callosum , the largest white matter structure in the brain, that is primarily responsible for the integration between its two hemispheres.  It is a thick bundle, a bit like a ribbon cable, of about 200 million axons, each extending from a pyramidal cell on one side of the brain to the other side.",
    source: "Christof Koch, \"What Split-Brain Patients Reveal About Consciousness,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/what-split-brain-patients-reveal-about-consciousness/",
    tags: ["academic","the-mit-press-reader","history","art","psychology","themitpressreader"], difficulty: "advanced", word_count: 415
  },
  {
    id: 19, title: "The Future of Family Planning Is Here. Is the Constitution Ready?", created_at: "2026-08-15T14:53:31.761363+00:00",
    en: "Surrogacy, embryo disputes, and synthetic gametes raise profound, unanswered questions about liberty and equality.  MIT Press Reader/Source images: Adobe Stock We are on the cusp of some revolutionary new reproductive technologies, and yet the Supreme Court has been silent on how to think about what the federal Constitution might have to say about the last wave of technologies dating back to the early 1980s .  I.  Glenn Cohen is a contributor to \" America Unfinished ,\" from which this article is adapted.  Questions about the propriety of destroying embryos, whether women can lawfully agree to sell their reproductive labor as surrogates, gene editing, radically new forms of family formation, as well as questions of dignity, access, and equality, cut to the quick of what kind of country we are.  To the extent that we view the federal Constitution as the ultimate repository of those values, the current silence on what the Constitution means feels deafening.  So, why the silence?  Is it good or bad?  What would a bold constitutionalizing project look like for this space?  Consider in vitro gametogenesis (IVG) --- in which one can take skin or other somatic cells, derive induced pluripotent stem cells, and direct them to become sperm or eggs that could be used for reproduction --- as one of the cutting-edge reproductive technologies we may soon see.  Indeed, the technology can likely enable cross-sex gametes --- sperm from women and eggs from men --- enabling both partners of same-sex couples to be equal genetic contributors to reproducing, or potentially for a single individual to contribute sperm and egg to the same child.  IVG has been successfully used in animal models, albeit with significant rates of failure and embryo destruction.  Even if we are at some point ready for use in humans in the U. S. , that would not be lawful under current law, in part because of an appropriations rider that prohibits the FDA from considering an application to use it.  Or, consider mitochondrial replacement techniques (MRT), currently authorized for limited use in the U. K.  but, by dint of the same appropriations rider, prohibited in the U. S.  In lay terms, it involves combining one woman's nuclear DNA with another's mitochondrial DNA and insemination with male sperm, with a goal of avoiding transmitting mitochondrial diseases while retaining genetic relations.  What does the federal Constitution say about the permissible use of these reproductive technologies?",
    source: "I. Glenn Cohen, \"The Future of Family Planning Is Here. Is the Constitution Ready?,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/the-future-of-family-planning-is-here-is-the-constitution-ready/",
    tags: ["academic","the-mit-press-reader","history","art","themitpressreader"], difficulty: "advanced", word_count: 400
  },

    id: 18, title: "American Progress Was an Optical Illusion", created_at: "2026-08-14T22:54:01.235637+00:00",
    en: "The turn-of-the-century energy transition dazzled the nation --- while concealing segregation, extraction, and ruin.  \"America Today\" (1930--31) by Thomas Hart Benton.  Courtsey of the Courtesy of The Metropolitan Museum of Art in New York, New York .  The kaleidoscope was invented in 1816 by a Scottish scientist, Sir David Brewster.  Looking through his invention, Brewster saw, at the end of the tube, shards of colored glass reflected in mirrors to create symmetrical patterns that changed as the tube was rotated, producing endless transformations.  He soon realized that, viewed through the tube, anything could become kaleidoscopic: \"The furniture of a room, books and papers lying on a table, pictures on the wall, a blazing fire, the moving branches and foliage of trees and shrubs, bunches of flowers, horses and cattle in a park, carriages in motion, the currents of a river, waterfalls, moving insects, the sun shining through clouds or trees. \" David E.  Nye is the author of \" The Great Energy Transition.  \" When Brewster's device reached the market, the public was captivated.  It seemed to magically transmute the physical world into a cascade of patterns for private viewing.  But its influence eventually became figurative, too: The kaleidoscope offered a new way of seeing --- one that could be extended to cultures, societies, and even nations as a whole.  And by the following century, the kaleidoscopic lens had turned toward an America in great flux.  Between 1876 and 1929, Americans experienced an unprecedented increase in energy.  The census found that adopting oil, gas, and electricity increased agricultural power by 800 percent and industrial power by 600 percent.  The urban population mushroomed from 10 to 69 million, and factory productivity increased almost 200 percent.  By 1929, every job was far different from what it had been in 1876, whether it be plowing, mining, forging steel, making cement, constructing an office building, assembling a product, or running a company.  During the transition, Americans witnessed remarkable feats of engineering.  There were suddenly skyscrapers, hydroelectric dams, irrigation systems, department stores, and suburbs; this was, after all, the era of the Chrysler Building, the Model T, and the Golden Gate Bridge.  Meanwhile, technologies like the telephone, radio, and film accelerated mass communication.  Yet at the time, Americans did not understand that they were living through the largest energy transition in human history.  Instead, they perceived a series of disconnected events.  Unable to discern or conceptualize an underlying cause, they often declared the transformations around them were \"kaleidoscopic.",
    source: "David E. Nye, \"American Progress Was an Optical Illusion,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/american-progress-was-an-optical-illusion/",
    tags: ["academic","the-mit-press-reader","history","art","themitpressreader"], difficulty: "advanced", word_count: 413
  },

    id: 17, title: "What Is 'De-Extinction' Really For?", created_at: "2026-08-14T16:36:29.3911+00:00",
    en: "Efforts to revive the thylacine and woolly mammoth are forcing conservationists to face a long-overdue debate over what kind of natural world we want to build.  MIT Press Reader/Source images: Adobe Stock Tasmanian tigers, otherwise known as thylacines, have been extinct since 1936.  The species --- which looks like a strange mix of a dog, zebra, and a kangaroo --- was hunted to extinction, largely because European settlers blamed them for attacks on sheep, poultry, and other livestock.  Taylor Dotso n is the author of \" Conservation by the People ,\" from which this article is adapted.  But before the thylacine was fully eradicated, 13 pups of the marsupial species were preserved in alcohol.  Scattered across museum and university collections, they now sit in a milky liquid, their beige skin wrinkled, every one of them looking its hundred years.  Yet this may not be the end of the thylacine.  In fact, it may be a new beginning.  Of the 13 preserved thylacine specimens, one joey has yielded enough genetic material to map the animal's genome.  With that map in hand, a team of scientists and entrepreneurs now hopes to bring something like the thylacine back to life through a \"Jurassic Park\"-style revival process known as \"de-extinction. \" The idea is that by genetically engineering a functional equivalent of the thylacine, scientists could potentially restore its lost ecological role and, in turn, help repair damaged ecosystems.  Today, this effort is being spearheaded by University of Melbourne geneticist Andrew Pask, who has teamed up with Colossal, the start-up cofounded by billionaire entrepreneur Ben Lamm and Harvard geneticist George Church.  As it so happens, Church is simultaneously on a quest to resurrect the woolly mammoth, for which he's raised more than $400 million.  However, there's reason to believe the thylacine could come back sooner: Marsupials are very attractive candidates for de-extinction.  For one thing, their offspring only spend weeks in the womb.  The brevity of pregnancy makes it easier to use a variety of animals, such as the rat-like dunnart, as surrogate mothers for cloned Tasmanian tigers.  Moreover, it means that the replication process can be iterated and, ideally, perfected relatively rapidly.  For a mammoth, a successful pregnancy in an elephant surrogate would drag on for almost two years.  Practicalities aside, there's also the question of \"Should we? \" Even though the thylacine was ultimately eradicated by humans, they had their own problems.",
    source: "Taylor Dotson, \"What Is 'De-Extinction' Really For?,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/what-is-de-extinction-really-for/",
    tags: ["academic","the-mit-press-reader","essay","themitpressreader"], difficulty: "advanced", word_count: 400

    id: 16, title: "Can the Classroom Ever Be Automated?", created_at: "2026-08-14T07:16:15.866657+00:00",
    en: "Long before AI, teaching machines promised to make education more efficient.  Their forgotten history reveals why that dream keeps falling short.  Children use counting frames in a classroom, 1930.  Source: Nationaal Archief / Spaarnestad Photo When entrepreneurs talk about innovation in education, their ideas tend to orbit around two seductive promises: automation and personalization.  They claim that new technologies --- such as tablets, adaptive learning, and classroom management software --- will relieve teachers of administrative drudgery while allowing students to learn independently.  But as Audrey Watters argues, this vision of the automated, individualized classroom is not new at all; in fact, it is an age-old fantasy, repackaged again and again for successive generations.  Audrey Watter s is the author of \" Teaching Machines.  \" In her book \" Teaching Machines ,\" Watters chronicles the little-known history of the 20th-century classroom devices that gave the book its title : machines designed to automate instruction, deliver instant feedback, and let students move through lessons on their own.  The earliest version was developed in 1924 by psychologist Sidney L.  Pressey, whose \"Automatic Teacher\" presented students with multiple-choice questions and recorded their answers.  The promise of Pressey's device, however, was derailed by the Great Depression.  Three decades later, the famed psychologist B.  F.  Skinner developed a teaching machine of his own, shaped by his controversial theories of behaviorism --- the idea that human learning can be molded through external repetition and reinforcement.  But in the end, Skinner's invention failed to survive the machinery of corporate bureaucracy and a broader culture wary of mechanizing the classroom.  For Watters, the rise and fall of the teaching machine was not just a curious chapter of educational history; it was an early expression of a dream that still shapes the classroom today.  In the interview below, edited for length and clarity, the author unpacks how Skinnerian logic still lingers in today's classrooms and what it means to resist an AI-dominated future that tech companies insist is inevitable.  \"Educators want students to understand what it means to have agency over their own learning.  We want them to develop curiosity,\" she says.  \"To say that the future is already written is antithetical to that. \" I want to start with the beginning of the book, where you critique Sal Khan's video on the history of education , in which he claims that the American school system has been technologically static since the late 1800s.  In your book, you call his version of history \"woefully inadequate --- offensively so.",
    source: "The Editors, \"Can the Classroom Ever Be Automated?,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/can-the-classroom-ever-be-automated/",
    tags: ["academic","the-mit-press-reader","technology","literature","history","society"], difficulty: "advanced", word_count: 418

    id: 15, title: "How Brunelleschi Changed the Way I Think About Decisions", created_at: "2026-08-14T07:14:32.067184+00:00",
    en: "In trying to understand how we make better choices, I found an unlikely guide in the Renaissance architect's experiments with linear perspective.  Source image: Galleria Academia Firenze This article is part of our Footnotes series , in which authors reflect on a person, study, or curiosity --- whether obscure, well-known, recent, or historical --- that sparked or challenged their thinking, or never quite made it into their work.  I don't remember exactly when I first learned about Filippo Brunelleschi, but I know I wrote his name in dry-erase marker on the plastic wet wall panel that inexplicably covered the backside of my kitchen.  Brunelleschi was a true Renaissance man, remembered above all as a master architect.  But it was his pig-headed, ingenious endeavor to solve one of art's great mysteries that fascinated me.  His objective was so simple that it is almost baffling no one had managed it before the 1400s: Create the illusion of three-dimensional depth on a two-dimensional page.  Elspeth Kirkman is the author of \" Decisionscape . \" Maddeningly, the geometry required to crack the code of linear perspective had been understood for centuries before Brunelleschi came along.  So when I learned about him hitting the streets of Florence with a mirror, a canvas with a peephole in it, and his paintbrushes, I had to know: Why was something a seven-year-old can copy the basics of so hard to get right the first time?  The answer was surprisingly simple: Until the Renaissance, artists weren't trying to faithfully render the world exactly as we see it.  Their work concerned itself with other matters like religion and monarchs, and intuitive methods of suggesting depth were usually enough.  But the 1400s ushered in a new age in which rationalism was king, and with it came a desire to represent the world with a greater degree of fidelity in art.  Artists (and their patrons) now wanted to depict the visible world with greater accuracy --- suddenly, being able to accurately capture cityscapes, social interactions, and commercial scenes was considered important.  Navigating the societal shocks of the Renaissance required a kind of agility of perspective, and the appeal of being able to create and control our representation of space, distance, and depth must have been powerful.  With hindsight, my fascination with Brunelleschi came from a place of empathy.  While I can hardly compare myself to the great architect, I was also struggling with my own intellectual project: writing a book about decision-making.",
    source: "Elspeth Kirkman, \"How Brunelleschi Changed the Way I Think About Decisions,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/how-brunelleschi-changed-the-way-i-think-about-decisions/",

    id: 14, title: "How Shipping Container Disasters Became a Scientific Goldmine", created_at: "2026-08-14T07:06:22.849005+00:00",
    en: "Oceanographers have quietly used lost cargo to build the most precise maps of ocean currents ever created.  Shipping containers drift in heavy seas after being swept overboard from a container ship in the winter North Atlantic, 1980.  Credit: Wikimedia Commons .  To the casual observer, the look and feel of shipping containers suggests a world of smooth, lossless transportation, almost immaterial in its implementation of a logistical ideal.  However, the system is far from lossless.  In fact, during storms and shipwrecks, shipping containers regularly go overboard.  Alexander Klose is the author of \" The Container Principle ,\" from which this article is adapted.  Nobody knows exactly how many of these vast, 20- or 40-foot-long steel capsules --- stacked in the thousands in the cargo holds of each ship, carrying the stuff of the global economy --- are lost each year.  Shipping lines and insurance companies keep these figures under wraps.  But estimates suggest that of the hundreds of millions in circulation annually, several thousand containers vanish --- sometimes forever.  And what becomes of the containers that disappear?  If they reappear, then the matter is relatively simple.  Each standard container carries, on each of its four sides, a code clearly identifying it.  The codes for all containers worldwide are distributed by the Bureau International des Containers (BIC).  In cargo shippers' databases, the histories and current cargo of containers are recorded and accessible via their respective codes.  Thus, it can be determined what was in each container and for whom it was intended.  As long as the contents of a container have not been plundered outright, they can even be delivered to the recipient after an accident, albeit with some delay.  But it is, of course, more difficult when a container breaks open --- particularly on the high seas, leaving its freight to the whims of the wind and the waves.  In these cases, the contents are highly unlikely to ever reach their intended recipient.  Yet these mishaps are not all for naught.  In fact, while these lost shipping containers likely represent hundreds of millions of dollars in losses for the shipping industry, they have inadvertently been a boon to another community: oceanographers.  In May 1990, the Hansa Carrier , a German cargo ship traveling from Korea to the U. S. , lost 21 containers in a Pacific storm north of Japan, and four of the containers broke open.  The payload, more than 60,000 pairs of Nike sneakers, poured out into the sea.",
    source: "Alexander Klose, \"How Shipping Container Disasters Became a Scientific Goldmine,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/how-shipping-container-disasters-became-a-scientific-goldmine/",
    tags: ["academic","the-mit-press-reader","essay","themitpressreader"], difficulty: "advanced", word_count: 411

    id: 13, title: "Why Human Giants Defy the Laws of Physics", created_at: "2026-08-14T00:08:56.26857+00:00",
    en: "Without different anatomical proportions, a scaled-up body would collapse under its own weight.  Source: Adobe According to legend, giants once roamed the Earth.  In Homer's \"Odyssey,\" Odysseus encounters the Cyclops, the one-eyed son of Poseidon, living in a huge cavern, hungry and angry.  He grasps men and sheep in one hand, devouring them whole.  In the days of King Arthur, a clever young boy earned the title of \"Jack the Giant Killer,\" using his sharp wit to outsmart and slay the various \"giants\" plaguing the land.  Another Jack --- or perhaps it is the same Jack --- famously plants some magic beans and climbs the resulting beanstalk to a castle in the clouds, cleverly outwitting the giant residing there.  Joel David Hamkins is the author of \" The Book of Infinity ,\" from which this article is adapted.  All these giants of legend have a humanoid form, and they undertake generally human activities --- walking, stomping, dancing, carrying heavy loads, running, and so forth.  They act and move about in a human manner, only at a larger scale.  But if human giants did exist, could they actually survive in this form ?  In his foundational 1638 text \"Dialogues Concerning Two New Sciences,\" Galileo Galilei argues that this folklore understanding of the nature of giants is fundamentally flawed.  He contends that this idea of a massive humanlike creature is, quite simply, physically impossible.  To begin his argument, Galileo asks us to imagine a structural beam of sturdy oak.  The beam might be used to support a heavy load --- perhaps a load of bricks or a great stone.  He then asks us to imagine a much larger oak beam, scaled up in size but with the same proportions and material.  A thicker, solid oak beam, of course, will naturally support more than a slender beam of the same wood.  But how much more can it support?  Will the larger beam be able to support the same load, but also scaled up in size?  Should we expect the larger beam to support a scaled-up load of bricks or a scaled-up stone?  Galileo ingeniously argues no --- the larger beam will not support a similarly scaled-up load.  Indeed, he claims that at a certain sufficient scale, the beam will no longer support even its own weight!  His argument relies on a certain subtle observation concerning how scaling works in different dimensions.",
    source: "Joel David Hamkins, \"Why Human Giants Defy the Laws of Physics,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/why-human-giants-defy-the-laws-of-physics/",
    tags: ["academic","the-mit-press-reader","art","themitpressreader"], difficulty: "advanced", word_count: 398
  },

    id: 12, title: "A Brief History of the Internet's Favorite Scam", created_at: "2026-08-13T00:08:00.895076+00:00",
    en: "Fraudsters have long told stories of imprisoned nobles and hidden fortunes, with desperate pleas for help.  Email simply gave their messages a perfect medium.  MIT Press Reader / Source image: Adobe Stock A message arrives: a panicked plea referencing a desperate situation in an exotic location.  It might be a wealthy refugee family trying to make it out of Zimbabwe, or the widow of an aide to Saddam Hussein in a hospital in Chiang Rai, or a Russian oligarch's daughter hiding in the Czech Republic and communicating through her London solicitor.  Finn Brunton is the author of \" Spam ,\" from which this article is adapted.  They are looking for a compassionate soul --- \"whom God will use to assist me and my family\" --- who can help them get themselves and their assets --- \"US$45,000,000. 00\" --- out of this difficult moment in geography and history.  The phone and fax numbers work, and the web addresses point to real news sites --- \"You can go to google in internet and check my clients name and information\" --- and many of the government bureaus and banks check out online.  This is what's known simply as the advance-fee fraud, or the 419 scam.  It is so unmistakable that it embodies its own parodic genre, casually appearing as a gag in television comedies like \"30 Rock\" and \"The Office. \" It always starts with the same canonical line, trotted out in conversation over the phone, or perhaps over email: \"Hello!  I am a Nigerian prince. \" It is easy to see 419 merely as a tired cliché --- and to mistake that familiarity for understanding.  But doing so often leads to facile assumptions about the risks, motives, and imagined rewards on both sides of the exchange.  To see the scam clearly, we need to treat it not simply as spam, but as a cultural myth, or even a motif.  These scams are not ads for products --- for porn or mortgages or relief for masculine anxiety.  They are part of an enormous web of narratives, running back centuries, about corruption, politics, and the failures of globalization, from which you, the reader, can allegedly profit.  Advance-fee fraud dates back to at least the 19th century, with the emergence of the Spanish Prisoner confidence trick.  It goes like this: There is a beautiful, rich woman incarcerated by the cruel King of Spain for complex political reasons.  You have been contacted because you could help her escape.",
    source: "Finn Brunton, \"A Brief History of the Internet's Favorite Scam,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/a-brief-history-of-the-internets-favorite-scam/",
    tags: ["academic","the-mit-press-reader","history","themitpressreader"], difficulty: "advanced", word_count: 412
  },

    id: 11, title: "The False Promise of the First 'Smart' Homes", created_at: "2026-08-12T02:55:13.037684+00:00",
    en: "Computerized rooms, telework stations, and child-soothing technologies sold a seductive illusion that automation could solve the problems of maternal care.  The Xanadu home in Kissimmee, Florida, built in 1979 and demolished in 2005.  Courtesy of Wikipedia .  \"Imagine a house with a brain --- a house you can talk to, a house where every room adjusts automatically to match your changing moods.  Imagine a house that is not just a backdrop but an active partner in your work, your family life, and your leisure activities.  In short, imagine a house that is also your friend. \" This is Xanadu, the Computerized Home of Tomorrow, which opened its doors in 1983 in Florida, strategically located just a few miles from Disney World's Epcot Center.  Xanadu's Yale-trained architect, Roy Mason, wanted to create a walk-through instruction manual for building a smart home.  Mason saw this blurring of architecture and sociality as the answer to the many problems of the American family: loneliness, boredom, frustration, parent-child conflict, and general depression.  The result proposed automation as remedy and liberation.  Hannah Zeavin is the author of \" Mother Media ,\" from which this article is adapted.  Much like the techno-pessimistic nightmare imagined by Ray Bradbury's short story \"The Veldt,\" in which housekeeping and child-rearing are ceded to automated homes, Xanadu's \"electric hearth\" was run by a \"House Brain\" to control life support functions.  (The House Brain is, in a way, another term for mother. ) Staffed by a robot dubbed Robutler that remediated paid servant labor, the house aimed to take over a wide variety of tasks --- but only as the owners wished.  The Brain, meanwhile, was a personal assistant, presaging the integration of Alexa and Siri into smart home systems.  It was designed to provide customizability in managing various aspects of middle-class life.  It could call local plumbers and neighbors, offer telemedicine, menu planning, and even outfit selection via an automated clothes-retrieval closet.  Xanadu was not the first of its kind.  In 1957, Disney unveiled the House of the Future in collaboration with MIT and Monsanto, which sought to showcase the engineering and design versatility of plastics.  Visitors of Tomorrowland walked through the attraction and marveled at its features --- microwave ovens, wall-mounted TVs, adjustable sinks, modular bedrooms --- which would, of course, become commonplace in the decades to come.  Likewise, Xanadu invited thousands of guests each day to see a possible home of tomorrow, augmented by technology that could be customized to conform to the changing needs and shapes of American families.",
    source: "Hannah Zeavin, \"The False Promise of the First 'Smart' Homes,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/the-false-promise-of-the-first-smart-homes/",
    tags: ["academic","the-mit-press-reader","technology","art","psychology","economics"], difficulty: "advanced", word_count: 420
  },
  {
    id: 10, title: "How the Amish Let Technology in Without Letting It Take Over", created_at: "2026-08-12T02:15:23.78859+00:00",
    en: "After three years studying the community, I came to see that the real question isn't what technology can do, but what it asks us to give up.  Advertisements for Amish-friendly technologies, such as the Classic Word Processor and the black-box phone.  Source: The Plain Communities Business Exchange.  In 2012, Big Tech was beginning to feel less like a burgeoning industry and more like a fact of daily life.  Facebook had hit one billion monthly users , about half of America was regularly using smartphones , and the country was collectively spending about 120 billion minutes a month on social media.  From directions to dating to deliveries, the most intimate and mundane routines of American life had suddenly become intermediated by apps that increasingly blurred the lines between convenience and dependence.  Lindsay Ems is the author of \" Virtually Amish . \" An open-access version of the book can be found here .  Yet, it was at this inflection point --- when everyone seemed to be emphatically saying yes to technology --- that I began to seriously investigate why a certain community preferred to say no .  I first began studying the Amish in 2012 as a doctoral researcher of media studies at Indiana University, located within a few hours of settlements in Elkhart, LaGrange, and Daviess counties.  Going into the project, I knew what most everyone else did: that the Amish prized simple living, communal values, and religious discipline, while resisting certain technologies such as cars, TV, and electricity.  In my initial conversations with Amish leaders, they told me that they were worried that new technology might diminish the sense of purpose people in their communities feel.  They worried that new communication tools, such as smartphones and social media, would disrupt rituals, traditions, and their established communication patterns.  Above all, they wanted to preserve their shared culture in which each person felt spiritually connected to their neighbors and the natural world.  But the more time I spent in these communities --- three years total --- the more I realized that my original frame on their world was too myopic: It wasn't the metaphorical fish I was interested in; it was the water.  Which is to say that I became less intrigued by Amish restrictions on technology than by the social world they sought to preserve and protect with those restrictions.  In the end, I came to realize that the Amish are, in fact, technology- agnostic .",
    source: "Lindsay Ems, \"How the Amish Let Technology in Without Letting It Take Over,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/how-the-amish-let-technology-in-without-letting-it-take-over/",
    tags: ["academic","the-mit-press-reader","technology","society","themitpressreader"], difficulty: "advanced", word_count: 406
  },

    id: 8, title: "The Lost Civic Life of Movie Rental Stores", created_at: "2026-08-12T02:13:18.729807+00:00",
    en: "Decades before recommendation algorithms, video stores served as social hubs where conversation and camaraderie became a form of taste-making.  Hollywood Video was a VHS, DVD, and video game rental shop company started in 1988.  It ceased operations, after declaring bankruptcy, in 2010.  Credit: Flickr / The MIT Press Reader If a DVD owner from the year 2005 found herself transported back to a video store circa 1982, she would likely find the space remarkably familiar: videocassette cases lining the walls, a movie playing on a television set, maybe some marquee lights framing an announcement board over the checkout counter --- all in all, not terribly unlike the video store of two and a half decades later.  Joshua M.  Greenberg is the author of \" From Betamax to Blockbuster ,\" from which this article is adapted.  However, understanding the video store simply as a transactional space in which money is exchanged for goods and services misses the forest for the trees.  That same time-traveling video renter might find herself startled by the employee offering to recommend a movie, or by the knot of customers hanging out by the counter, shooting the breeze and discussing film.  The early video store was often a place to talk as well as to shop, and the persona and expertise of retailers and clerks structured the consumer experience of home video as much as the shelves on the wall.  The people behind the counter, and in many cases those in front of it, were not merely moving through the consumption junction but were, in fact, integral parts of it.  Consider the English pub, the French café, the German beer garden, or the American tavern: These are places where patrons can buy food or drink.  But an analysis that focuses only on the producer/consumer exchange would overlook the vital role these and other spaces play in establishing and maintaining broader social relationships.  Sociologist Ray Oldenburg describes such spaces as \" third places ,\" a category that he uses to refer to \"a great variety of public places that host the regular, voluntary, informal, and happily anticipated gatherings of individuals beyond the realms of home and work. \" Such places serve to unite the neighborhood through simple, day-to-day interaction.  For example, Oldenburg writes, \"In many [American] communities, the post office served this function well when everyone had a mailbox there; when everybody had to walk or drive to it; and it was kept open, by law, twenty-four hours a day.",
    source: "Joshua M. Greenberg, \"The Lost Civic Life of Movie Rental Stores,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/the-lost-civic-life-of-movie-rental-stores/",

  },

    id: 7, title: "Jules Verne's Empty Dream of Spaceflight", created_at: "2026-08-12T02:03:08.437399+00:00",
    en: "In \"From the Earth to the Moon,\" scientific advancement is treated as destiny --- but no one quite asks why.  Source : An original illustration by Henri de Montaut from the 1868 edition of Jules Verne's \"From the Earth to the Moon,\" rotated 90 degrees clockwise.  About halfway through \"From the Earth to the Moon\"--- which is to say, still firmly on Earth--- Jules Verne tells us that in a time when a 30-mile-per-hour train is considered speedy, the public finds it \"natural\" to launch a projectile to the moon.  Granted, this is in contrast to the newer idea of putting a person inside that projectile, but even that, a few pages later, is described as something that would happen \"sooner or later. \" Malka Older ' s essay appeared in an annotated version of Jules Verne's \" From Earth to the Moon . \" Natural is an interesting word to describe an endeavor that requires digging an enormous hole on a hill in uncultivated land in Florida, mining and melting a bunch of aluminum, and pouring it in --- not to mention then setting a formal table to eat a multicourse meal at the bottom of it.  But leaving that implication of human depredations aside for the moment, the suggestion of inevitability --- the \"because it's there\" school of lunar landings --- also serves as a reminder that no one has really given any reason for launching this incredible enterprise.  Over the course of 200 pages, describing extreme efforts of engineering, mining, astronomy, and fundraising, no clear rationale is given for traveling to the moon.  In the book, Impey Barbicane, the redoubtable ballistics expert who comes up with the idea, asks, \"What for? \" about decorating the capsule's exterior, demonstrating how rational and unartistic he is.  That is, in contrast to the more emotional, romantic Michel Ardan.  But he never asks the same question about the voyage itself.  In his inspiring oration, which ignites national and eventually global enthusiasm for the endeavor, he says only that no one has done it before, that despite all the accumulated knowledge about the moon, \"no one has ever established direct communication with her,\" a statement that provokes \"involuntary expressions of surprise. \" The embodiment of rationalism is seemingly conducting a major endeavor without a reason.  In fact, however, the reason is already implied in his statement, so obvious to everyone that he doesn't need to say anything more.",
    source: "Malka Older, \"Jules Verne's Empty Dream of Spaceflight,\" The MIT Press Reader, 2026. https://thereader.mitpress.mit.edu/jules-vernes-empty-dream-of-spaceflight/",
    tags: ["academic","the-mit-press-reader","science","art","society","space"], difficulty: "advanced", word_count: 406
  },
  {
    id: 6, title: "Everyday Technology Is Becoming a Black Box. Is There a Cost?", created_at: "2026-08-12T01:52:21.308121+00:00",
    en: "Children once learned by taking things apart.  Today's devices do not provide that rewarding activity --- and the cognitive consequences may be considerable.  Source: Adobe It is difficult to overstate how profoundly humanity has been influenced by the transmission and accumulation of knowledge.  But we can begin to appreciate this when we consider cases of individuals attempting to create everyday artifacts \"from scratch. \" If divisions of cognitive labor are powerful engines of technological growth, what happens to humans when those divisions no longer exist?  Frank C.  Keil is the author of \" The Disappearance of Insight ,\" from which this article is adapted.  This scenario has been repeatedly depicted in novels where a person travels back in time to an earlier era.  In Mark Twain's \"A Connecticut Yankee in King Arthur's Court , \" for example, a mechanic named Hank, who works in a 19th-century arms factory in Connecticut (Twain's present day), is transported into the Arthurian era --- specifically, 528 AD.  He goes on to easily create devices from his era, such as modern guns and bicycles.  In the end, Hank's technological improvements are rejected by the powerful church hierarchy, which sets out to destroy him.  Hank escapes by returning to his own era.  Likewise, in Leo Frankowski's \"Conrad Stargard\" novels, published in the '80s, a Polish army engineer is transported back to 1231 AD in Poland and soon helps accelerate his country's technology to safeguard it from a Mongol invasion.  He knows from his history studies that the invasion will come in about 10 years.  He succeeds and goes on to create a glorious future for Poland.  Inspiring and enjoyable as Twain's and Frankowski's tales may be, they both present highly unrealistic visions of what solo experts could actually achieve in earlier eras.  Indeed, both authors, intentionally or not, greatly underestimate the challenges their protagonists would face.  If you want a more accurate picture, function init() {
  const savedTheme = localStorage.getItem('dailyReadingTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';

  // Use embedded data directly - no external dependencies
  document.getElementById('dbStatus').innerHTML = '<span class="status-dot online"></span>' + DB_PASSAGES.length + ' articles';

  // Today's article = the most recent one in the collection
  var latest = DB_PASSAGES[0];
  for (var i = 1; i < DB_PASSAGES.length; i++) {
    if (new Date(DB_PASSAGES[i].created_at) > new Date(latest.created_at)) latest = DB_PASSAGES[i];
  }
  selectedPassageId = latest.id;

  renderToday();
  renderArchive();
  updateDateBadge();
}
