<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reading</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --accent: #8b5e3c;
  --accent-light: #f0e4d8;
  --border: #e0d5c1;
  --shadow: 0 2px 16px rgba(0,0,0,0.06);
  --highlight: #fff3cd;
  --tooltip-bg: #1e1b18;
  --tooltip-text: #f5efe4;
  --tag-bg: #f5efe4;
  --tag-text: #6b5e4a;
  --input-bg: #faf8f5;
}
[data-theme="dark"] {
  --bg: #1a1815;
  --card-bg: #252220;
  --text: #e8dcc8;
  --text-secondary: #a69880;
  --accent: #c9975a;
  --accent-light: #3d3022;
  --border: #3d3424;
  --shadow: 0 2px 16px rgba(0,0,0,0.3);
  --highlight: #4a3f1a;
  --tooltip-bg: #f0e6d3;
  --tooltip-text: #1e1b18;
  --tag-bg: #2d2820;
  --tag-text: #a69880;
  --input-bg: #252220;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Georgia', 'Times New Roman', 'Noto Serif', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
  transition:background 0.3s,color 0.3s;
}
.container { max-width:860px; margin:0 auto; padding:20px 24px 60px; }
.header {
  display:flex; justify-content:space-between; align-items:center;
  padding:20px 0; border-bottom:1px solid var(--border); margin-bottom:28px;
}
.header h1 { font-size:1.4rem; font-weight:400; letter-spacing:0.04em; color:var(--accent); }
.header-actions { display:flex; gap:10px; align-items:center; }
.header-btn {
  background:none; border:1px solid var(--border); color:var(--text-secondary);
  padding:6px 14px; border-radius:20px; cursor:pointer; font-size:0.82rem;
  font-family:inherit; transition:all 0.2s;
}
.header-btn:hover { border-color:var(--accent); color:var(--accent); }
.status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }
.status-dot.online { background:#4a7c59; }
.status-dot.offline { background:#c44; }
.tabs { display:flex; gap:0; margin-bottom:24px; border-bottom:1px solid var(--border); }
.tab {
  padding:8px 20px; cursor:pointer; font-size:0.9rem; color:var(--text-secondary);
  border-bottom:2px solid transparent; transition:all 0.2s; background:none; border-top:none;
  border-left:none; border-right:none; font-family:inherit;
}
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.daily-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;
}
.date-badge {
  font-size:0.82rem; color:var(--text-secondary); background:var(--accent-light);
  padding:4px 14px; border-radius:20px;
}
.passage-card {
  background:var(--card-bg); border-radius:10px; padding:32px 28px;
  box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:24px;
}
.passage-card h2 {
  font-size:1.2rem; font-weight:400; margin-bottom:20px;
  color:var(--accent); letter-spacing:0.02em;
}
.english-text {
  font-size:1.08rem; line-height:1.5; margin-bottom:24px; text-align:justify;
  -webkit-font-smoothing: antialiased;
}
.english-text .word {
  cursor:pointer; transition:background 0.15s; border-radius:3px; padding:1px 2px; margin:0 -1px;
}
.english-text .word:hover { background:var(--highlight); }
.english-text .word.active { background:var(--highlight); }
.source-citation {
  font-size:0.82rem; color:var(--text-secondary); font-style:italic;
  padding-top:14px; border-top:1px solid var(--border);
}
.word-tooltip {
  position:fixed; z-index:1000; background:var(--tooltip-bg); color:var(--tooltip-text);
  padding:14px 18px; border-radius:10px; font-size:0.88rem; max-width:320px;
  box-shadow:0 8px 30px rgba(0,0,0,0.25); display:none; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.word-tooltip .word-head { font-size:1.1rem; font-weight:600; margin-bottom:6px; }
.word-tooltip .phonetic { color:#c9975a; font-size:0.8rem; margin-bottom:6px; }
.word-tooltip .def { margin-bottom:4px; }
.word-tooltip .def strong { color:#c9975a; }
.word-tooltip .loading { opacity:0.7; font-style:italic; }
.passages-list { display:none; }
.passages-list.show { display:block; }
.search-bar {
  display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;
}
.search-input {
  flex:1; min-width:200px; padding:10px 16px; border:1px solid var(--border);
  border-radius:20px; font-size:0.88rem; background:var(--input-bg); color:var(--text);
  font-family:inherit;
}
.search-input:focus { outline:none; border-color:var(--accent); }
.archive-list { display:flex; flex-direction:column; gap:10px; }
.archive-item {
  background:var(--card-bg); border:1px solid var(--border); border-radius:8px;
  padding:18px 22px; cursor:pointer; transition:all 0.2s; box-shadow:var(--shadow);
}
.archive-item:hover { border-color:var(--accent); transform:translateY(-1px); }
.archive-item .archive-date { font-size:0.78rem; color:var(--text-secondary); margin-bottom:4px; }
.archive-item .archive-title { font-size:1rem; color:var(--text); margin-bottom:6px; }
.archive-item .archive-preview {
  font-size:0.85rem; color:var(--text-secondary); overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.archive-item .archive-tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.archive-tag {
  font-size:0.72rem; background:var(--tag-bg); color:var(--tag-text);
  padding:2px 10px; border-radius:10px;
}
.archive-item .archive-source { font-size:0.78rem; color:var(--accent); margin-top:6px; font-style:italic; }
.modal-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);
  z-index:999; display:none; justify-content:center; align-items:center; padding:20px;
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--card-bg); border-radius:14px; max-width:800px; width:100%;
  max-height:85vh; overflow-y:auto; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.3);
  position:relative;
}
.modal-close {
  position:absolute; top:14px; right:18px; background:none; border:none;
  font-size:1.4rem; cursor:pointer; color:var(--text-secondary); line-height:1;
}
.modal-close:hover { color:var(--text); }
.no-results { text-align:center; padding:40px; color:var(--text-secondary); font-size:0.9rem; }
.reading-stats { font-size:0.78rem; color:var(--text-secondary); }
.loading-indicator { text-align:center; padding:60px; color:var(--text-secondary); }
.spinner {
  display:inline-block; width:24px; height:24px; border:3px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
.loading-dot { animation:pulse 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2) { animation-delay:0.2s; }
.loading-dot:nth-child(3) { animation-delay:0.4s; }
@media (max-width:640px) {
  .container { padding:10px 14px 40px; }
  .passage-card { padding:22px 16px; }
  .english-text { font-size:1rem; }
  .header h1 { font-size:1.1rem; }
  .tab { padding:8px 14px; font-size:0.82rem; }
}
</style>
</head>
<body>

<div class="container">

  <header class="header">
    <h1>Daily Reading</h1>
    <div class="header-actions">
      <span style="font-size:0.72rem;color:var(--text-secondary);display:flex;align-items:center;" id="dbStatus">
        <span class="status-dot offline"></span>Loading
      </span>
      <button class="header-btn" onclick="toggleTheme()" id="themeBtn">Dark</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="today" onclick="switchTab('today')">Today</button>
    <button class="tab" data-tab="archive" onclick="switchTab('archive')">Archive</button>
  </nav>

  <section id="todaySection">
    <div class="daily-header">
      <span class="date-badge" id="dateBadge"></span>
      <span class="reading-stats" id="readingStats"></span>
    </div>
    <div id="todayPassage"></div>
  </section>

  <section id="archiveSection" class="passages-list">
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search by title, keyword, author, date..." oninput="debounceSearch()">
      <button class="header-btn" onclick="document.getElementById('searchInput').value=''; renderArchive();">Clear</button>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </section>

</div>

<div class="word-tooltip" id="wordTooltip"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModalDirect()">&times;</button>
    <div id="modalInner"></div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const SUPABASE_URL = 'https://pdrtmmyqzoqnzlzywcia.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkcnRtbXlxem9xbnpsenl3Y2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Mzc0ODYsImV4cCI6MjEwMjAxMzQ4Nn0.F805AyjUEBx_nBE2QFL5JZvtpxAVkO7nTwZqvdC7zVg';

// ==================== FALLBACK PASSAGES ====================
const FALLBACK_PASSAGES = [
  {
    id: 1, title: "The Vertical City and Its Discontents", created_at: "2026-01-01T00:00:00Z",
    en: "The skyscraper, that quintessential emblem of twentieth-century ambition, has undergone a profound ontological shift in the first decades of the twenty-first. No longer merely an extrapolation of capitalist exuberance -- a phallic extrusion of steel and glass thrust skyward in defiance of gravity -- the contemporary tower aspires to a more nuanced synthesis of ecological stewardship, social porosity, and formal experimentation. Yet this aspiration is frequently thwarted by the intractable realities of speculative development: the exigencies of the pro forma, the tyranny of the floor plate, and the relentless optimization of net-to-gross ratios conspire to produce a generic verticality that belies its architects' loftier pretensions. Consider the recent proliferation of mixed-use supertalls across Southeast Asian metropolises. These towers, ostensibly conceived as self-contained urban ecosystems, often devolve into stratified enclaves where the public realm is reduced to a simulacrum of urbanity -- a manicured podium garden accessible only to residents, a sky lobby whose breathtaking panorama is contingent upon a keycard. The architectural avant-garde has responded with a repertoire of formal strategies intended to subvert this hermetic verticality. Rotated floor plates, interlocking volumes, and skybridges that weave between adjacent towers gesture toward a porosity that the programmatic logic of the building ultimately resists.",
    source: "Keller Easterling, \"Extrastatecraft: The Power of Infrastructure Space\" (Verso, 2014)",
    tags: ["architecture","urbanism","skyscraper"], difficulty: "advanced", word_count: 385
  }
];

// ==================== SUPABASE CLIENT ====================
let supabase = null;
let dbPassages = [];

function initSupabase() {
  if (!SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    updateDbStatus(false);
    return;
  }
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return supabase;
  } catch (e) {
    console.warn('Supabase init failed:', e);
    updateDbStatus(false);
    return null;
  }
}

function updateDbStatus(online) {
  const el = document.getElementById('dbStatus');
  if (online) {
    el.innerHTML = '<span class="status-dot online"></span>Online';
  } else {
    el.innerHTML = '<span class="status-dot offline"></span>Local';
  }
}

// ==================== FETCH DATA ====================
async function fetchPassages() {
  // Try Supabase first
  if (supabase) {
    try {
      const { data, error } = await supabase
        .from('passages')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(200);
      if (!error && data && data.length > 0) {
        dbPassages = data.map(p => ({...p}));
        updateDbStatus(true);
        console.log('Loaded ' + data.length + ' passages from Supabase');
        return;
      }
    } catch (e) {
      console.warn('Supabase fetch failed:', e.message);
    }
  }

  // Fallback: local JSON
  try {
    const resp = await fetch('passages-data.json');
    if (resp.ok) {
      const text = await resp.text();
      if (text.trim().length > 0) {
        const data = JSON.parse(text);
        if (data && data.length > 0) {
          dbPassages = data.map(p => ({...p}));
          updateDbStatus(true);
          console.log('Loaded ' + data.length + ' passages from local data');
          return;
        }
      }
    }
  } catch (e) {
    console.warn('Local data load failed:', e.message);
  }

  updateDbStatus(false);
  console.log('Using fallback passages');
}

function allPassages() {
  return dbPassages.length > 0 ? dbPassages : FALLBACK_PASSAGES;
}

// ==================== APP STATE ====================
const START_DATE = new Date('2026-01-01');
let currentTab = 'today';
let selectedPassageId = null;
let searchTimeout = null;

function debounceSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(renderArchive, 300);
}

// ==================== INIT ====================
async function init() {
  const savedTheme = localStorage.getItem('dailyReadingTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';

  initSupabase();
  await fetchPassages();

  const passages = allPassages();
  const today = new Date();
  const dayIndex = Math.floor((today - START_DATE) / (1000 * 60 * 60 * 24));
  selectedPassageId = (Math.abs(dayIndex) % Math.max(passages.length, 1)) + 1;

  renderToday();
  renderArchive();
  updateDateBadge();
}

function updateDateBadge() {
  const today = new Date();
  const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('dateBadge').textContent = today.toLocaleDateString('en-US', options);
  const count = allPassages().length;
  document.getElementById('readingStats').textContent = count + ' articles in collection';
}

// ==================== THEME ====================
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('dailyReadingTheme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? 'Light' : 'Dark';
}

// ==================== TABS ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + tab + '"]').classList.add('active');
  document.getElementById('todaySection').style.display = tab === 'today' ? 'block' : 'none';
  document.getElementById('archiveSection').classList.toggle('show', tab === 'archive');
  if (tab === 'archive') renderArchive();
}

// ==================== TODAY'S PASSAGE ====================
function findPassageById(id) {
  return allPassages().find(p => p.id === id);
}

function renderToday() {
  const passage = findPassageById(selectedPassageId) || allPassages()[0];
  if (!passage) {
    document.getElementById('todayPassage').innerHTML = '<div class="no-results">No articles available.</div>';
    return;
  }
  updateDateBadge();

  const words = (passage.en || '').split(/(\s+)/g);
  const wordElements = words.map(token => {
    if (/^\s+$/.test(token)) return token;
    const wordOnly = token.replace(/[^a-zA-Z'-]/g, '');
    if (wordOnly.length <= 1) return token;
    return '<span class="word" data-word="' + wordOnly.toLowerCase() + '" onclick="lookupWord(event,\'' + wordOnly.toLowerCase().replace(/'/g,"\\'") + '\')">' + token + '</span>';
  }).join('');

  const html = '<div class="passage-card">' +
    '<h2>' + escapeHtml(passage.title) + '</h2>' +
    '<div class="english-text" id="englishText">' + wordElements + '</div>' +
    '<div class="source-citation">' + formatSource(passage.source) + '</div>' +
    '</div>';

  document.getElementById('todayPassage').innerHTML = html;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatSource(source) {
  if (!source) return '';
  const urlMatch = source.match(/(https?:\/\/[^\s,]+)/);
  var formatted = escapeHtml(source);
  if (urlMatch) {
    formatted = formatted.replace(urlMatch[0],
      '<a href="' + urlMatch[0] + '" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">[Read original]</a>');
  }
  return formatted;
}

// ==================== WORD LOOKUP ====================
let tooltipTimeout = null;
let lookupCache = {};

async function lookupWord(event, word) {
  event.stopPropagation();
  const tooltip = document.getElementById('wordTooltip');
  document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
  event.target.classList.add('active');

  const rect = event.target.getBoundingClientRect();
  let left = rect.left + rect.width / 2;
  let top = rect.bottom + 8;
  if (left + 160 > window.innerWidth) left = window.innerWidth - 170;
  if (left < 10) left = 10;
  if (top + 200 > window.innerHeight) top = rect.top - 200;

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
  tooltip.style.display = 'block';
  tooltip.innerHTML = '<div class="word-head">' + word + '</div><div class="loading"><span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span> Looking up</div>';

  if (lookupCache[word]) {
    tooltip.innerHTML = lookupCache[word];
    resetTooltipTimer();
    return;
  }

  try {
    const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
    if (!res.ok) throw new Error('Not found');
    const data = await res.json();
    const entry = data[0];
    let html = '<div class="word-head">' + entry.word + '</div>';
    const phonetic = entry.phonetics && entry.phonetics[0];
    if (phonetic && phonetic.text) html += '<div class="phonetic">' + phonetic.text + '</div>';
    else if (entry.phonetic) html += '<div class="phonetic">/' + entry.phonetic.replace(/^\//,'').replace(/\/$/,'') + '/</div>';

    let count = 0;
    for (const m of entry.meanings) {
      if (count >= 3) break;
      html += '<div style="color:#c9975a;font-size:0.75rem;margin-top:4px;">' + m.partOfSpeech + '</div>';
      for (const d of m.definitions) {
        if (count >= 3) break;
        html += '<div class="def"><strong>' + (count+1) + '.</strong> ' + d.definition + '</div>';
        count++;
      }
    }
    lookupCache[word] = html;
    tooltip.innerHTML = html;
  } catch (err) {
    lookupCache[word] = '<div class="word-head">' + word + '</div><div style="color:var(--text-secondary);font-size:0.8rem;">Definition not found</div>';
    tooltip.innerHTML = lookupCache[word];
  }

  resetTooltipTimer();
}

function resetTooltipTimer() {
  clearTimeout(tooltipTimeout);
  tooltipTimeout = setTimeout(() => {
    document.getElementById('wordTooltip').style.display = 'none';
    document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
  }, 8000);
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('word')) {
    document.getElementById('wordTooltip').style.display = 'none';
    document.querySelectorAll('.word.active').forEach(w => w.classList.remove('active'));
    clearTimeout(tooltipTimeout);
  }
});

// ==================== ARCHIVE ====================
function renderArchive() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const list = document.getElementById('archiveList');
  let filtered = [...allPassages()];

  if (searchTerm) {
    filtered = filtered.filter(p =>
      (p.title && p.title.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.en && p.en.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.source && p.source.toLowerCase().indexOf(searchTerm) !== -1) ||
      (p.tags && p.tags.some(t => t.toLowerCase().indexOf(searchTerm) !== -1))
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">No matching articles found.</div>';
    return;
  }

  list.innerHTML = filtered.map(p => {
    const d = p.created_at ? new Date(p.created_at) : new Date();
    const dateStr = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    const preview = (p.en || '').replace(/\s+/g,' ').substring(0, 140) + '...';
    const tags = p.tags && Array.isArray(p.tags) ? p.tags : [];
    const srcPreview = (p.source || '').substring(0, 80);

    return '<div class="archive-item" onclick="openPassage(' + p.id + ')">' +
      '<div class="archive-date">' + dateStr + '</div>' +
      '<div class="archive-title">' + escapeHtml(p.title) + '</div>' +
      '<div class="archive-preview">' + escapeHtml(preview) + '</div>' +
      '<div class="archive-tags">' + tags.map(t => '<span class="archive-tag">' + escapeHtml(t) + '</span>').join('') + '</div>' +
      '<div class="archive-source">' + escapeHtml(srcPreview) + '</div>' +
      '</div>';
  }).join('');
}

// ==================== MODAL ====================
function openPassage(id) {
  const passage = findPassageById(id);
  if (!passage) return;

  const words = (passage.en || '').split(/(\s+)/g);
  const wordElements = words.map(token => {
    if (/^\s+$/.test(token)) return token;
    const wordOnly = token.replace(/[^a-zA-Z'-]/g, '');
    if (wordOnly.length <= 1) return token;
    return '<span class="word" data-word="' + wordOnly.toLowerCase() + '" onclick="lookupWord(event,\'' + wordOnly.toLowerCase().replace(/'/g,"\\'") + '\')">' + token + '</span>';
  }).join('');

  document.getElementById('modalInner').innerHTML =
    '<h2 style="color:var(--accent);font-weight:400;margin-bottom:20px;">' + escapeHtml(passage.title) + '</h2>' +
    '<div class="english-text">' + wordElements + '</div>' +
    '<div class="source-citation" style="margin-bottom:20px;">' + formatSource(passage.source) + '</div>';

  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
  document.getElementById('wordTooltip').style.display = 'none';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModalDirect();
});

// ==================== START ====================
init();
</script>
