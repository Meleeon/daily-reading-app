name: Daily Passage Generator

on:
  schedule:
    # Run at 22:00 UTC (6:00 AM Beijing time) every day
    - cron: '0 22 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate daily passage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run generate

      - name: Commit passages data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add passages-data.json data.js
          git commit -m "Update passages data [skip ci]" || true
          git push
